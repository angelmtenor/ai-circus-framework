# Served by nginx-unprivileged (UID 101, no root, no capabilities) — hence :8080, not :80.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The Dockerfile pre-compresses every text asset at build time (gzip -9), so the
    # multi-MB JS chunks cost no CPU per request; on-the-fly gzip covers anything else.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # nginx drops server-level add_header lines in any location that sets its own, so the
    # security headers are repeated per location.
    location /assets/ {
        # Vite content-hashes every file under /assets/ — a changed file is a new URL,
        # so browsers may keep these forever.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        # index.html (and the SPA fallback) must be revalidated, or a redeploy keeps
        # serving the previous build's chunk names.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
