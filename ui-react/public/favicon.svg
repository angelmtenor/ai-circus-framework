<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 148" width="148" height="148" role="img" aria-label="AI Circus">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#0b1633"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf9ff"/>
      <stop offset="1" stop-color="#33c7ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="144" height="144" rx="22" fill="url(#bg)" stroke="#1c3a5e" stroke-width="2"/>

  <g filter="url(#glow)">
    <g fill="none" stroke="url(#neon)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26 112 L74 34 L122 112"/>
      <line x1="74" y1="34" x2="74" y2="16"/>
      <line x1="42" y1="112" x2="106" y2="112"/>
    </g>
    <circle cx="74" cy="10" r="7" fill="#eafeff"/>
  </g>
</svg>
