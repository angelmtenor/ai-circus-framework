# ai-circus-framework — full platform.
#
# Layout: infra (identity, storage, ingress) first, then backend services
# (services/*), then the UI. Every HTTP service other than Traefik itself
# publishes no host port — Traefik is the single entrypoint, which maps 1:1 onto a
# Kubernetes Ingress when this platform moves there (see README "Kubernetes path").
#
# App services (platform-registry, etl-*, training, prediction, llm-gateway,
# assistant, rag-agent, ui-react) are appended here as they're built
# (see the build order in the project plan) — this file currently wires the infra
# layer: postgres, logto, qdrant, minio, traefik.

name: ai-circus-framework

networks:
  ai-circus:
    driver: bridge

volumes:
  postgres-data:
  qdrant-storage:
  minio-data:
  ollama-data:

services:
  # ── Ingress ─────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.7.10
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=ai-circus-framework_ai-circus"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true" # local dev only — put behind auth or disable before any real deployment
    environment:
      # Pin the Docker client API version Traefik's provider negotiates with — some
      # Docker Engine builds reject the client's default fallback version.
      DOCKER_API_VERSION: "1.41"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [ai-circus]
    restart: unless-stopped
    mem_limit: 256m

  # ── Identity (Logto: hosted+branded sign-in, Organizations = tenants, roles) ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    ports:
      # Not HTTP, so not routed through Traefik — published for local (non-docker)
      # dev of services like platform-registry, and ad-hoc `psql` access.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [ai-circus]
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  logto:
    image: svhd/logto:1.42.0
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe; npm start"]
    environment:
      TRUST_PROXY_HEADER: ${LOGTO_TRUST_PROXY_HEADER:-1}
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/logto
      ENDPOINT: http://logto.localhost
      ADMIN_ENDPOINT: http://admin.logto.localhost
      ENDPOINT_COOKIE_SECRET: ${LOGTO_ENDPOINT_COOKIE_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ai-circus]
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.logto.rule=Host(`logto.localhost`)"
      - "traefik.http.routers.logto.entrypoints=web"
      - "traefik.http.routers.logto.service=logto"
      - "traefik.http.services.logto.loadbalancer.server.port=3001"
      - "traefik.http.routers.logto-admin.rule=Host(`admin.logto.localhost`)"
      - "traefik.http.routers.logto-admin.entrypoints=web"
      - "traefik.http.routers.logto-admin.service=logto-admin"
      - "traefik.http.services.logto-admin.loadbalancer.server.port=3002"

  # ── Vector store (conversational_rag scenarios; one collection per tenant) ────
  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrant-storage:/qdrant/storage
    ports:
      # Loopback-only (like platform-registry below), for rag-agent/etl-vectorize
      # running outside Docker (local, non-container dev) to still reach it. Qdrant
      # has no built-in auth of its own — it must NEVER be routed through Traefik's
      # public entrypoint (0.0.0.0), which would let anyone who can reach this host
      # on port 80 read/write every tenant's vectors directly, bypassing rag-agent's
      # entitlement checks and per-tenant collection naming entirely.
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
    networks: [ai-circus]
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      # No curl/wget in this image — a bare TCP connect is enough to know the gRPC/HTTP
      # port is accepting connections.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Object storage (datasets, model artifacts, uploaded documents) ────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [ai-circus]
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-api.rule=Host(`minio.localhost`)"
      - "traefik.http.routers.minio-api.entrypoints=web"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=Host(`console.minio.localhost`)"
      - "traefik.http.routers.minio-console.entrypoints=web"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

  # ── Backend services (each generated via `scripts/new_service.sh`) ────────────
  platform-registry:
    build:
      context: .
      dockerfile: services/platform-registry/Dockerfile
    environment:
      APP_ENVIRONMENT: docker
      LOG_LEVEL: INFO
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Back the admin-only /llm-settings/* endpoints (view/test/configure
      # llm-gateway's provider models) — see platform_registry/core/llm_settings.py.
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ENGINEERING_DEMO_API_KEY: ${ENGINEERING_DEMO_API_KEY}
      LLM_GATEWAY_API_KEY: ${LITELLM_MASTER_KEY}
      # Back require_org_match (see platform_registry/api.py) — GET /entitlements/*
      # is called directly from ui-react's browser code (see below), so it needs the
      # same identity resolution every other service uses, not just a "trust the
      # caller" assumption. DEV ONLY passthrough — leave AUTH_DISABLED unset
      # (defaults to "false") once Logto is configured; see settings.yaml.
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      LOGTO_ISSUER: ${LOGTO_ISSUER}
      LOGTO_API_RESOURCE_INDICATOR: ${LOGTO_API_RESOURCE_INDICATOR}
      LOGTO_JWKS_URL: ${LOGTO_ISSUER}/jwks
      # ui-react calls this API directly from the browser — react.localhost is the
      # Traefik-served build, localhost:5173 the Vite dev server.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://react.localhost,http://localhost:5173}
    volumes:
      # scenarios/*.yaml is human-edited config, not a data artifact — a read-only
      # bind mount here (unlike MinIO for datasets/models) keeps edits live without
      # a rebuild.
      - ./scenarios:/app/scenarios:ro
    ports:
      # Not routed through Traefik (see below) — published only so services running
      # outside Docker (local, non-container dev) can still reach it.
      - "127.0.0.1:${PLATFORM_REGISTRY_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      llm-gateway:
        condition: service_started
    networks: [ai-circus]
    restart: unless-stopped
    mem_limit: 512m
    # Not exposed through Traefik — only other backend services on the docker
    # network call its entitlement-check API (see AGENTS.md).

  # One-shot job: `docker compose up --build etl-tabular` (see `make pipeline`).
  # Processes every tabular_ml scenario in SCENARIOS (empty/unset = all) in one run.
  etl-tabular:
    build:
      context: .
      dockerfile: services/etl-tabular/Dockerfile
    profiles: ["pipeline"]
    environment:
      APP_ENVIRONMENT: docker
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./scenarios:/app/scenarios:ro
    depends_on:
      minio:
        condition: service_healthy
    networks: [ai-circus]
    mem_limit: 1g

  # Long-running: serves POST /predict/{scenario_slug} for every tabular_ml scenario
  # in SCENARIOS (empty/unset = all), across every tenant.
  prediction:
    build:
      context: .
      dockerfile: services/prediction/Dockerfile
    environment:
      APP_ENVIRONMENT: docker
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # DEV ONLY passthrough — leave AUTH_DISABLED unset (defaults to "false") once
      # Logto is configured; see prediction/settings.yaml.
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ENGINEERING_DEMO_API_KEY: ${ENGINEERING_DEMO_API_KEY}
      LOGTO_ISSUER: ${LOGTO_ISSUER}
      LOGTO_API_RESOURCE_INDICATOR: ${LOGTO_API_RESOURCE_INDICATOR}
      LOGTO_JWKS_URL: ${LOGTO_ISSUER}/jwks
      # ui-react calls this API directly from the browser — react.localhost is the
      # Traefik-served build, localhost:5173 the Vite dev server.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://react.localhost,http://localhost:5173}
    volumes:
      - ./scenarios:/app/scenarios:ro
    depends_on:
      minio:
        condition: service_healthy
      platform-registry:
        condition: service_started
    networks: [ai-circus]
    restart: unless-stopped
    mem_limit: 1g
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prediction.rule=Host(`prediction.localhost`)"
      - "traefik.http.routers.prediction.entrypoints=web"
      - "traefik.http.services.prediction.loadbalancer.server.port=8000"

  # Long-running: OpenAI-compatible LiteLLM proxy — model routing + master-key auth
  # (persistent spend-tracking not enabled yet, see llm-gateway/litellm_config.yaml).
  llm-gateway:
    build:
      context: .
      dockerfile: services/llm-gateway/Dockerfile
    environment:
      APP_ENVIRONMENT: docker
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_API_BASE: ${AZURE_OPENAI_API_BASE}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Points at the `ollama` container below by default, but that container is
      # OPTIONAL (profile "ollama", not started by `docker compose up` — see below)
      # so this is only reachable once you run `make ollama-up`. Override in .env to
      # point at an Ollama instance you run yourself instead.
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://ollama:11434}
    ports:
      # Loopback-only (like platform-registry/qdrant above) — no caller in ui-react
      # ever hits llm-gateway directly (only assistant/rag-agent/platform-registry do,
      # over the internal docker network), so there's no reason to put its OpenAI-
      # compatible endpoint or LiteLLM's own admin/spend UI on the public Traefik
      # entrypoint: it's gated only by a single shared LITELLM_MASTER_KEY with no
      # rate limiting, an unnecessary internet-reachable cost/credential-stuffing
      # target for a service that only needs to be reachable from this host.
      - "127.0.0.1:${LLM_GATEWAY_PORT:-4000}:4000"
    networks: [ai-circus]
    restart: unless-stopped
    mem_limit: 512m

  # Fully local/no-API-key LLM backend for llm-gateway's `llama3` model — OPTIONAL
  # (profile "ollama"): `docker compose up`/`make up` never starts this, to avoid
  # spending RAM/disk on every boot when you already have a cloud provider key. Run
  # `make ollama-up` (or `docker compose --profile ollama up -d ollama ollama-pull`)
  # to opt in as a free, no-API-key fallback. mem_limit keeps a misbehaving
  # pull/inference from starving the rest of the stack.
  ollama:
    image: ollama/ollama:0.32.6
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    networks: [ai-circus]
    restart: unless-stopped
    mem_limit: 2g

  # One-shot: pulls the default model (~2GB) into the `ollama-data` volume on first
  # start; a no-op (fast exit) on every start after that since it's cached. 3B is the
  # floor for usable answers — the 1B tier is too inaccurate for real chat use, so
  # it's deliberately not used here even though it's a smaller download.
  ollama-pull:
    image: ollama/ollama:0.32.6
    profiles: ["ollama"]
    entrypoint: ["/bin/sh", "-c", "OLLAMA_HOST=ollama:11434 ollama pull llama3.2:3b"]
    depends_on:
      ollama:
        condition: service_started
    networks: [ai-circus]
    mem_limit: 512m

  # Long-running: chat-over-tabular-data for every tabular_ml scenario in SCENARIOS
  # (empty/unset = all), grounded in each scenario's chat.context and the trained
  # model's metadata, answered via llm-gateway.
  assistant:
    build:
      context: .
      dockerfile: services/assistant/Dockerfile
    environment:
      APP_ENVIRONMENT: docker
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      LLM_GATEWAY_API_KEY: ${LITELLM_MASTER_KEY}
      # Defaults to "llama3", which only answers once you've run `make ollama-up`
      # (see docker-compose.yml's `ollama` service — off by default). Set at least
      # one provider API key in .env and override this to gpt-4o-mini/gemini-flash/
      # deepseek-chat/groq-llama/openrouter/azure-gpt4o instead — check what's
      # actually working via the Settings page's Test/Test All buttons.
      LLM_MODEL: ${LLM_MODEL:-llama3}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ENGINEERING_DEMO_API_KEY: ${ENGINEERING_DEMO_API_KEY}
      LOGTO_ISSUER: ${LOGTO_ISSUER}
      LOGTO_API_RESOURCE_INDICATOR: ${LOGTO_API_RESOURCE_INDICATOR}
      LOGTO_JWKS_URL: ${LOGTO_ISSUER}/jwks
      # ui-react calls this API directly from the browser — react.localhost is the
      # Traefik-served build, localhost:5173 the Vite dev server.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://react.localhost,http://localhost:5173}
    volumes:
      - ./scenarios:/app/scenarios:ro
    depends_on:
      minio:
        condition: service_healthy
      platform-registry:
        condition: service_started
      llm-gateway:
        condition: service_started
      prediction:
        condition: service_started
    networks: [ai-circus]
    restart: unless-stopped
    mem_limit: 512m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.assistant.rule=Host(`assistant.localhost`)"
      - "traefik.http.routers.assistant.entrypoints=web"
      - "traefik.http.services.assistant.loadbalancer.server.port=8000"

  # One-shot job: `docker compose --profile pipeline up --build training` (after
  # etl-tabular). Trains every tabular_ml scenario in SCENARIOS in one run.
  training:
    build:
      context: .
      dockerfile: services/training/Dockerfile
    profiles: ["pipeline"]
    environment:
      APP_ENVIRONMENT: docker
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./scenarios:/app/scenarios:ro
    depends_on:
      minio:
        condition: service_healthy
    networks: [ai-circus]
    mem_limit: 2g

  # One-shot job: `docker compose --profile pipeline up --build etl-vectorize`.
  # Processes every conversational_rag scenario in SCENARIOS (empty/unset = all).
  etl-vectorize:
    build:
      context: .
      dockerfile: services/etl-vectorize/Dockerfile
    profiles: ["pipeline"]
    environment:
      APP_ENVIRONMENT: docker
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./scenarios:/app/scenarios:ro
    depends_on:
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks: [ai-circus]
    mem_limit: 1g

  # Long-running: agentic RAG chatbot (see rag-agent/core/agent.py) for every
  # conversational_rag scenario in SCENARIOS (empty/unset = all), grounded in the
  # tenant's vectorized documents when the question is in-domain, answered via
  # llm-gateway.
  rag-agent:
    build:
      context: .
      dockerfile: services/rag-agent/Dockerfile
    environment:
      APP_ENVIRONMENT: docker
      LLM_GATEWAY_API_KEY: ${LITELLM_MASTER_KEY}
      # Defaults to "llama3", which only answers once you've run `make ollama-up`
      # (see docker-compose.yml's `ollama` service — off by default). Set at least
      # one provider API key in .env and override this to gpt-4o-mini/gemini-flash/
      # deepseek-chat/groq-llama/openrouter/azure-gpt4o instead — check what's
      # actually working via the Settings page's Test/Test All buttons.
      LLM_MODEL: ${LLM_MODEL:-llama3}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ENGINEERING_DEMO_API_KEY: ${ENGINEERING_DEMO_API_KEY}
      LOGTO_ISSUER: ${LOGTO_ISSUER}
      LOGTO_API_RESOURCE_INDICATOR: ${LOGTO_API_RESOURCE_INDICATOR}
      LOGTO_JWKS_URL: ${LOGTO_ISSUER}/jwks
      # ui-react calls this API directly from the browser — react.localhost is the
      # Traefik-served build, localhost:5173 the Vite dev server.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://react.localhost,http://localhost:5173}
    volumes:
      - ./scenarios:/app/scenarios:ro
    depends_on:
      qdrant:
        condition: service_healthy
      platform-registry:
        condition: service_started
      llm-gateway:
        condition: service_started
    networks: [ai-circus]
    restart: unless-stopped
    mem_limit: 1g
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rag-agent.rule=Host(`rag-agent.localhost`)"
      - "traefik.http.routers.rag-agent.entrypoints=web"
      - "traefik.http.services.rag-agent.loadbalancer.server.port=8000"

  ui-react:
    build:
      context: .
      dockerfile: ui-react/Dockerfile
      args:
        VITE_LOGTO_APP_ID: ${UI_REACT_LOGTO_APP_ID:-}
        # Bakes the dev-login bypass into the React bundle (see root .env's DEV_MODE).
        # Only takes effect end-to-end if the backend services' AUTH_DISABLED is also
        # true (see useIdentity.ts's docstring).
        VITE_DEV_MODE: ${DEV_MODE:-false}
        VITE_DEV_ORG_ID: ${DEV_ORG_ID:-demo}
    networks: [ai-circus]
    restart: unless-stopped
    mem_limit: 128m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui-react.rule=Host(`react.localhost`)"
      - "traefik.http.routers.ui-react.entrypoints=web"
      - "traefik.http.services.ui-react.loadbalancer.server.port=80"
