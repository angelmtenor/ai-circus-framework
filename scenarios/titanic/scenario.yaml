# Seed definition for the "titanic" tutorial scenario — loaded into the `platform`
# Postgres schema by services/platform-registry at bootstrap (see scenarios/churn/
# scenario.yaml's header for how etl-tabular/training/prediction also read it).
#
# Ported from github.com/angelmtenor/data-science-keras (notebooks/titanic.ipynb, a
# 2018 Keras DNN: 0.86 ROC AUC) and modernised: engineered features, a small-data
# gradient-boosting candidate chosen by 5-fold cross-validated ROC AUC, SHAP
# explanations, leakage-free hold-out metrics — plus a Tutorial tab that walks the
# whole workflow and a Voyage tab that puts every passenger on the ship.
#
# `sample_data/titanic.csv` is generated by `scripts/prepare_titanic_dataset.py` from
# the verbatim Kaggle file next to it — rerun that script after editing the recipe.

slug: titanic
kind: tabular_ml
title: "Titanic Survival — ML Tutorial"
description: >
  Who survived the sinking of the RMS Titanic, and why? A complete, explained machine
  learning tutorial on the real passenger list — from raw data to an explained
  survival probability for any passenger you put aboard.
role_required: "scenario:titanic"
industry: tutorial
icon: "🚢"

credits:
  source: "Kaggle — Titanic: Machine Learning from Disaster"
  url: "https://www.kaggle.com/competitions/titanic"
  note: "ported from angelmtenor/data-science-keras (titanic notebook) and modernised"

chat:
  context: >
    A teaching scenario on the RMS Titanic passenger list (891 of the 2,224 people
    aboard, April 1912). A gradient-boosting classifier predicts each passenger's
    probability of surviving from their ticket class, sex, age, title (Mr/Mrs/Miss/
    Master/Rare, parsed from the name), relatives aboard, travelling-party size, fare
    per person and port of embarkation. Explain answers the way a patient data-science
    teacher would: name the concept (ROC AUC, SHAP, cross-validation, imputation,
    leakage), then tie it back to this data. Sex is used here deliberately: the model
    describes who was saved in 1912 ("women and children first"), it does not decide
    anything about people today.
  sample_questions:
    - "Why did women survive so much more often than men?"
    - "What does a ROC AUC of 0.88 actually mean?"
    - "How much did ticket class matter for women and children?"
    - "Why was the Title feature engineered from the name?"
    - "Which passengers surprised the model the most?"
    - "Why is it OK to use sex as a feature here but not in the churn scenario?"

dataset:
  bucket: "scenario-titanic"
  raw_object: "raw/titanic.csv"
  seed_file: "sample_data/titanic.csv"
  index_col: "PassengerId"
  target: "Survived"
  # Nothing is excluded: this model explains a historical event rather than making
  # decisions about people, so sex/age are the very factors under study (see the
  # tutorial's "Responsible AI" chapter; contrast with churn, which drops Gender).
  protected_features_excluded: []
  # Shown (and searchable) in the UI, never a model input.
  display_columns: ["Name"]
  feature_columns:
    - Pclass
    - Sex
    - Age
    - Title
    - SibSp
    - Parch
    - TicketGroup
    - FarePerPerson
    - Embarked

  feature_schema:
    Pclass:
      {type: categorical, label: "Ticket class", options: ["1st", "2nd", "3rd"], default: "3rd",
       info: "1st, 2nd or 3rd class — a proxy for wealth, and for where aboard a passenger slept: 1st class high up amidships, near the lifeboats; 3rd class low down at the bow and stern."}
    Sex:
      {type: categorical, label: "Sex", options: ["female", "male"], default: "male",
       info: "As recorded on the passenger list. The strongest single factor: the crew loaded lifeboats under a 'women and children first' protocol."}
    Age:
      {type: numeric, label: "Age", min: 0, max: 80, default: 28, step: 1,
       info: "Age in years (fractions for infants). 177 missing ages were filled with the median age of passengers sharing the same title and class."}
    Title:
      {type: categorical, label: "Title", options: ["Mr", "Mrs", "Miss", "Master", "Rare"], default: "Mr",
       info: "Honorific parsed from the name. Master = a boy; Miss = a girl or unmarried woman; Rare = Dr, Rev, military ranks and nobility. One feature carrying sex, age group and social rank."}
    SibSp:
      {type: numeric, label: "Siblings / spouses aboard", min: 0, max: 8, default: 0, step: 1,
       info: "How many brothers, sisters, husbands or wives this passenger travelled with."}
    Parch:
      {type: numeric, label: "Parents / children aboard", min: 0, max: 6, default: 0, step: 1,
       info: "How many parents or children this passenger travelled with (nannies count as 0)."}
    TicketGroup:
      {type: numeric, label: "Travelling party (same ticket)", min: 1, max: 7, default: 1, step: 1,
       info: "How many passengers in this list shared the same ticket number — families, friends and servants travelling together, related or not."}
    FarePerPerson:
      {type: numeric, label: "Fare per person (£)", min: 0, max: 225, default: 8, step: 0.5,
       info: "The ticket price (1912 pounds) divided by the passengers sharing it — the raw fare is per ticket, which makes a big family on a cheap ticket look rich."}
    Embarked:
      {type: categorical, label: "Port of embarkation", options: ["Southampton", "Cherbourg", "Queenstown"], default: "Southampton",
       info: "Where the passenger boarded: Southampton (England), Cherbourg (France) or Queenstown (now Cobh, Ireland)."}

  # The notebook's exploratory plots, as a live dashboard (Data & BI tab).
  default_charts:
    - {type: bar, x: Sex, y: Survived, agg: mean, color_by: Sex}
    - {type: bar, x: Pclass, y: Survived, agg: mean, color_by: Sex}
    - {type: histogram, x: Age, color_by: Survived}
    - {type: bar, x: Title, y: Survived, agg: mean, color_by: Title}
    - {type: bar, x: TicketGroup, y: Survived, agg: mean}
    - {type: box, x: Pclass, y: FarePerPerson}
    - {type: bar, x: Embarked, y: Survived, agg: mean, color_by: Pclass}
    - {type: scatter, x: Age, y: FarePerPerson, color_by: Survived}
    - {type: heatmap}

model:
  task_type: classification
  # Simplest first (Green Code). lightgbm_small_data: shallow, slow-learning,
  # subsampled boosting sized for a few hundred rows (see training/core/training.py).
  candidates: ["logistic_regression", "lightgbm_small_data"]
  # In ROC AUC points: boosting must beat the linear model by > 0.01 to be adopted.
  accuracy_gain_threshold_for_complexity: 0.01
  selection_metric: roc_auc
  cv_folds: 5
  explainability: shap
  target_label: "Survived"
  target_description: "Whether the passenger survived the sinking (1) or perished (0)."
  target_value_labels: {"0": "Perished", "1": "Survived"}

ui_extras:
  kind: voyage_explorer
  scene: ocean_liner
  tab_label: "Voyage"
  title: "RMS Titanic · 14–15 April 1912"
  subtitle: >
    Every dot is a real passenger, berthed by ticket class. Colour is the model's
    survival probability; reveal their real fate, filter a cohort, or click anyone to
    see why the model gave them the chance it did — then change them and ask "what if?".
    The ship carried 20 lifeboats: seats for 1,178 of the 2,224 aboard.
  person_noun: passenger
  zone_by: Pclass
  zones:
    - {key: "1st", label: "First class", description: "Staterooms on the upper decks amidships — a short climb to the boat deck."}
    - {key: "2nd", label: "Second class", description: "Cabins aft on the middle decks."}
    - {key: "3rd", label: "Third class", description: "Steerage on the lowest decks at the bow and stern, far from the lifeboats."}
  filters: [Sex, Title, Embarked]
  range_filters: [Age, FarePerPerson]
  name_column: Name
  personas:
    - label: "Jack, 20 — 3rd-class artist"
      description: "Won his ticket at poker in Southampton; travelling alone."
      record: {Pclass: "3rd", Sex: male, Age: 20, Title: Mr, SibSp: 0, Parch: 0, TicketGroup: 1, FarePerPerson: 7.9, Embarked: Southampton}
    - label: "Rose, 17 — 1st-class heiress"
      description: "With her mother and fiancé on one first-class ticket."
      record: {Pclass: "1st", Sex: female, Age: 17, Title: Miss, SibSp: 0, Parch: 1, TicketGroup: 3, FarePerPerson: 50, Embarked: Southampton}
    - label: "Cal, 30 — Rose's fiancé"
      description: "Same ticket, same deck — different sex."
      record: {Pclass: "1st", Sex: male, Age: 30, Title: Mr, SibSp: 0, Parch: 0, TicketGroup: 3, FarePerPerson: 50, Embarked: Southampton}
    - label: "A 3rd-class mother of four"
      description: "Emigrating with her children, her husband gone ahead."
      record: {Pclass: "3rd", Sex: female, Age: 35, Title: Mrs, SibSp: 0, Parch: 4, TicketGroup: 5, FarePerPerson: 6, Embarked: Southampton}
    - label: "An Irish girl, 18 — Queenstown"
      description: "Boarded at the last stop, alone, in steerage."
      record: {Pclass: "3rd", Sex: female, Age: 18, Title: Miss, SibSp: 0, Parch: 0, TicketGroup: 1, FarePerPerson: 7.75, Embarked: Queenstown}
    - label: "A boy of 6 — 2nd class"
      description: "Travelling with his mother and a sibling."
      record: {Pclass: "2nd", Sex: male, Age: 6, Title: Master, SibSp: 1, Parch: 1, TicketGroup: 3, FarePerPerson: 10, Embarked: Southampton}

tutorial:
  tab_label: "Tutorial"
  intro: >
    On 15 April 1912 the RMS Titanic sank on her maiden voyage and more than 1,500 of
    the 2,224 people aboard died. This tutorial walks the **complete machine-learning
    workflow** on the passenger list: frame the problem, clean the data, engineer
    features, explore, choose and validate a model, and explain its predictions.
    Every chart, metric and prediction below is computed **live** from this platform's
    own dataset and deployed model — nothing is a screenshot.
  steps:
    - title: "1 · Frame the problem"
      body: |
        **Supervised learning, binary classification.** Each row is a passenger with a
        known outcome (`Survived` = 1 or 0), so we can learn a function from what we
        know about a person **before** the voyage to their chance of surviving.

        We predict a **probability**, not a yes/no: "72% likely to survive" carries far
        more information than "survives", and we can always pick a cut-off later.

        **How do we score it?**
        - **Accuracy** — share of correct yes/no calls at a 50% cut-off. Easy to read,
          but misleading here: only 38% survived, so predicting *"everyone died"*
          already scores 62%.
        - **ROC AUC** — the probability that a randomly chosen survivor gets a higher
          score than a randomly chosen victim. 0.5 is a coin flip, 1.0 is perfect, and it
          does not depend on any cut-off. This is the metric we select models on.
      takeaway: "Any model must beat 62% accuracy just to beat 'nobody survived' — which is why we rank models by ROC AUC instead."
      widgets: [class_balance]

    - title: "2 · Meet the data"
      body: |
        The **891 passengers** of Kaggle's labelled training file (418 more are in its
        unlabelled test file; the crew are not included). The raw columns:

        | Column | Meaning |
        | --- | --- |
        | `Pclass` | Ticket class: 1st, 2nd or 3rd |
        | `Name` | Full name, including a title — "Braund, Mr. Owen Harris" |
        | `Sex`, `Age` | As recorded; 177 ages are missing |
        | `SibSp` / `Parch` | Siblings+spouses / parents+children aboard |
        | `Ticket`, `Fare` | Ticket number and its total price (£) |
        | `Cabin` | Cabin number — missing for 77% of passengers |
        | `Embarked` | Port: Southampton, Cherbourg or Queenstown |

        Below is the model-ready version this platform actually trains on (the next two
        chapters explain every change). The `PassengerId` and `Name` columns identify
        each person but are never used as model inputs.
      widgets: [dataset_preview]

    - title: "3 · Clean the data"
      body: |
        Real data has holes. How we fill them is a modelling decision:

        | Column | Missing | What we did | Why |
        | --- | --- | --- | --- |
        | `Age` | 177 (20%) | Median age of passengers with the **same title and class** | A missing "Master" in 3rd class is a boy, not the overall median of 28 |
        | `Cabin` | 687 (77%) | **Dropped** | Mostly recorded for survivors (records came from them) — a **label leak** that would flatter the model |
        | `Embarked` | 2 | Southampton (the mode) | Historically correct for both passengers |

        **Honesty note:** the age medians were computed over all 891 rows, so the
        hold-out set "saw" a little of the training data. A production pipeline fits
        every imputation on the training split only; at this size the effect is small,
        but it is a classic source of leakage worth knowing.
      takeaway: "Every imputation injects an assumption — make it an informed one, and watch for leakage."

    - title: "4 · Engineer features"
      body: |
        Raw columns rarely say things the way a model needs to hear them:

        - **Title** from `Name` — `Mr`, `Mrs`, `Miss`, `Master` (boys) or `Rare` (Dr,
          Rev, officers, nobility). One column that carries sex, age group, marital
          status and social rank. A "useless" free-text column turns into one of the
          strongest predictors.
        - **TicketGroup** — how many passengers share a ticket number: families,
          friends and servants who moved (and often died) together.
        - **FarePerPerson** — `Fare` is the price of the whole ticket; dividing by the
          party size stops a large family on a cheap ticket from looking rich.

        Adding Title and the party features lifts the boosted model's cross-validated
        ROC AUC from about **0.873 to 0.885**.
      takeaway: "Feature engineering — turning domain knowledge into columns — often beats a fancier algorithm."
      charts:
        - {type: bar, x: Title, y: Survived, agg: mean, color_by: Title}
        - {type: bar, x: TicketGroup, y: Survived, agg: mean}

    - title: "5 · Explore: who survived?"
      body: |
        Before modelling, look. The bars show the **survival rate** (mean of the 0/1
        target) per group:

        - **Sex dominates**: about 74% of women survived against 19% of men.
        - **Class matters**: 63% in 1st class, 47% in 2nd, 24% in 3rd.
        - **They interact**: almost every 1st- and 2nd-class woman survived, but only
          half of 3rd-class women did. "Women and children first" was applied unevenly
          across the decks.
        - **Children**: the youngest passengers have a visible survival bump in the age
          histogram, the "children first" half of the rule.
        - **Our own fingerprint**: the tall spike just under 30 in the age histogram is the
          imputation from chapter 3 — 177 filled-in ages piled onto a few group medians.
          Cleaning always leaves traces; know where yours are.
      takeaway: "Sex and class together tell most of the story — a good model has to capture their interaction."
      charts:
        - {type: bar, x: Sex, y: Survived, agg: mean, color_by: Sex}
        - {type: bar, x: Pclass, y: Survived, agg: mean, color_by: Sex}
        - {type: histogram, x: Age, color_by: Survived}
        - {type: box, x: Pclass, y: FarePerPerson}

    - title: "6 · Choose a model"
      body: |
        Every candidate uses the same **pipeline**: fill any gaps, standardise numbers,
        one-hot encode categories, then fit the estimator.

        - **Logistic regression** — linear, fast, fully interpretable. The baseline.
        - **LightGBM (small-data)** — gradient-boosted trees that can learn
          interactions such as **sex × class** by themselves. Shallow trees, a slow
          learning rate, row/column subsampling and L2 regularisation keep 700 rows from
          being memorised.

        **Protocol:** a stratified 80/20 split sets aside a **hold-out** that no decision
        ever touches. On the 80%, **5-fold cross-validation** gives each candidate five
        ROC AUC scores, and we rank on their mean: one 179-row hold-out can swing a
        metric by ±0.03 on its own. Then **Green Code**: the complex model is only
        adopted if it beats the simpler one by more than 0.01 AUC. The winner is
        finally refit on all 891 passengers for deployment.

        For reference, the original 2018 notebook's Keras neural network reached
        **0.86** ROC AUC.
      widgets: [model_card]

    - title: "7 · Evaluate honestly"
      body: |
        The selected model, trained on the 80% only, scored on the untouched hold-out:

        - The **ROC curve** plots the true-positive rate (survivors correctly flagged)
          against the false-positive rate (victims wrongly flagged) at every possible
          cut-off. The area under it is the ROC AUC.
        - The **confusion matrix** counts the four outcomes at the 50% cut-off.
          **Precision** asks "of those we said survived, how many did?"; **recall**
          asks "of those who survived, how many did we find?".

        **ROC AUC in the high 0.80s is close to the ceiling** for this data: many of the
        remaining errors are people whose fate came down to luck, courage or a
        lifeboat's position, and none of that is in the passenger list.
      takeaway: "Report metrics on data the model never saw during selection, otherwise you're grading your own homework."
      widgets: [roc_curve, confusion_matrix]

    - title: "8 · Explain the model"
      body: |
        A good score is not enough: we want to know **why**. **SHAP** splits every
        prediction into a sum:

        `probability = average survival rate + Σ contribution of each feature`

        Each contribution says how much that feature pushed **this** passenger's
        probability up or down, relative to the average passenger. The mean size of those
        contributions across the dataset gives the **global importance** below. Title
        and sex lead (they share much of the same signal), then class, fare and age.
      widgets: [feature_importance]

    - title: "9 · Ask what-if questions"
      body: |
        The same passengers the original notebook tested, now scored live by the
        deployed model. Compare the three boys: identical except for ticket class. And
        compare the average man and woman: identical except for sex.
      takeaway: "The model confirms the history: sex decided most fates, and class decided who among women and children got out."
      widgets: [examples]

    - title: "10 · Responsible AI"
      body: |
        This model uses **sex and age on purpose**, because they are the subject of the
        study: it **describes** who was saved in 1912. The churn scenario on this
        platform does the opposite and drops `Gender`, because a bank would be using
        that model to make **decisions about people today**, where such a feature is
        discriminatory and, in many places, illegal.

        **Limitations to keep in mind:**
        - 891 of the 2,224 aboard; the crew (about 900 people) are absent.
        - A model trained on history reproduces its biases. It predicts who **was**
          saved, never who **should** have been.
        - The Voyage tab scores passengers the deployed model was refit on, so it is
          more confident there than on new people. The honest numbers are the
          hold-out ones above.
      takeaway: "Whether a feature is acceptable depends on what the model is used for, not only on how predictive it is."

    - title: "11 · Your turn"
      body: |
        Open the **Voyage** tab. Every passenger is aboard, berthed by class and
        coloured by the model's probability. Filter a cohort (say, 3rd-class women),
        reveal their real fate, click anyone to see their explained probability, then
        edit them — or board a persona — and watch the prediction move.

  examples:
    - label: "Average man, 2nd class"
      record: {Pclass: "2nd", Sex: male, Age: 26, Title: Mr, SibSp: 1, Parch: 0, TicketGroup: 2, FarePerPerson: 13, Embarked: Southampton}
    - label: "Average woman, 2nd class"
      record: {Pclass: "2nd", Sex: female, Age: 26, Title: Mrs, SibSp: 1, Parch: 0, TicketGroup: 2, FarePerPerson: 13, Embarked: Southampton}
    - label: "Young woman alone, 3rd class"
      record: {Pclass: "3rd", Sex: female, Age: 26, Title: Miss, SibSp: 0, Parch: 0, TicketGroup: 1, FarePerPerson: 7.9, Embarked: Southampton}
    - label: "Boy of 7, 1st class"
      record: {Pclass: "1st", Sex: male, Age: 7, Title: Master, SibSp: 0, Parch: 2, TicketGroup: 3, FarePerPerson: 30, Embarked: Southampton}
    - label: "Boy of 7, 2nd class"
      record: {Pclass: "2nd", Sex: male, Age: 7, Title: Master, SibSp: 0, Parch: 2, TicketGroup: 3, FarePerPerson: 13, Embarked: Southampton}
    - label: "Boy of 7, 3rd class"
      record: {Pclass: "3rd", Sex: male, Age: 7, Title: Master, SibSp: 0, Parch: 2, TicketGroup: 3, FarePerPerson: 7.9, Embarked: Southampton}

services:
  etl: etl-tabular
  training: training
  prediction: prediction
  assistant: assistant
