# dbt project of the surf_retail data product (docs/adr/0005, 0006) — run by the
# generic data-transform service, never by hand-written per-scenario code.
#
# Targets (profiles.yml is generated by data-transform from its environment):
#   postgres   — core tier: silver (with pseudonymisation) and gold in the warehouse database
#   clickhouse — analytics tier: silver copied from Postgres' silver, gold rebuilt columnar
#
# Silver lives in schema `surf_retail_silver`, gold in `surf_retail_gold`
# (ai_circus_shared.data_product.layer_schema); bronze is data-ingest's schema.
name: surf_retail
version: "1.0.0"
config-version: 2
profile: data_platform

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
clean-targets: []

models:
  surf_retail:
    +persist_docs: {relation: true, columns: true}
    silver:
      +schema: surf_retail_silver
      +tags: [silver]
    gold:
      +schema: surf_retail_gold
      +materialized: table
      +tags: [gold]

# Reference data kept as code: loaded by `dbt build` before the models that join it.
seeds:
  surf_retail:
    +schema: surf_retail_silver
    +tags: [silver, reference]
    city_coordinates:
      +column_types: {city: varchar(64), lat: float, lon: float}
