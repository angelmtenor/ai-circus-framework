# Seed definition for the "churn" scenario — loaded into the `platform` Postgres
# schema by services/platform-registry at bootstrap. Editing this file and re-seeding
# is how a developer adds/changes a scenario; it is never read directly by any other
# service (see AGENTS.md / plan: "Scenario registry").
#
# The scenario-specific services (etl-tabular, training, prediction) also read this
# file directly for their own operational config (dataset schema, model candidates) —
# that's build-time parameterization analogous to each service's own settings.yaml,
# not tenant/entitlement data, so it doesn't need to go through platform-registry's API.

slug: churn
kind: tabular_ml
title: "Customer Churn Prediction"
description: >
  Predicts bank customer churn risk from account/usage features, with SHAP-based
  explainability and a chat assistant for asking follow-up questions about the data.
role_required: "scenario:churn"
icon: "📉"

credits:
  source: "Kaggle — Sonali Dasgupta, Churn Prediction of Bank Customers"
  url: "https://www.kaggle.com/datasets/sonalidasgupta95/churn-prediction-of-bank-customers"
  note: "ported via mlops_templates' churn_scenario"

# Supplements (doesn't replace) assistant's metadata-grounded prompt — it already
# injects the trained model's real feature list/accuracy; this adds the human-authored
# domain framing (see libs/shared/scenario_schema.py's ChatConfig).
chat:
  context: >
    A retail bank's customer churn model — predicts the risk that a customer closes
    their account, from account/usage features like credit score, tenure, balance,
    number of products, and activity status.
  sample_questions:
    - "Which features matter most for predicting churn?"
    - "How accurate is the trained model?"
    - "Why would a customer with a high balance still be at risk of churning?"

dataset:
  bucket: "scenario-churn"
  # MinIO key once uploaded; etl-tabular reads it from there.
  raw_object: "raw/customer_churn.csv"
  # Tracked local file (relative to this scenario's directory) etl-tabular uploads to
  # MinIO on first run if raw_object doesn't exist yet for the tenant — demo bootstrap only.
  seed_file: "sample_data/customer_churn.csv"
  index_col: "CustomerId"
  target: "Exited"
  # Responsible AI: dropped before training regardless of predictive value —
  # Gender for regulatory/ethical concerns, RowNumber/Surname as non-predictive identifiers.
  protected_features_excluded: ["Gender", "RowNumber", "Surname"]
  feature_columns:
    - CreditScore
    - Geography
    - Age
    - Tenure
    - Balance
    - NumOfProducts
    - HasCrCard
    - IsActiveMember
    - EstimatedSalary

  # Drives both UIs' generic form renderer (see libs/shared/scenario_schema.py) —
  # neither UI has any churn-specific form code; this is the only place these
  # ranges/options/defaults are defined.
  feature_schema:
    CreditScore: {type: numeric, min: 300, max: 850, default: 650, step: 1}
    Geography: {type: categorical, options: ["France", "Germany", "Spain"], default: "France"}
    Age: {type: numeric, min: 18, max: 92, default: 40, step: 1}
    Tenure: {type: numeric, min: 0, max: 10, default: 3, step: 1}
    Balance: {type: numeric, min: 0, max: 300000, default: 50000, step: 1000}
    NumOfProducts: {type: numeric, min: 1, max: 4, default: 2, step: 1}
    # Numeric (not categorical) even though they're 0/1 flags: the raw CSV stores
    # them as integer columns, so etl-tabular's clean() leaves them numeric dtype
    # (only non-numeric columns get cast to "category") — training's ColumnTransformer
    # therefore routes them through the numeric (StandardScaler) branch, which would
    # break on a string "0"/"1" from a categorical form widget.
    HasCrCard: {type: numeric, min: 0, max: 1, default: 1, step: 1}
    IsActiveMember: {type: numeric, min: 0, max: 1, default: 1, step: 1}
    EstimatedSalary: {type: numeric, min: 0, max: 250000, default: 75000, step: 1000}

  # Seeds ui-react's Data tab dashboard (see libs/shared/scenario_schema.py's
  # ChartSpec) — still user-editable/addable there, just a sensible starting point.
  default_charts:
    - {type: histogram, x: Age}
    - {type: bar, x: Geography, y: Exited, agg: mean, color_by: Geography}
    - {type: scatter, x: Balance, y: EstimatedSalary, color_by: Geography}

model:
  task_type: classification
  # Green Code: LightGBM alone — more accurate and efficient than a classic
  # random forest, so no simpler baseline candidate is evaluated against it.
  candidates: ["lightgbm"]
  accuracy_gain_threshold_for_complexity: 0.02
  explainability: shap

services:
  etl: etl-tabular
  training: training
  prediction: prediction
  assistant: assistant
