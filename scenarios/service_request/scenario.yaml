# Seed definition for the "service_request" scenario — an assisted_form example:
# a fictional local-government service desk where the assistant fills the form live
# from the conversation, classifying the request via RAG over a small catalog.
# Loaded into the `platform` Postgres schema by services/platform-registry at bootstrap.

slug: service_request
kind: assisted_form
title: "Public Service Request Portal"
description: >
  Report an issue or request a service from a fictional local government — a broken
  streetlight, a missed trash pickup, a permit application — and let the assistant
  fill out the form for you as you describe it. Grounded in a small catalog of
  request types (RAG), which also drives which fields are actually required.
role_required: "scenario:service_request"
industry: public_sector
icon: "🏛️"

# Grounds form-agent's system prompt (build_form_system_prompt) — the domain framing
# only; the field catalog itself comes entirely from `form` below.
# The scenario told for someone with no context: the Overview tab and its guided demo (scenario_schema.StoryConfig).
story:
  headline: "Report a problem to the council in your own words"
  problem: >
    Citizens report broken streetlights, missed collections or permit requests through forms with many fields, most
    of which depend on the kind of request. Here the citizen describes the problem; the assistant picks the request
    type from the council's catalogue, asks only for what that type needs, and files the request.
  audience: ["Citizens", "Council service desks"]
  with_ai: "A conversation that fills the right form, grounded in the catalogue of request types, and a tracker for each request."
  value:
    - {value: "1", label: "Conversation", note: "Instead of a long form with fields that do not apply."}
  flow:
    - {title: "The citizen's words", kind: source, tab: assistant, text: "A description of the problem or the request."}
    - {title: "Request catalogue", kind: rules, tab: assistant, text: "The council's request types (RAG) decide which fields are required."}
    - {title: "Form filled", kind: assistant, tab: assistant, text: "The assistant fills the form and asks only for what is missing."}
    - {title: "Request tracker", kind: output, tab: cases, text: "Every request filed, with its case number."}
  data_sources:
    - {name: "Request catalogue", kind: documents, origin: synthetic, provider: "A fictional council's catalogue of request types, written for this repository", feeds: "The request types and their required fields."}
  models: []
  demo:
    minutes: 4
    steps:
      - {title: "The question", tab: "overview", show: "The headline and the flow.", say: "Describe the problem; the form follows."}
      - {title: "Report it", tab: "assistant", show: "The assistant picks the request type and fills the form.", say: "Only the fields that request needs are asked.", ask: "There's a broken streetlight on Main Street, near the library."}
      - {title: "Track it", tab: "cases", show: "The filed request and its case number.", say: "Every request is tracked per user."}

chat:
  context: >
    A local government's public service request desk. Residents report issues
    (streetlight outages, missed waste collection, noise complaints) or request
    services (address registration, minor construction permits, residency
    certificates). Be concise and practical, and never invent contact/identity
    details the resident didn't actually provide.
  sample_questions:
    - "There's a broken streetlight on Main Street, near the library."
    - "What do I need to register a new address?"
    - "I want to apply for a minor construction permit for a backyard shed."
    - "My trash wasn't picked up this week on Elm Street."
    - "How do I request a residency certificate?"

form:
  title: "Service request"
  # The field the catalog below classifies into. Required fields beyond the base
  # set (see `address`'s required_if) depend on which type this resolves to.
  classification_field: request_type
  classification_options:
    - address_registration
    - streetlight_outage
    - waste_collection_issue
    - minor_construction_permit
    - noise_complaint
    - residency_certificate
  fields:
    - id: request_type
      label: "Request type"
      type: select
      required: true
      options:
        - address_registration
        - streetlight_outage
        - waste_collection_issue
        - minor_construction_permit
        - noise_complaint
        - residency_certificate
      helper_text: "Resolved automatically from your description — override it here if it's wrong."

    - id: full_name
      label: "Full name"
      type: text
      required: true

    - id: id_type
      label: "ID type"
      type: select
      required: true
      options:
        - "National ID"
        - "Passport"

    - id: id_number
      label: "ID number"
      type: text
      required: true
      validation: pattern
      pattern: "^[A-Za-z0-9-]{5,20}$"
      helper_text: "5-20 letters, digits, or dashes."

    - id: phone
      label: "Phone number"
      type: tel
      required: true
      validation: phone

    - id: email
      label: "Email address"
      type: email
      required: true
      validation: email

    - id: address
      label: "Address / location"
      type: text
      required_if:
        field: request_type
        in_values: [streetlight_outage, waste_collection_issue, noise_complaint]
      helper_text: "Street address or nearest cross-street — required for on-site issues."

    - id: description
      label: "Description"
      type: textarea
      required: true
      validation: min_length
      min_length: 20
      helper_text: "At least 20 characters — include useful details like dates or reference numbers."

documents:
  bucket: "scenario-service-request"
  raw_prefix: "raw/"
  seed_prefix: "sample_docs"
  chunking:
    strategy: recursive_character
    chunk_size: 800
    chunk_overlap: 120
  embedding:
    model: "sentence-transformers/all-MiniLM-L6-v2"

vector_store:
  backend: qdrant
  # One collection per tenant: "{collection_prefix}__{tenant_org_id}"
  collection_prefix: "service_request"
  top_k: 3

ui_extras:
  kind: case_tracker

services:
  etl: etl-vectorize
  agent: form-agent
