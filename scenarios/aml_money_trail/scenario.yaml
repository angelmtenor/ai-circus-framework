  outcome_detail_column: typology
  case_column: attempt_id
  flag_from_tier: "Review"
  facts: [usd_out, usd_in, counterparties_out, counterparties_in, max_daily_fan_out, max_daily_fan_in, pass_through, dwell_hours, pagerank_pctl, return_cycles, cross_border_share]
  tiers:
