    - {label: "Elevated", min_probability: 0.03, description: "Some resemblance — worth a look in context."}
    - {label: "Review", min_probability: 0.10, description: "Strong resemblance — an analyst should review the holder and its flows."}
    - {label: "Priority", min_probability: 0.3, description: "Very close to the laundering profile — review first."}
  pillars:
