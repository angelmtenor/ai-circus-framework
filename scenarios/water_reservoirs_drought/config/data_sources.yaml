# Where the Reservoirs & Drought Watch data comes from: a calibrated synthetic basin, generated by
# scripts/generate_water_data.py and committed under sample_data/. Riverbend Water Authority, its basin, rivers,
# reservoirs and weather stations are all fictional. Nothing downstream calls a live API.
#
# Another basin with real data = the same file layout in sample_data/ (readings, weather, reservoirs.json); the
# forecast, outlook, tools and bulletin read only that layout.

attribution:
  - "Synthetic data: the fictional Riverbend basin, generated by scripts/generate_water_data.py (seeded, reproducible)."
data_provenance: synthetic
# The long drought the backtest report looks at on its own (the generator's dry years below).
drought_years: [2022, 2024]

generator:
  seed: 20261120
  start: "2000-01-01"
  end: "2026-11-20"
  grid_km: [140, 100]          # the basin's own grid: x east, y north
  stations: 24                 # weather stations scattered over the land
  # Wet-day frequency and mean wet-day rain (mm) per month, and the monthly mean temperature (°C): a dry-summer,
  # wet-autumn climate. Calibration targets, not a place.
  wet_day_frac: [0.18, 0.20, 0.25, 0.28, 0.28, 0.20, 0.15, 0.18, 0.22, 0.23, 0.22, 0.17]
  wet_day_mm: [6.8, 6.1, 7.7, 7.7, 7.3, 7.6, 7.8, 8.2, 9.6, 10.9, 9.5, 6.6]
  temp_c: [5.6, 6.8, 9.2, 11.9, 15.5, 20.3, 22.9, 22.6, 18.8, 14.9, 9.5, 6.4]
  # Rain multiplier of chosen years (others drawn around 1.0): two moderate droughts, a long severe one and wet
  # recoveries, so the backtest meets dry years it never trained on.
  year_rain_factor: {2005: 0.8, 2007: 0.78, 2008: 0.85, 2009: 1.15, 2010: 1.1, 2016: 0.85, 2017: 0.82, 2018: 1.35,
                     2020: 1.25, 2022: 0.8, 2023: 0.7, 2024: 0.75, 2025: 1.25, 2026: 1.1}

weather:
  # A reservoir's catchment signal is the mean of the stations within radius_km; if fewer than min_stations
  # qualify, the radius grows to max_radius_km. Used by the forecast features.
  catchment:
    radius_km: 25
    min_stations: 2
    max_radius_km: 60
