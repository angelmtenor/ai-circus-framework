# Seed definition for the "ai_circus_reference" scenario — conversational-only, no dashboard.
# Loaded into the `platform` Postgres schema by services/platform-registry at bootstrap.

slug: ai_circus_reference
kind: conversational_rag
title: "AI Open Framework Reference Guide"
description: >
  Agent-based RAG chatbot answering questions grounded in the ai-circus project's own
  reference notes: dev environment/tooling, software engineering practices, ML/DS
  workflow, and generative AI / agent / RAG best practices.
role_required: "scenario:ai_circus_reference"
industry: general
icon: "📚"

# Grounds rag-agent's system prompt AND its judgment of whether a question is
# in-domain enough to call the retrieve_docs tool at all — chitchat/off-topic
# questions are answered directly, without retrieval (see libs/shared/scenario_schema).
# The scenario told for someone with no context: the Overview tab and its guided demo (scenario_schema.StoryConfig).
story:
  headline: "Ask the project's own reference notes, and get every answer with its source"
  problem: >
    A team building with this framework keeps notes on tooling, engineering practice, machine learning and
    generative AI. Finding the right note when a question comes up is slow. A grounded assistant answers from those
    notes only and cites each passage, and the same notes are open to any MCP client.
  audience: ["Engineers", "Data scientists", "New team members"]
  with_ai: "Questions answered from the indexed notes with every passage cited, a library to read them, and an MCP door."
  value:
    - {value: "100 %", label: "Answers with sources", note: "Every reply cites the passages it used."}
    - {value: "3", label: "MCP tools", note: "List sources, search documents, read a document."}
  flow:
    - {title: "Reference notes", kind: source, tab: library, text: "The notes, chunked and indexed per tenant."}
    - {title: "Grounded assistant", kind: assistant, tab: assistant, text: "Retrieves the closest passages and answers from them, citing each one."}
    - {title: "MCP door", kind: output, tab: mcp, text: "The same search and reading tools for any MCP client."}
  data_sources:
    - {name: "ai-circus reference notes", kind: documents, origin: public, provider: "The ai-circus repository's reference folder (GitHub), with a vendored fallback", feeds: "Every passage the assistant searches and cites."}
  models: []
  demo:
    minutes: 4
    steps:
      - {title: "The question", tab: "overview", show: "The headline and the flow.", say: "An assistant that answers only from your notes, and shows them."}
      - {title: "Ask", tab: "assistant", show: "The answer and its cited passages.", say: "Every claim points at a passage.", ask: "What does SHAP actually tell you about a model's predictions?"}
      - {title: "The library", tab: "library", show: "The indexed documents and their passages, in order.", say: "What the assistant can read, open to anyone."}
      - {title: "From any MCP client", tab: "mcp", show: "The door's tools and a live check.", say: "The same notes from Claude Desktop, LibreChat or any MCP client, with the same token."}

chat:
  context: >
    A learning/reference guide for building the ai-circus project itself: dev
    environment setup (WSL/Docker/uv/ruff/pre-commit), software engineering principles
    (SOLID/DRY/KISS, CI/CD, IaC, code review), machine learning/data science workflow
    and explainability (SHAP/LIME), and generative AI / agent / RAG best practices and
    tooling.
  sample_questions:
    - "What dev environment does ai-circus recommend, and why?"
    - "What's the recommended workflow for ML explainability?"
    - "What GenAI/RAG courses or reference repos does ai-circus recommend studying first?"
    - "What does SHAP actually tell you about a model's predictions?"
    - "What software engineering practices should I follow before opening a pull request?"

documents:
  # Source documents fetched at bootstrap straight from the ai-circus repo's own
  # reference/ folder (kept in sync with upstream instead of copy-pasted into this
  # repo) — see etl_vectorize.core.vectorize.ensure_raw_docs / fetch_github_docs.
  # sample_docs/ is a vendored snapshot of that same content, used only if the
  # GitHub fetch fails (rate limit, outage, no network) — see DocumentsConfig's
  # docstring. Re-sync it by hand after upstream reference/ changes; it's a fallback,
  # not the source of truth.
  bucket: "scenario-ai-circus-reference"
  raw_prefix: "raw/"
  seed_prefix: "sample_docs"
  github_source:
    repo: "angelmtenor/ai-circus"
    path: "reference"
    ref: "develop"
  chunking:
    strategy: recursive_character
    chunk_size: 800
    chunk_overlap: 120
  embedding:
    model: "sentence-transformers/all-MiniLM-L6-v2"

vector_store:
  backend: qdrant
  # One collection per tenant: "{collection_prefix}__{tenant_org_id}"
  collection_prefix: "ai_circus_reference"
  top_k: 5

ui_extras:
  kind: source_library

# MCP (docs/adr/0019). expose: any MCP client can search and read this tenant's indexed documents
# at rag-agent's /mcp/ai_circus_reference, with the same bearer token as the app. consume: the chat's
# "via MCP" switch answers through that same door, to show an agent using tools over MCP.
mcp:
  expose: [list_sources, search_documents, read_document]
  consume: [ai_circus_reference]

services:
  etl: etl-vectorize
  agent: rag-agent
