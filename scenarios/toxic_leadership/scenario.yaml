# Seed definition for the "toxic_leadership" tutorial scenario — loaded into the
# `platform` Postgres schema by services/platform-registry at bootstrap (see
# scenarios/churn/scenario.yaml's header for how etl-tabular/training/prediction also
# read it).
#
# NLP + structured data: 4,000 real Glassdoor reviews written by software, data and AI
# engineers (Kaggle "Glassdoor Job Reviews", CC BY-SA 4.0). A LightGBM model reads each
# review's text (TF-IDF inside the pipeline — `type: text`) together with the facts of
# the job, and learns the vocabulary of toxic management — the few people who offload
# their own job onto the engineers, overload them and spread falsehoods; a
# sentence-transformer challenger (voyage-4-nano via llm-gateway's `local-embed`) is
# trained next to it for comparison, and an LLM rubric check assesses any description
# of how someone with power over the team's work behaves.
#
# `sample_data/toxic_leadership.csv` is generated by
# `scripts/prepare_toxic_leadership_dataset.py` (pinned, checksum-verified download;
# anonymised) — rerun that script after editing the recipe. The challenger needs the
# host-GPU embedding step: `make k3s-text-embeddings` (then re-run training).

slug: toxic_leadership
kind: tabular_ml
title: "Toxic Management & Work Environment — NLP + ML Tutorial"
description: >
  A handful of people can sour a whole company: managers, salespeople or self-styled
  "AI experts" — often with an inflated CV — who offload their own job onto the
  engineers, overload them and spread falsehoods. 4,000 real reviews by software, data
  and AI engineers, read by a model that combines the words with the facts of the job,
  learns the vocabulary of toxic management, and races a modern sentence-transformer.
role_required: "scenario:toxic_leadership"
industry: tutorial
icon: "🚩"

credits:
  source: "Kaggle — David Gauthier, Glassdoor Job Reviews (CC BY-SA 4.0)"
  url: "https://www.kaggle.com/datasets/davidgauthier/glassdoor-job-reviews"
  note: "engineering reviews only, employers anonymised; the derived CSV is CC BY-SA 4.0"

chat:
  context: >
    A teaching scenario on 4,000 anonymous Glassdoor reviews (UK, 2008-2021) written by
    software, data and AI engineers. The target, BadLeadership, is whether the reviewer
    rated Senior Management 1-2 stars. A LightGBM model predicts it from the review's
    text (headline + cons, read with TF-IDF unigrams and bigrams) plus the job context
    (job family, employer sector, current/former, tenure, year) and two control ratings
    (pay & benefits, work-life balance). Culture and career ratings were deliberately
    left out: they move with the leadership rating (a halo effect) and would let the
    model stop reading. A sentence-transformer challenger (voyage-4-nano embeddings +
    LightGBM) is trained on the same split for comparison. Explain like a patient data
    science teacher: name the concept (TF-IDF, n-grams, embeddings, SHAP, halo effect,
    leakage, self-selection bias), then tie it back to this data. Never judge a real,
    named person: the model describes what reviews say, and a description of behaviour
    is one perspective, not a verdict. Good leadership here follows Google's Project
    Oxygen behaviours (coaching, empowering without micromanaging, psychological
    safety, clear vision, technical credibility, honesty); toxic leadership follows the
    Toxic Leadership Scale (abusive, authoritarian, narcissistic, self-promoting,
    unpredictable) plus dishonesty, blame-shifting, offloading one's own job onto the
    engineers, overloading them and spreading falsehoods about them. The point of the
    scenario: a very small number of people — managers, salespeople, self-styled AI
    experts with an inflated CV — can do outsized damage by delegating their own work to
    technical staff, burning them out and misrepresenting the team inside the company.
    Senior engineers and tech leads have a responsibility to recognise the pattern and
    report it: with evidence (who did the work, what was promised and claimed, dates,
    workload), through the proper channels (their own management chain, HR, the
    company's internal reporting channel), and about behaviour, never rumours. A model
    can show the pattern across many anonymous reviews; a report about a person is a
    human act that needs facts.
  sample_questions:
    - "Which words most strongly signal bad leadership?"
    - "Is it the money, the hours — or the manager?"
    - "Why are the culture and career ratings not used as inputs?"
    - "How does TF-IDF turn a review into numbers?"
    - "Why doesn't the transformer beat TF-IDF by more?"
    - "Can this model detect sarcasm?"
    - "Could a model spot a manager who lies on LinkedIn?"
    - "How should a tech lead report toxic management — responsibly?"
    - "Why must this never be used to score a real manager?"

dataset:
  bucket: "scenario-toxic-leadership"
  raw_object: "raw/toxic_leadership.csv"
  seed_file: "sample_data/toxic_leadership.csv"
  index_col: "ReviewId"
  target: "BadLeadership"
  # The halo ratings (culture, career, overall, CEO approval, recommend, outlook) never
  # reach the CSV — dropped by the prepare script, see its docstring.
  protected_features_excluded: []
  # Shown (and searchable) in the UI, never a model input.
  display_columns: ["JobTitle"]
  feature_columns:
    - JobFamily
    - EmployerType
    - EmployeeStatus
    - Tenure
    - ReviewYear
    - CompBenefits
    - WorkLifeBalance
    - Review

  feature_schema:
    JobFamily:
      {type: categorical, label: "Job family",
       options: ["Leads & Architects", "Data & AI", "Software Engineering", "DevOps & Cloud", "QA & Test"],
       default: "Data & AI",
       info: "The reviewer's role, grouped from their job title: data scientists, ML and data engineers and analysts are Data & AI; tech leads, architects and engineering managers are Leads & Architects."}
    EmployerType:
      {type: categorical, label: "Employer sector",
       options: ["Tech & internet", "Enterprise IT", "Banking & finance", "Consulting", "Media & telecom", "Other industries"],
       default: "Tech & internet",
       info: "A coarse sector instead of the employer's name — companies are anonymised, so the model has to learn what the words say about leadership, not which company wrote them."}
    EmployeeStatus:
      {type: categorical, label: "Current or former", options: ["Current", "Former"], default: "Current",
       info: "Whether the reviewer still worked there. Former employees rate leadership badly far more often — they are also the ones who left."}
    Tenure:
      {type: categorical, label: "Time at the company",
       options: ["Under 1 year", "1+ years", "3+ years", "5+ years", "8+ years", "10+ years", "Not stated"],
       default: "1+ years",
       info: "How long the reviewer had been there, as Glassdoor records it (many reviews don't say)."}
    ReviewYear:
      {type: numeric, label: "Year of the review", min: 2008, max: 2021, default: 2020, step: 1,
       info: "When the review was written. Bad-leadership ratings fall from about a third of reviews before 2017 to under a fifth in 2020-21 — a drift any deployed model would have to watch."}
    CompBenefits:
      {type: numeric, label: "Pay & benefits rating", min: 1, max: 5, default: 3, step: 1,
       info: "The reviewer's 1-5 star rating of compensation and benefits — a control: is the complaint about the money or about the leadership?"}
    WorkLifeBalance:
      {type: numeric, label: "Work-life balance rating", min: 1, max: 5, default: 3, step: 1,
       info: "The reviewer's 1-5 star rating of work-life balance — the second control: the hours, or the manager?"}
    Review:
      {type: text, label: "Review (headline + cons)", max_length: 1000,
       placeholder: "Headline. What's bad about working here?",
       info: "The review's headline and its 'Cons' section, anonymised. Read by TF-IDF: single words and two-word phrases ('upper management', 'no direction'), weighted by how distinctive they are."}

  # The Data & BI tab's starting dashboard.
  default_charts:
    - {type: bar, x: EmployeeStatus, y: BadLeadership, agg: mean, color_by: EmployeeStatus}
    - {type: bar, x: CompBenefits, y: BadLeadership, agg: mean}
    - {type: bar, x: WorkLifeBalance, y: BadLeadership, agg: mean}
    - {type: bar, x: JobFamily, y: BadLeadership, agg: mean, color_by: JobFamily}
    - {type: bar, x: EmployerType, y: BadLeadership, agg: mean, color_by: EmployerType}
    - {type: line, x: ReviewYear, y: BadLeadership, agg: mean}
    - {type: bar, x: Tenure, y: BadLeadership, agg: mean}
    - {type: heatmap}

model:
  task_type: classification
  # Gradient boosting only. Small-data settings first (Green Code): default LightGBM
  # must beat it by > 0.01 ROC AUC to be adopted — measured 0.866 vs 0.874, it doesn't.
  candidates: ["lightgbm_small_data", "lightgbm"]
  accuracy_gain_threshold_for_complexity: 0.01
  selection_metric: roc_auc
  cv_folds: 5
  explainability: shap
  target_label: "Bad leadership"
  target_description: "Whether the engineer rated their senior management 1-2 stars (1) or 3-5 stars (0)."
  target_value_labels: {"0": "Leadership OK (3-5★)", "1": "Bad leadership (1-2★)"}
  text_challenger:
    embedding_model: local-embed
    hf_model_id: "voyageai/voyage-4-nano"
    label: "voyage-4-nano sentence embeddings"
    estimator: lightgbm_small_data

ui_extras:
  kind: voyage_explorer
  scene: office_tower
  tab_label: "The Office"
  title: "Inside the tower · 4,000 engineers, one review each"
  subtitle: >
    Every desk is a real review, seated by job family. Colour is the model's
    probability that the reviewer's leadership is failing them; reveal what they really
    rated, find the reviews that surprised the model, click anyone to read their review
    with the words the model weighed highlighted — or write your own and compare the
    TF-IDF model with the transformer. The lights are always on in the penthouse.
  person_noun: engineer
  positive_is_adverse: true
  zone_by: JobFamily
  zones:
    - {key: "Leads & Architects", label: "Leads & Architects", description: "Top floor, glass walls: tech leads, architects and engineering managers — closest to senior leadership."}
    - {key: "Data & AI", label: "Data & AI lab", description: "Data scientists, ML and data engineers, analysts and research scientists."}
    - {key: "Software Engineering", label: "Software Engineering", description: "The open-plan floor: developers of every stack."}
    - {key: "DevOps & Cloud", label: "DevOps & Cloud", description: "The ops room: SRE, cloud, platform and systems engineers."}
    - {key: "QA & Test", label: "QA & Test lab", description: "Test and automation engineers, SDETs."}
  filters: [EmployeeStatus, EmployerType, Tenure]
  range_filters: [CompBenefits, WorkLifeBalance, ReviewYear]
  name_column: JobTitle
  # Fictional archetypes written as reviews — never real people.
  personas:
    - label: "The LinkedIn Visionary"
      description: "A 'Director of AI' who has never trained a model."
      record: {JobFamily: "Data & AI", EmployerType: "Enterprise IT", EmployeeStatus: Current, Tenure: "1+ years", ReviewYear: 2021, CompBenefits: 3, WorkLifeBalance: 2,
               Review: "All talk, no AI. Our Director of AI has never trained a model. His LinkedIn claims fifteen years of deep learning but he can't explain overfitting. He promises executives impossible deadlines, blames the developers when they slip and presents our work as his own."}
    - label: "The Buzzword Machine"
      description: "AI-first, synergy, 10x — and no roadmap."
      record: {JobFamily: "Software Engineering", EmployerType: "Banking & finance", EmployeeStatus: Current, Tenure: "3+ years", ReviewYear: 2021, CompBenefits: 4, WorkLifeBalance: 3,
               Review: "Buzzwords, no strategy. Every all-hands is about being AI-first, synergy and 10x innovation. No roadmap, no budget, no decisions. The strategy changes every quarter and nobody above us can explain it."}
    - label: "The Delegator-in-Chief"
      description: "Forwards everything, owns nothing."
      record: {JobFamily: "Data & AI", EmployerType: "Consulting", EmployeeStatus: Former, Tenure: "1+ years", ReviewYear: 2020, CompBenefits: 3, WorkLifeBalance: 2,
               Review: "Manager does nothing but forward. Every request is forwarded to the team. Developers write his reports, his slides and his estimates, and he disappears when things go wrong. Zero technical input, only pressure."}
    - label: "The Overpromising Salesperson"
      description: "Sells what doesn't exist; the engineers pay for it."
      record: {JobFamily: "Software Engineering", EmployerType: "Enterprise IT", EmployeeStatus: Former, Tenure: "3+ years", ReviewYear: 2021, CompBenefits: 3, WorkLifeBalance: 1,
               Review: "Sales sells vapourware. Account managers promise clients features that do not exist and deadlines nobody asked us about. Engineers work weekends to deliver, get blamed for the delay, and sales collects the bonus."}
    - label: "The Rumour Mill"
      description: "Covers their own misses with stories about the team."
      record: {JobFamily: "Data & AI", EmployerType: "Banking & finance", EmployeeStatus: Current, Tenure: "1+ years", ReviewYear: 2021, CompBenefits: 4, WorkLifeBalance: 2,
               Review: "Politics and false stories. Our manager tells leadership the data team is slow and the models failed, which is not true, to cover his own missed deadlines. The team is exhausted and nobody upstairs hears our side."}
    - label: "The Micromanager"
      description: "Status meetings about the status meetings."
      record: {JobFamily: "DevOps & Cloud", EmployerType: "Media & telecom", EmployeeStatus: Current, Tenure: "3+ years", ReviewYear: 2019, CompBenefits: 4, WorkLifeBalance: 2,
               Review: "Micromanaged to death. Daily status meetings about the status meetings. Every commit is questioned by someone who cannot read code. No trust, no autonomy."}
    - label: "The Cornering Boss"
      description: "Question a decision and you're sidelined."
      record: {JobFamily: "Software Engineering", EmployerType: "Other industries", EmployeeStatus: Former, Tenure: "3+ years", ReviewYear: 2020, CompBenefits: 3, WorkLifeBalance: 3,
               Review: "Speak up and you are out. Anyone who questions a decision is sidelined, left out of meetings and pressured in one-to-ones until they quit. Senior engineers leave every quarter."}
    - label: "The Tech Lead Who Still Codes"
      description: "The one everybody wants to work for."
      record: {JobFamily: "Software Engineering", EmployerType: "Tech & internet", EmployeeStatus: Current, Tenure: "3+ years", ReviewYear: 2021, CompBenefits: 3, WorkLifeBalance: 4,
               Review: "Great team, honest lead. Honestly few cons. Our lead still reviews pull requests, shields the team from politics and admits mistakes. Pay could be better."}
    - label: "Underpaid but well led"
      description: "The complaint is the salary, not the leadership."
      record: {JobFamily: "QA & Test", EmployerType: "Enterprise IT", EmployeeStatus: Current, Tenure: "1+ years", ReviewYear: 2021, CompBenefits: 2, WorkLifeBalance: 4,
               Review: "Great people, poor pay. Salary is below market and the office is old, but leadership is transparent, listens and explains every decision."}

rubric_check:
  title: "Leadership check"
  intro: >
    Describe what someone with power over the team's work — a manager, a salesperson, a
    self-styled expert — **actually does**: how they decide, delegate, give credit,
    handle mistakes, load the team, talk about the technology and about the team.
    Three readers answer side by side: the **TF-IDF model**, the **transformer
    challenger** (both trained on 4,000 engineers' reviews) and an **LLM coach** that checks the description against a research-based
    rubric of great-manager and toxic-leadership behaviours, quoting your words as
    evidence. **Describe behaviour, not people**: no names — the result is about the
    behaviour you wrote down, one perspective, never a verdict on a person.
  input_label: "What does this person do? (no names)"
  placeholder: "e.g. Forwards their own reports to the engineers, promises clients features that don't exist, tells leadership the team is slow to cover their own delays…"
  max_chars: 1500
  text_feature: Review
  subject_noun: leader
  positive_label: "Great leadership"
  negative_label: "Toxic management"
  # Google's Project Oxygen (2008, updated 2018): what its best-rated managers do.
  positive:
    - {key: coach, name: "Is a good coach", description: "Regular one-to-ones, specific timely feedback, helps people grow instead of solving everything for them."}
    - {key: empowers, name: "Empowers, doesn't micromanage", description: "Delegates outcomes rather than tasks, trusts the team, gives autonomy and stays available."}
    - {key: safety, name: "Builds a psychologically safe, inclusive team", description: "People can speak up, disagree and admit mistakes without fear; cares about wellbeing."}
    - {key: results, name: "Productive and results-oriented", description: "Removes blockers, keeps the team focused on outcomes, ships."}
    - {key: communicates, name: "Communicates: listens and shares information", description: "Transparent about decisions and their reasons, including bad news; actually listens."}
    - {key: career, name: "Supports careers and discusses performance", description: "Fair, honest reviews; sponsors promotions; talks about growth."}
    - {key: vision, name: "Has a clear vision and strategy", description: "Clear priorities and roadmap; explains the why; says no to distractions."}
    - {key: technical, name: "Has the technical skills to advise the team", description: "Understands the work well enough to review it, ask the right questions and weigh technical risk credibly."}
    - {key: shields, name: "Collaborates across the organisation and shields the team", description: "Builds bridges with other teams, absorbs politics instead of passing it down."}
    - {key: decides, name: "Is a strong decision maker", description: "Makes timely decisions and owns their consequences."}
    - {key: integrity, name: "Honest and accountable", description: "Admits their own mistakes, gives the team the credit, represents their own skills truthfully."}
  # Schmidt's Toxic Leadership Scale (2008) dimensions, plus common patterns engineers report.
  negative:
    - {key: abusive, name: "Abusive supervision", description: "Belittles, ridicules, shouts at or humiliates people, publicly or in private."}
    - {key: authoritarian, name: "Authoritarian control / micromanagement", description: "Controls every detail, allows no autonomy, punishes disagreement."}
    - {key: narcissism, name: "Narcissism", description: "Self-centred and entitled, needs admiration, cannot take criticism."}
    - {key: self_promotion, name: "Self-promotion & credit-taking", description: "Presents the team's work as their own, manages up, optimises for visibility over substance."}
    - {key: unpredictability, name: "Unpredictability", description: "Mood swings, arbitrary decisions, direction that changes constantly."}
    - {key: dishonesty, name: "Dishonesty & credential inflation", description: "Lies, breaks promises, inflates their CV or LinkedIn, pretends expertise they don't have."}
    - {key: blame, name: "Blame-shifting", description: "Scapegoats the team for failures, never accountable for their own decisions."}
    - {key: offloading, name: "Offloading their own job", description: "Pushes their own responsibilities — reports, estimates, decisions, stakeholder work — onto the team while keeping the title."}
    - {key: overloading, name: "Overloading the team", description: "Commits the team to work, scope or deadlines without asking about capacity; constant 'urgent' requests; treats evenings, weekends and burnout as normal."}
    - {key: falsehoods, name: "Spreading falsehoods", description: "Misrepresents the team's work, status or people to others — rumours, false stories about who is slow or who failed — usually to cover their own misses."}
    - {key: no_depth, name: "No technical depth or curiosity", description: "Cannot evaluate the work, dismisses technical risks, substitutes buzzwords for substance, isn't interested in the technology."}
    - {key: cornering, name: "Cornering and isolating people", description: "Sidelines, excludes or pressures individuals who disagree; divide and rule; retaliation."}
    - {key: absent, name: "Disengaged and absent", description: "Unavailable when needed, hides a lack of commitment behind meetings, status updates and delegation."}
  guidance: >
    Assess only the behaviours the text describes; do not speculate beyond it or
    diagnose personality disorders. If the text names or identifies a real person, do
    not repeat the name — refer to "the leader". Weigh severity: abuse, dishonesty or
    retaliation outweigh a single weakness. When the evidence is thin or one-sided,
    say so and pick "unclear" or "mixed". Advice is for the person who wrote the
    description (what to observe, discuss or escalate), practical and humane.
  examples:
    - label: "The LinkedIn Visionary"
      text: "Our Director of AI has never trained a model, though his LinkedIn claims fifteen years of deep learning. He promises impossible deadlines to executives, blames the developers when they slip and presents our work as his own in every steering meeting."
    - label: "The Delegator-in-Chief"
      text: "He forwards every request to the team and asks us to write his reports, estimates and slides. He is never available when production breaks, but he is always in the meeting where the results are presented."
    - label: "The Overpromising Salesperson"
      text: "He sells clients features we have never built and agrees deadlines without asking us. When the delivery slips he tells management engineering is slow, and the team works weekends to cover his promises."
    - label: "The Cornering Boss"
      text: "Anyone who questions one of her decisions is left out of the next meetings and gets 'feedback' in one-to-ones about attitude. Two senior engineers quit this quarter; she told leadership they were not team players."
    - label: "The Tech Lead Who Still Codes"
      text: "She reviews our pull requests, explains the reasons behind priorities, says no to the business when a deadline is unrealistic and credits the team by name when things go well. When she gets something wrong she says so."
    - label: "Mixed signals"
      text: "He protects the team from other departments and fights for our budget, but he changes priorities every week and sometimes loses his temper in stand-ups."

tutorial:
  tab_label: "Tutorial"
  positive_is_adverse: true
  intro: >
    "People don't leave companies, they leave managers." Engineers write it in
    reviews every day — about directors who can't read code, salespeople who sell what
    doesn't exist, visions made of buzzwords, work offloaded, credit taken and blame
    handed down. Often it is a **very small number of people** — the ones who, as they
    say in Spain, *tienen mucha cara* (have a lot of nerve) — and they can sour a whole
    company. This tutorial turns **4,000 real reviews by software, data and AI
    engineers** into a model that reads them: the full **NLP + structured data** workflow — framing, anonymising, de-leaking, turning text
    into numbers, combining it with the facts of the job, choosing and validating a
    gradient-boosting model, explaining it word by word, and racing a modern
    **sentence-transformer**. Every chart, metric and prediction below is computed
    **live** from this platform's own dataset and models.
  steps:
    - title: "1 · Frame the problem"
      body: |
        **Supervised learning, binary classification — with text.** Each row is one
        engineer's review. Glassdoor asks reviewers to rate **Senior Management** from 1
        to 5 stars; we call a rating of **1–2 stars** bad leadership (`BadLeadership`
        = 1) and ask: **from what they wrote, plus a few facts about their job, can a
        model tell?**

        We predict a **probability**, and we rank models by **ROC AUC**: the chance
        that a random bad-leadership review scores higher than a random OK one (0.5 is
        a coin flip, 1.0 perfect). Accuracy would flatter us: about 26% of reviews are
        bad-leadership, so answering "leadership is fine" every time is already 74%
        accurate.

        Why this matters: a handful of people — managers, salespeople, self-styled AI
        experts with an inflated CV — can wreck a technical team by offloading their own
        job onto it, overloading it and misrepresenting it to the rest of the company.
        The engineers who leave rarely say so in the exit interview; they say it in
        free text — reviews, surveys — and reading that at scale is an NLP problem.
      takeaway: "A model must beat 74% accuracy just to beat 'leadership is always fine' — so we rank models by ROC AUC."
      widgets: [class_balance]

    - title: "2 · Meet the data"
      body: |
        Kaggle's **Glassdoor Job Reviews** (David Gauthier, **CC BY-SA 4.0**): 838,566
        anonymous reviews of UK employers, 2008–2021. We keep only engineering roles —
        about 42,000 reviews — and publish a stratified sample of **4,000**:

        | Column | Meaning |
        | --- | --- |
        | `Review` | The review's **headline + cons**, anonymised (free text) |
        | `JobFamily` | Software Engineering, Data & AI, DevOps & Cloud, QA & Test, Leads & Architects |
        | `EmployerType` | The employer's **sector**, never its name |
        | `EmployeeStatus`, `Tenure` | Current or former; how long they'd been there |
        | `ReviewYear` | When the review was written |
        | `CompBenefits`, `WorkLifeBalance` | 1–5 star ratings of pay and hours — our controls |
        | `BadLeadership` | Target: senior management rated 1–2★ |

        Data & AI roles are **over-sampled** (1,000 of the 4,000) so the AI story is
        visible. `ReviewId` and `JobTitle` identify each review in every table but are
        never model inputs.
      widgets: [dataset_preview]

    - title: "3 · Clean, anonymise, de-leak"
      body: |
        Three decisions shape this dataset more than any algorithm will:

        **Anonymise.** Company names are dropped and replaced by a sector; names
        inside the text (the employer's own, well-known companies, CEOs and HQ towns
        that would give it away) become `[company]` / `[name]`. Otherwise the model
        learns which company a review is about — a shortcut — instead of what it
        says about leadership. And a public tutorial should never name and shame.

        **De-leak.** Glassdoor also records an overall rating, CEO approval, "would you
        recommend" and business outlook — near-restatements of the target, all dropped.

        **Beware the halo effect.** Reviewers who rate leadership 1★ usually rate
        **culture** and **career** 1★ too. With those two ratings the model reaches
        **0.923** ROC AUC — but it stops reading: the ratings answer the question for
        it. The use case is text (what people write), so we keep only pay and
        work-life balance, as **controls**: is it the money, the hours, or the manager?

        | Inputs (LightGBM) | 5-fold CV ROC AUC, all 4,000 reviews |
        | --- | --- |
        | Job context + pay + hours, **no text** | 0.825 |
        | **Review text only** | 0.808 |
        | **Everything we use** | **0.874** |
        | + culture & career ratings (halo) | 0.923 |

        **Honesty note:** reviews are **self-selected** — people who write one are
        often unusually happy or unhappy — and former employees are over-represented.
        The model learns what reviewers say, not how all engineers feel.
      takeaway: "The most predictive column isn't always the right one: a halo feature can quietly do the model's job for it."

    - title: "4 · Text is data: from words to numbers"
      body: |
        A model can't read, so text becomes numbers. The classic recipe, **TF-IDF**
        (Spärck Jones, 1972), still underpins search engines:

        1. **Tokenise & normalise** — lowercase, split into words:
           `"Upper management lies"` → `upper`, `management`, `lies`.
        2. **Drop stop words** (`the`, `and`, `of`) — but **keep negations**: `no`,
           `not`, `never`, `without`. Standard lists remove them, and "no direction"
           means the opposite of "direction".
        3. **N-grams** — also count two-word phrases: `upper management`,
           `no direction`, `office politics`.
        4. **TF-IDF weight** — term frequency (how often in this review, log-scaled)
           × inverse document frequency (rarer across all reviews = more
           informative). `management` appears everywhere; `incompetent` is rare and
           telling.
        5. **Vocabulary** — keep terms in at least 5 reviews, at most 3,000.

        Each review becomes a row of ~2,500 numbers, almost all zero (a **sparse**
        matrix). The step lives **inside** the model pipeline, so the deployed model
        reads raw text — type any review in the what-if and it is tokenised live.

        Longer is angrier: bad-leadership reviews have a median of **24 words**, OK ones
        **13**.
      takeaway: "TF-IDF turns text into weighted word counts — crude, fast, and every number maps back to a word you can read."

    - title: "5 · Explore: is it the money, the hours, or the manager?"
      body: |
        The bars show the share of bad-leadership reviews per group:

        - **Former employees** report bad leadership far more often (37% vs 21%) —
          people leave managers, or leavers are simply angrier? Probably both.
        - **Pay and hours matter — but they aren't the whole story**: even at 4★ pay,
          almost 1 in 5 reviewers rate leadership 1–2★.
        - **Sectors differ**: Media & telecom 35%, Tech & internet 20%.
        - **Tenure**: veterans of 10+ years are the most critical (38%); newcomers the
          least (19%) — the honeymoon effect.
        - **Drift**: bad-leadership ratings fall from ~1 in 3 before 2017 to under 1 in
          5 in 2020–21. A model trained on the past can mislead about the present.
      takeaway: "Pay and hours explain part of the anger; the rest is in the words — which is why we need the text."
      charts:
        - {type: bar, x: EmployeeStatus, y: BadLeadership, agg: mean, color_by: EmployeeStatus}
        - {type: bar, x: CompBenefits, y: BadLeadership, agg: mean}
        - {type: bar, x: EmployerType, y: BadLeadership, agg: mean, color_by: EmployerType}
        - {type: line, x: ReviewYear, y: BadLeadership, agg: mean}

    - title: "6 · Combine text and structure: gradient boosting"
      body: |
        One scikit-learn **pipeline** turns a mixed row into one wide numeric matrix,
        then boosts trees on it:

        ```
        ColumnTransformer
          num       → impute median, scale      (ReviewYear, CompBenefits, WorkLifeBalance)
          cat       → impute, one-hot encode    (JobFamily, EmployerType, Status, Tenure)
          text_Review → TF-IDF 1-2 grams        (Review)
        → LightGBM
        ```

        **Why gradient boosting (LightGBM)?** Trees learn **interactions** by
        themselves — "politics" weighs differently when pay is fine than when it
        isn't — and handle thousands of sparse word columns efficiently.

        **Protocol:** a stratified 80/20 split sets aside a **hold-out**; on the 80%,
        **5-fold cross-validation** ranks two candidates:

        - **LightGBM, small-data settings** — shallow trees, slow learning rate, row
          and column subsampling, L2 regularisation.
        - **LightGBM, default settings** — deeper, more leaves.

        **Green Code**: the heavier model is only adopted if it wins by more than 0.01
        ROC AUC. With ~3,200 training reviews and ~2,500 word columns, taming the trees
        matters more than adding capacity: the small-data settings win by about 0.01 —
        so they stay. The leaderboard below is live (cross-validated on the 80% training
        split, so a little below the all-data numbers in chapter 3), and also lists the
        **transformer challenger** (chapter 8).
      widgets: [model_card]

    - title: "7 · Evaluate honestly"
      body: |
        The selected model, trained on the 80% only, scored on the untouched hold-out:

        - The **ROC curve** trades true positives (bad leadership caught) against false
          positives (OK leadership flagged) at every cut-off.
        - The **confusion matrix** counts the four outcomes at 50%. **Precision**: of the
          reviews we flagged, how many really rated leadership 1–2★? **Recall**: of those
          that did, how many did we find?

        Why not higher? Some reviewers rant about pay and still rate leadership 3★;
        others write two neutral words and rate it 1★. The text is a window, not a mind.
      takeaway: "Metrics on data the model never saw during selection are the only ones worth quoting."
      widgets: [roc_curve, confusion_matrix]

    - title: "8 · Bag of words vs transformers"
      body: |
        TF-IDF knows nothing about meaning: "incompetent" and "clueless" are
        unrelated columns. **Sentence-transformers** map a whole review to a dense
        vector where similar meanings sit close together. We swapped TF-IDF for
        three of them and kept everything else identical (same LightGBM, same 5 folds
        over all 4,000 reviews):

        | Text encoder | Year | Text only | Text + job context |
        | --- | --- | --- | --- |
        | TF-IDF (bag of words) | 1972 | 0.808 | 0.874 |
        | all-MiniLM-L6-v2 (22M params) | 2021 | 0.816 | 0.876 |
        | all-mpnet-base-v2 (110M) | 2021 | 0.831 | 0.881 |
        | **voyage-4-nano** (this platform's `local-embed`) | latest | **0.837** | **0.881** |

        **Reading text alone, transformers win clearly** (+0.03). **Combined with the
        job context the gap shrinks to about +0.01** — +0.007 on all 4,000 reviews, about
        +0.012 in the live leaderboard's cross-validation (chapter 6), and a dead heat on
        the untouched hold-out (0.886 vs 0.885 ROC AUC). The context already carries much
        of what the extra understanding would add.

        So which one should be deployed? Accuracy says the transformer, by a hair — right
        at Green Code's 0.01 bar, and the model card flags it. Everything else says
        TF-IDF: on this machine's GPU voyage-4-nano embeds all 4,000 reviews in
        **seconds**, on the cluster's CPU it would take about **40 minutes**; every live
        prediction needs a round-trip to an embedding model (~0.6 s vs ~0.1 s); and its
        1,024 dimensions don't map to words, so there is no word-by-word explanation.

        This platform deploys the **TF-IDF model** and trains the **voyage-4-nano +
        LightGBM challenger** on the same split every run, serving it on demand —
        promotion is a human decision. Compare them on any review in **The Office**.
      takeaway: "Newer models usually win on accuracy — measure by how much on your task, then weigh that against compute, dependencies and explainability."

    - title: "9 · The vocabulary of toxic leadership"
      body: |
        **SHAP** splits every prediction into contributions:

        `probability = average rate + Σ contribution of each input`

        For the review, the contribution is the sum over its words and phrases — and
        because TF-IDF columns **are** words, we can rank them. Below: the terms whose
        presence pushes the probability of bad leadership **up** (red flags) and
        **down** (green flags), averaged over the reviews that contain them.

        In the raw data, reviews mentioning "blame" rate leadership 1–2★ 86% of the
        time, "incompetent" 82%, "toxic" 67%, "management" 60% — against 26% overall.
      takeaway: "Global importance says the text matters most; the word lists say how it speaks."
      widgets: [feature_importance, top_terms]

    - title: "10 · Read a review like the model"
      body: |
        Fictional archetypes, written as reviews and scored live. Each word is coloured
        by how much it pushed the probability up (red) or down (blue). Compare **the
        Delegator** at 2★ and 5★ pay — same words, different context — and **the
        Tech Lead** against **the LinkedIn Visionary** — similar context, different
        words.
      takeaway: "The model weighs words and context together — the same complaint means more when the pay is fine."
      widgets: [examples]

    - title: "11 · NLP pitfalls"
      body: |
        - **Sarcasm** — "Great leadership, if you enjoy being lied to" contains
          `great`. Bag-of-words can't see the irony; context-aware models sometimes can.
        - **Negation & scope** — bigrams catch "no direction", not "there was never
          any real direction".
        - **Context flips** — `office politics` (a mild, common complaint) can pull the
          other way from `politics` on its own.
        - **Negation hides in single words** — `transparent` ranks as a **red** flag:
          reviewers mostly write it as `not transparent` or `no transparency`. The bigram
          `not transparent` captures some of it; the unigram carries the rest.
        - **Proxies** — a term can stand for a decision rather than a behaviour (layoffs,
          offshoring, reorganisations). Always read the top terms before trusting a model.
        - **Shortcuts** — without anonymisation, company names would have been among the
          strongest "words".
        - **Domain & language** — English, UK, 2008–2021: not your company in 2026.
      takeaway: "Look at what the model learned, not just how well it scores."

    - title: "12 · Responsible AI: reviews, not people"
      body: |
        This model reads **anonymous reviews about organisations**. It must **never**
        be used to score a named manager, rank employees or monitor what staff write —
        that would be surveillance, legally risky (GDPR, labour law) and unreliable: a
        model trained on self-selected reviews knows nothing about any individual.

        **What no text model can see:** whether a CV or LinkedIn profile is true, or how
        good someone really is technically. Checking claims takes evidence: technical
        conversations, work samples, references.

        **What healthy engineering leadership looks like** — the green flags above
        echo Google's **Project Oxygen**: coaching, empowering without micromanaging,
        psychological safety, clear vision, **technical credibility**, honesty. The
        **Leadership check** in The Office asks an LLM to read a description of
        behaviour against that rubric and the **Toxic Leadership Scale** — describe what
        someone does, never who they are.

        **Speaking up is part of the job.** If you are a senior engineer or a tech lead
        and someone is offloading their work onto your team, overloading it or spreading
        falsehoods about it, reporting it is your responsibility — the people below you
        often can't. Do it the way you'd defend a model: **evidence** (who did the work,
        what was promised and claimed, dates, hours), **the right channel** (your own
        management chain, HR, the company's internal reporting channel), **behaviours
        rather than labels**, and never rumours — or you become the problem you are
        reporting. The model gives you the aggregate pattern; the report is yours.
      takeaway: "A model's use decides whether it is responsible: aggregate insight about culture yes, a verdict on a person no — that takes a human, with facts."

    - title: "13 · Your turn"
      body: |
        Open **The Office**. Every desk is a review, floor by job family, coloured by the
        model's probability. Filter a cohort (say, former Data & AI engineers), reveal
        their real ratings, find the surprises, click anyone to read their review with
        highlighted words — then load a persona, rewrite the review and compare the
        TF-IDF model with the transformer. Finally, try the **Leadership check** with
        a leader you've worked with — behaviours, not names.

