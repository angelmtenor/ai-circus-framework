# Seed definition for the "luznova_regional_demand" scenario — loaded into the
# `platform` Postgres schema by services/platform-registry at bootstrap. Editing this
# file and re-seeding is how a developer adds/changes a scenario; it is never read
# directly by any other service (see AGENTS.md / plan: "Scenario registry").
#
# The scenario-specific services (etl-tabular, training, prediction) also read this
# file directly for their own operational config (dataset schema, model candidates) —
# that's build-time parameterization analogous to each service's own settings.yaml,
# not tenant/entitlement data, so it doesn't need to go through platform-registry's API.
#
# First of three scenarios for "Luznova Utilities", a fictional Spanish electricity +
# gas distributor — mirroring real-world utility AI use cases (regional demand
# forecasting, non-technical-loss detection, EV charging prediction) with entirely
# original/synthetic data. Like `cnc_surface_finish`, this is NOT a ported public
# dataset (hence no `credits` block) — it's a designed synthetic generator grounded
# in real geography: every real row is a (day, provincia) observation at one of
# Spain's 50 real provinces (real provincial-capital lat/lon, real-order-of-magnitude
# population figures summing to each parent region's own real total), and a
# physically plausible demand formula (population x per-capita baseline x an
# industrial-intensity multiplier x a temperature "bathtub curve" x weekend/holiday
# suppression x lognormal noise) — see scripts/generate_luznova_regional_demand.py
# for the exact formula. Disclosed as a designed combination of real geography and a
# directionally realistic demand model, not fitted to any real consumption dataset.
#
# This is the flagship scenario for ui-react's `ui_extras: region_map` 5th workspace
# tab (see RegionMapView.tsx) — two selectable aggregation levels (Comunidad
# Autónoma / Provincia) batch-predict all of their bubbles at once from the SAME
# trained model and plot them on a Spain map. Only `province` (50 categories) is an
# actual trained feature — `region` (17 categories) is *not*, deliberately: every
# province belongs to exactly one region, so a "region" column would be perfectly
# collinear with `province` and add nothing but a second, redundant high-cardinality
# categorical (confirmed empirically: training both together crashed SHAP's sparse-
# matrix subsampling). A "province" map query pins `province` to its own key plus
# its own real, smaller population/industrial_index; a "region" query instead pins
# `province` to that region's largest (capital) province and population_thousands/
# industrial_index to the region's own real aggregate — both genuinely different,
# genuinely explainable (SHAP) predictions from the one trained model, not a
# client-side split of one number.

slug: luznova_regional_demand
kind: tabular_ml
title: "Regional Electricity Demand Forecasting"
description: >
  Predicts daily electricity demand (in MWh) for a Spanish Comunidad Autónoma or
  provincia from calendar/weather conditions and the area's own population and
  industrial intensity — utility grid planning and reserve allocation, viewable on a
  live Spain map at either aggregation level.
role_required: "scenario:luznova_regional_demand"
industry: energy_utilities
icon: "⚡"

chat:
  context: >
    Luznova Utilities' electricity demand-forecasting model, covering both of
    Spain's administrative granularities — its 17 Comunidades Autónomas and its 50
    provincias — predicts an area's total daily grid demand (MWh) from the date's
    calendar context (month, weekend, national holiday), mean daily temperature, and
    that area's own population and industrial-intensity index. Demand rises both in
    cold winter months (heating) and hot summer months (air conditioning) relative
    to a mild ~18°C day, and drops on weekends/holidays.
  sample_questions:
    - "Which factors matter most for predicting demand?"
    - "How accurate is the trained model?"
    - "Why does a colder-than-average day increase predicted demand?"
    - "Does an area's industrial index matter more than its population?"
    - "How much does demand drop on a national holiday?"

dataset:
  bucket: "scenario-luznova-regional-demand"
  # SeaweedFS key once uploaded; etl-tabular reads it from there.
  raw_object: "raw/luznova_regional_demand.csv"
  # Tracked local file (relative to this scenario's directory) etl-tabular uploads to
  # SeaweedFS on first run if raw_object doesn't exist yet for the tenant — demo bootstrap only.
  seed_file: "sample_data/luznova_regional_demand.csv"
  index_col: "row_id"
  target: "demand_mwh"
  feature_columns:
    - province
    - month
    - is_weekend
    - is_holiday
    - mean_temperature_c
    - population_thousands
    - industrial_index

  # Drives both UIs' generic form renderer (see libs/shared/scenario_schema.py) —
  # ranges taken from the generator's own real province table / a full year's
  # synthetic weather (see scripts/generate_luznova_regional_demand.py).
  feature_schema:
    province:
      {type: categorical, label: "Province (Provincia)",
       options: [sevilla, malaga, cadiz, cordoba, granada, jaen, almeria, huelva, barcelona, tarragona, girona, lleida, valencia, alicante, castellon, a_coruna, pontevedra, lugo, ourense, valladolid, leon, burgos, salamanca, palencia, zamora, avila, segovia, soria, vizcaya, guipuzcoa, alava, toledo, ciudad_real, albacete, cuenca, guadalajara, las_palmas, santa_cruz_tenerife, zaragoza, huesca, teruel, badajoz, caceres, asturias, baleares, cantabria, madrid_prov, murcia, navarra, la_rioja],
       default: madrid_prov,
       info: "Which of Spain's 50 provincias this demand figure is for — the map tab can predict all 50 at once, or all 17 regions at once."}
    month:
      {type: numeric, label: "Month", min: 1, max: 12, default: 1, step: 1,
       info: "Calendar month (1=January). Drives the seasonal component of demand via that day's temperature."}
    is_weekend:
      {type: numeric, label: "Weekend", min: 0, max: 1, default: 0, step: 1,
       info: "1 if Saturday/Sunday — weekend demand runs lower (less commercial/industrial activity)."}
    is_holiday:
      {type: numeric, label: "National holiday", min: 0, max: 1, default: 0, step: 1,
       info: "1 on a Spanish national holiday — demand drops further than a plain weekend."}
    mean_temperature_c:
      {type: numeric, label: "Mean temperature", min: -3.0, max: 31.0, default: 15.0, step: 0.5,
       info: "That day's mean temperature in °C. Demand rises both well below and well above a mild ~18°C point (heating/cooling load)."}
    population_thousands:
      {type: numeric, label: "Population", min: 90, max: 8600, default: 6700, step: 10,
       info: "The area's population, in thousands — the main driver of baseline demand scale. Fixed per area on the map tab (a province's own population at province granularity, or the whole region's at region granularity)."}
    industrial_index:
      {type: numeric, label: "Industrial intensity index", min: 0, max: 100, default: 55, step: 1,
       info: "A 0-100 proxy for how industrial (vs. purely residential) the area's economy is — higher values add proportionally more demand on top of the population baseline. Fixed per area on the map tab."}

  # Seeds ui-react's Data tab dashboard (see libs/shared/scenario_schema.py's
  # ChartSpec) — still user-editable/addable there, just a sensible starting point.
  default_charts:
    - {type: scatter, x: mean_temperature_c, y: demand_mwh, color_by: is_weekend}
    - {type: bar, x: province, y: demand_mwh, agg: mean}
    - {type: line, x: month, y: demand_mwh, agg: mean}

model:
  task_type: regression
  candidates: ["lightgbm"]
  accuracy_gain_threshold_for_complexity: 0.02
  explainability: shap
  target_units: "MWh"
  target_label: "Predicted demand"
  target_description: "Total electricity demand forecast for this area on this day, in megawatt-hours."

services:
  etl: etl-tabular
  training: training
  prediction: prediction
  assistant: assistant

# Opt-in 5th workspace tab (see ui-react's RegionMapView.tsx) — two selectable
# aggregation levels, each batch-predicted in a single /predict/luznova_regional_demand
# call from the SAME trained model, colored/sized by demand_mwh. Every bubble's
# `feature_overrides` pins its own real values (both `region`+`province`, plus
# population/industrial_index at that granularity) so the shared what-if controls
# (month/weekend/holiday/temperature) apply the same day-scenario across every
# bubble while each keeps its own real profile.
ui_extras:
  kind: region_map
  value_label: "Predicted demand (MWh)"
  levels:
    - key: region
      label: "Comunidad Autónoma"
      # No group_by: `region` isn't a trained feature (see the disclosure note at
      # the top of this file) — every bubble here is fully specified by
      # feature_overrides alone (province: <capital>, population/industrial_index:
      # <region aggregate>).
      regions:
