# Seed definition for the "docs_rag" scenario — conversational-only, no dashboard.
# Loaded into the `platform` Postgres schema by services/platform-registry at bootstrap.

slug: docs_rag
kind: conversational_rag
title: "Ask Your Documents"
description: >
  Agent-based RAG chatbot answering questions grounded in a previously vectorized
  set of documents (policies, manuals, reports, ...).
role_required: "scenario:docs_rag"
icon: "💬"

# Grounds rag-agent's system prompt AND its judgment of whether a question is
# in-domain enough to call the retrieve_docs tool at all — chitchat/off-topic
# questions are answered directly, without retrieval (see libs/shared/scenario_schema).
chat:
  context: >
    A retail bank's account policies, customer FAQ, and data security/fraud-monitoring
    policy documents — checking/savings account types and limits, deposits and
    withdrawals, disputing transactions, lost/stolen cards, and how customer data is
    protected.
  sample_questions:
    - "What's the daily ATM withdrawal limit on a Premium Checking account?"
    - "How do I dispute a transaction, and how long does it take?"
    - "How is my data protected if my card is lost or stolen?"

documents:
  # Source documents uploaded/staged into MinIO at bootstrap; etl-vectorize reads them from there.
  bucket: "scenario-docs-rag"
  raw_prefix: "raw/"
  # Tracked local folder (relative to this scenario's directory) etl-vectorize
  # uploads to MinIO on first run if raw_prefix is empty for the tenant — demo
  # bootstrap only, same pattern as churn/scenario.yaml's dataset.seed_file.
  seed_prefix: "sample_docs"
  chunking:
    strategy: recursive_character
    chunk_size: 800
    chunk_overlap: 120
  embedding:
    model: "sentence-transformers/all-MiniLM-L6-v2"

vector_store:
  backend: qdrant
  # One collection per tenant: "{collection_prefix}__{tenant_org_id}"
  collection_prefix: "docs_rag"
  top_k: 5

services:
  etl: etl-vectorize
  agent: rag-agent
