  base_model: "facebook/convnextv2-nano-22k-224"
  base_model_revision: "755dacbc560ac81ac8eb39249eab691dab85506c"
  base_model_params: "15.6M"
  input_label: "Frame from a fixed lookout camera"
  target_label: "Sky condition"
  target_description: "Whether a wildfire smoke plume is visible anywhere in the frame — the first minutes of a plume are a few pixels, so the model is judged on how quickly it catches one, not only on frame accuracy."
  disclaimer: "Demonstration only — not an operational fire detection system."
  # Wide frames squashed to a square: a distant plume is tens of pixels, so more than the 224 px
  # of the other ConvNeXt scenarios — still a 15.6M-parameter model that serves from a CPU pod.
  image_size: 320
  occlusion_grid: 8
  quantize: false
  training:
    gpu: {epochs: 10, batch_size: 32, learning_rate: 1.0e-4}
    # CPU: a 500-frame subset for 2 epochs — a working model in a few minutes.
    cpu: {epochs: 2, batch_size: 16, learning_rate: 2.0e-4, max_train_samples: 500}
    seed: 42
    class_weighted_loss: true
  # Every test frame (8 fires x 81 + 3 controls x 40): the wall plays whole recordings, in order.
  gallery_size: 900
  reference_size: 400
  labels:
    - {key: "0", label: "Clear", description: "No smoke plume visible — haze, cloud, dust and glare included."}
    - {key: "1", label: "Smoke", description: "A wildfire smoke plume is visible (from the frame where it first appears)."}

# The Watch Wall tab: six cameras advance on one clock; the deployed model scores each frame as
# it arrives and an alert fires after `consecutive_frames_to_alert` smoke frames in a row.
ui_extras:
  kind: camera_wall
  positive_label: "1"
  event_noun: "smoke plume"
  alert_threshold: 0.5
  consecutive_frames_to_alert: 2
  tick_ms: 700
  # Opens with four fires and two no-fire controls; the viewer can swap in any of the 11 held-out cameras.
  wall_size: 6
  default_cameras: [dwpgm-s, lp-n, syp-n, ws-n, sp-s, so-w]
  tab_label: "Watch Wall"
  title: "Live lookout wall"
  note: "Held-out HPWREN recordings from lookouts the model never saw in training, one frame a minute replayed at speed. Controls show a lookout before any fire: an alert there is a false alarm."

services:
  training: dl-training
  inference: dl-inference
