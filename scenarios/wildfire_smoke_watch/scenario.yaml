# Seed definition for the "wildfire_smoke_watch" scenario — a `deep_learning` computer vision
# scenario (`task: classification`, the chest X-ray / solar-cell code path) in public safety:
# six fixed fire-lookout cameras play side by side, the deployed model scores every frame as it
# arrives, and an alert is raised when smoke persists — measured against the moment the plume
# first became visible. Loaded into the registry by services/platform-registry at bootstrap;
# dl-training and dl-inference also read the `deep_learning` block directly.
#
# No image lives in this repo: dl-training downloads the pinned per-camera archives (SHA-256
# checked) into the scenario's SeaweedFS bucket on first run (`make dl-data`). Regenerate the
# `source:` block with scripts/prepare_figlib_sequences.py.

slug: wildfire_smoke_watch
kind: deep_learning
title: "Wildfire Smoke Watch (CV)"
description: >
  A wall of fire-lookout cameras that watches for the first smoke of a wildfire. Mountain-top
  cameras from Southern California's HPWREN network replay real recordings, one
  frame a minute from forty minutes before a plume appears to forty minutes after, and a
  ConvNeXt V2 network fine-tuned on twelve other lookouts scores every frame as it arrives.
  An alert fires when smoke persists for consecutive frames, and the wall reports how many
  minutes after the plume first became visible each camera raised it — and whether any camera
  cried wolf first. Some feeds are controls — a lookout before any fire, where every alert is a
  false alarm — and the viewer picks which six of the eleven held-out cameras play. The test cameras were never seen in training, so the numbers are what
  a newly installed camera would get. Hard on purpose: a fresh plume is a few pixels against
  haze, cloud and glare, and the first minutes are genuinely ambiguous.
role_required: "scenario:wildfire_smoke_watch"
industry: public_sector
icon: "🔥"

credits:
  source: "HPWREN Fire Ignition images Library (FIgLib) — UC San Diego"
  url: "https://www.hpwren.ucsd.edu/FIgLib/"
  note: >
    Images courtesy of the High Performance Wireless Research and Education Network
    (https://www.hpwren.ucsd.edu/), UC San Diego; credit reference required for derivative
    work, data provided as-is. Dobbins et al., "FIgLib & SmokeyNet: Dataset and Deep Learning
    Model for Real-Time Wildland Fire Smoke Detection", Remote Sensing 2022. Each recording is
    81 frames, one a minute, from 40 minutes before to 40 minutes after the plume first
    becomes visible (frame offset 0, read from the file name). 25 recordings of
    25 lookouts, none in more than one split; three test feeds use only the pre-ignition half of
    their recording (controls). Frames within 10 minutes after offset 0 are left
    out of training and validation (a plume of a few pixels teaches the model to see smoke
    where there is none) but stay in the wall. Base model: facebook/convnextv2-nano-22k-224
    (Apache-2.0). Not validated for operational use — never a substitute for a lookout, a
    911 call or an official fire detection system.

chat:
  context: >
    A wildfire smoke detector watching six fixed lookout cameras. It scores each frame as clear
    or smoke, raises an alert after consecutive smoke frames, and shows an occlusion heatmap of
    the part of the image that drove the call.
  sample_questions: []

