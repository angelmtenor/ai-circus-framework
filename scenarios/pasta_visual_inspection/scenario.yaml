# Seed definition for the "pasta_visual_inspection" scenario — the harder of the two
# `deep_learning` / `task: anomaly_detection` manufacturing scenarios (the other is
# pcb_visual_inspection). Same model family and code path; only the data differ, which
# is the point: a free-placed, textured scene with pin-sized defects instead of an
# aligned circuit board. Loaded into the registry by services/platform-registry at
# bootstrap; dl-training and dl-inference also read the `deep_learning` block directly.
#
# No image lives in this repo: dl-training downloads the pinned Parquet files (SHA-256
# checked) into the scenario's SeaweedFS bucket on first run (`make dl-data`).

slug: pasta_visual_inspection
kind: deep_learning
title: "Pasta Line Visual Inspection (CV Anomaly Detection — hard)"
description: >
  End-of-line quality control for a dried-pasta plant: a camera over the conveyor photographs
  four elbow macaroni at a time, dropped at random positions and angles on a textured belt,
  and flags any tray with a cracked, chipped, pitted or stained piece — after learning only
  from photos of good pasta. Much harder than the PCB line: nothing is aligned, the belt's
  own texture is busy, and most defects are a few pixels wide. The detector is not good
  enough to run the line alone — the live inspection line shows how much still needs a
  human, and how many defective trays would slip through at each confidence threshold.
role_required: "scenario:pasta_visual_inspection"
industry: manufacturing_industry
icon: "🍝"

credits:
  source: "VisA — Visual Anomaly dataset, Macaroni2 subset (Amazon Science, CC BY 4.0)"
  url: "https://github.com/amazon-science/spot-diff"
  note: >
    Zou et al., "SPot-the-Difference Self-Supervised Pre-training for Anomaly Detection
    and Segmentation", ECCV 2022. Macaroni2 = four elbow macaroni per photo on a textured
    green background, 1,000 good and 100 defective photos with pixel-level defect masks, in
    the official one-class split (900 good for training; 100 good + 100 defective for
    testing), read from the BrachioLab/visa Parquet mirror at a pinned commit — one of
    VisA's hardest categories. Backbone: facebook/dinov2-with-registers-small (Apache-2.0).
    Not validated for production use.

chat:
  context: >
    A visual anomaly detector for trays of dried pasta on a conveyor that learns from good
    pasta only, with patch-level defect heatmaps and the closest known-good trays as evidence.
    Harder than PCB inspection: random placement, textured background, tiny defects.
  sample_questions: []

deep_learning:
  modality: image
  task: anomaly_detection
  bucket: "scenario-pasta-visual-inspection"
  source:
    type: huggingface_files
    repo: "BrachioLab/visa"
    revision: "d185c42584b49f1df81fe12bde627559ed88d483"
    format: parquet
    files:
      train: "data/macaroni2.train-00000-of-00001.parquet"
      test: "data/macaroni2.test-00000-of-00001.parquet"
    sha256:
      data/macaroni2.train-00000-of-00001.parquet: "f3395e0072c5179bf580066687f74bd7f33426d4fc08cfcf7f656d382748fe73"
      data/macaroni2.test-00000-of-00001.parquet: "1d8951fc9df45046c01158a7a9b02f9d901a4ec4ffe3635cef5910a5102bc813"
    image_field: image
    mask_field: mask
    label_field: label
  # Same frozen backbone as pcb_visual_inspection (see there): the difficulty is in the data.
  base_model: "facebook/dinov2-with-registers-small"
  base_model_revision: "0d9846e56b43a21fa46d7f3f5070f0506a5795a9"
  base_model_params: "22M"
  input_label: "Top-down photo of a pasta tray on the conveyor"
  target_label: "Inspection result"
  target_description: "Whether any piece on the tray deviates from all the good pasta seen in training — a crack, chipped edge, pinhole, scratch or colour spot, even a defect type never seen before."
  image_size: 448
  anomaly:
    normal_label: "0"
    # A pinhole covers one or two 14-px patches out of 1,024: averaging more patches
    # (PCB uses 1%) dilutes it with belt texture. Measured on GPU, held-out AUROC 0.89
    # at 0.3% (4 patches) -> 0.91 at 0.1% (2 patches).
    top_k_fraction: 0.001
  training:
    # GPU: every good training tray (~810) -> ~830k patch features -> 16k-patch coreset
    # (a 32k bank measured no better).
    gpu: {batch_size: 16, memory_bank_size: 16384}
    # CPU: 160 trays and a 4k-patch coreset — a few minutes, noticeably weaker detection.
    cpu: {batch_size: 4, max_train_samples: 160, memory_bank_size: 4096}
    val_fraction: 0.1
    seed: 42
    # Training data are good trays only: P(defect) is fitted on a stratified 30% of
    # the labelled test pool; metrics are reported on the untouched 70%.
    calibration_holdout_fraction: 0.3
  gallery_size: 140
  reference_size: 120
  labels:
    - {key: "0", label: "Good", description: "Every piece matches the good pasta the model learned from — pack it."}
    - {key: "1", label: "Defective", description: "At least one piece deviates from all known-good pasta — crack, chipped edge, pinhole, scratch or colour spot."}

# The Inspection Line tab: trays come off the line one by one and are passed, rejected,
# or sent to a human inspector when the model is not confident enough.
ui_extras:
  kind: triage_board
  tab_label: "Inspection Line"
  title: "Live pasta inspection line"
  item_noun: "tray"
  reviewer_noun: "inspector"
  critical_kpi_label: "Defects caught"
  review_lane_label: "Manual inspection"
  note: "Held-out VisA test trays, replayed. Escapes (defective trays auto-passed) are the costly error — with this harder product, expect some at a low threshold."
  confidence_threshold: 0.8
  tick_seconds: 3
  lanes:
    - key: pass
      label: "Pass — pack"
      description: "Confidently good: goes straight to packing."
      tone: ok
      labels: ["0"]
    - key: reject
      label: "Reject — divert"
      description: "Confidently defective: diverted off the line."
      tone: critical
      labels: ["1"]

services:
  training: dl-training
  inference: dl-inference
