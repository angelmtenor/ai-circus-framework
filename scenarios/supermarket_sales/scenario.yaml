# Seed definition for the "supermarket_sales" scenario — loaded into the `platform`
# Postgres schema by services/platform-registry at bootstrap. Editing this file and
# re-seeding is how a developer adds/changes a scenario; it is never read directly by
# any other service (see AGENTS.md / plan: "Scenario registry").
#
# The scenario-specific services (etl-tabular, training, prediction) also read this
# file directly for their own operational config (dataset schema, model candidates) —
# that's build-time parameterization analogous to each service's own settings.yaml,
# not tenant/entitlement data, so it doesn't need to go through platform-registry's API.
#
# A `regression` scenario ported from smart-data-science's scenario_supermarket_sales.py.

slug: supermarket_sales
kind: tabular_ml
title: "Supermarket Weekly Sales"
description: >
  Predicts a department's weekly sales from store size, local economic indicators
  (CPI, unemployment, fuel price), weather, and time of year — retail demand forecasting.
role_required: "scenario:supermarket_sales"
icon: "🛒"

credits:
  source: "Kaggle — Yasser H., Walmart Dataset"
  url: "https://www.kaggle.com/datasets/yasserh/walmart-dataset"
  note: "ported via smart-data-science's scenario_supermarket_sales.py; 10,000-row random sample of the original ~420,000-row dataset"

chat:
  context: >
    A retail demand-forecasting model for a Walmart-style supermarket chain — predicts a
    store/department's weekly sales from the store's size and type, the department number,
    and macro/weather conditions (CPI, unemployment rate, fuel price, temperature) for that week.
  sample_questions:
    - "Which features matter most for predicting weekly sales?"
    - "How accurate is the trained model?"
    - "Do bigger stores always sell more, or does store type matter more?"

dataset:
  bucket: "scenario-supermarket-sales"
  # SeaweedFS key once uploaded; etl-tabular reads it from there.
  raw_object: "raw/supermarket_sales.csv"
  # Tracked local file (relative to this scenario's directory) etl-tabular uploads to
  # SeaweedFS on first run if raw_object doesn't exist yet for the tenant — demo bootstrap only.
  seed_file: "sample_data/supermarket_sales.csv"
  index_col: "RecordID"
  target: "weekly_sales"
  feature_columns:
    - size
    - cpi
    - unemployment
    - temperature
    - fuel_price
    - dept
    - store
    - type
    - month

  # Drives both UIs' generic form renderer (see libs/shared/scenario_schema.py) —
  # ranges taken from the real dataset's min/max (10,000-row sample).
  feature_schema:
    size: {type: numeric, min: 34000, max: 220000, default: 140000, step: 1000}
    cpi: {type: numeric, min: 126.0, max: 227.5, default: 180.0, step: 0.5}
    unemployment: {type: numeric, min: 3.8, max: 14.5, default: 8.0, step: 0.1}
    temperature: {type: numeric, min: -3.0, max: 101.0, default: 60.0, step: 1.0}
    fuel_price: {type: numeric, min: 2.5, max: 4.5, default: 3.5, step: 0.05}
    dept: {type: numeric, min: 1, max: 99, default: 40, step: 1}
    store: {type: numeric, min: 1, max: 45, default: 20, step: 1}
    type: {type: categorical, options: ["A", "B", "C"], default: "A"}
    month: {type: numeric, min: 1, max: 12, default: 6, step: 1}

  # Seeds ui-react's Data tab dashboard (see libs/shared/scenario_schema.py's
  # ChartSpec) — still user-editable/addable there, just a sensible starting point.
  default_charts:
    - {type: histogram, x: weekly_sales}
    - {type: bar, x: type, y: weekly_sales, agg: mean, color_by: type}
    - {type: scatter, x: size, y: weekly_sales, color_by: type}

model:
  task_type: regression
  # Green Code: LightGBM alone — more accurate and efficient than a classic
  # random forest, so no simpler baseline candidate is evaluated against it.
  candidates: ["lightgbm"]
  accuracy_gain_threshold_for_complexity: 0.02
  explainability: shap
  target_units: "$"

services:
  etl: etl-tabular
  training: training
  prediction: prediction
  assistant: assistant
