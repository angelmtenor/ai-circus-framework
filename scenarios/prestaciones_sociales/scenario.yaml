# Seed definition for the "prestaciones_sociales" scenario — a tabular_ml scenario
# with free text, deterministic business rules before the model, and a decision
# policy that turns one probability into three proposals (grant / manual review /
# deny). Loaded by platform-registry at bootstrap; etl-tabular, training and
# prediction also read `dataset`/`model` as build-time config.
#
# Everything is FICTIONAL: the Ayuntamiento de Villaclara (the same invented town as
# `sede_electronica`), its *Ayuda Económica de Emergencia Social* (AES), its rules
# ("bases reguladoras") and every application. `sample_data/prestaciones_sociales.csv`
# is generated by `scripts/generate_prestaciones_sociales_dataset.py` (seeded facts and
# resolutions; the three free-text boxes written once by an LLM from those facts) and
# the scanned sample applications in `sample_uploads/` by
# `scripts/generate_prestaciones_sample_documents.py`. The challenger needs the
# host-GPU embedding step: `make k3s-text-embeddings` (then re-run training).

slug: prestaciones_sociales
kind: tabular_ml
title: "Ayudas de Emergencia Social — Valoración inteligente"
description: >
  Que el dinero público llegue a quien de verdad lo necesita: ni fraude, ni ayudas
  concedidas a mano a personas conocidas, ni ayudas para lo que el solicitante puede
  pagarse. Las mismas reglas de negocio para todas las solicitudes, un modelo que lee
  a la vez las casillas y el texto libre, y una propuesta explicada casilla a casilla
  — conceder, denegar o revisión manual. Siempre decide una persona.
role_required: "scenario:prestaciones_sociales"
industry: public_sector
icon: "🤝"

chat:
  context: >
    Responde siempre en español. Eres el asistente del Área de Bienestar Social del
    Ayuntamiento de Villaclara, una entidad FICTICIA, en un escenario de demostración con
    600 solicitudes SINTÉTICAS de Ayuda Económica de Emergencia Social (AES): alquiler o
    hipoteca, suministros básicos, alimentación e higiene, material escolar, gastos
    sanitarios y otros gastos, hasta 1.500 € por solicitud. El propósito es que el dinero
    público llegue a quien de verdad lo necesita. La valoración manual de estas ayudas
    sufre dos problemas conocidos en España: el fraude (ingresos sin declarar, ayudas
    repetidas por el mismo concepto, gastos que no son básicos o que la unidad de
    convivencia puede pagarse) y el favoritismo (conceder a mano a personas conocidas).
    Aquí todas las solicitudes pasan por las mismas reglas y el mismo modelo, y cada
    propuesta muestra sus razones, de modo que apartarse de ella exige motivarlo por
    escrito. Ni el modelo ni las reglas acusan a nadie de fraude: señalan qué hay que
    comprobar, y lo comprueba una persona. Cada solicitud pasa primero
    por reglas de negocio deterministas, en cuatro familias: completitud (falta un
    documento o una casilla → requerimiento de subsanación, art. 68 de la Ley 39/2015, 10
    días), validez y coherencia (un dato fuera de rango o contradictorio → subsanación),
    requisitos de las bases (menos de 6 meses de empadronamiento, renta per cápita por
    encima de 1,5 veces el IPREM de 600 €/mes, más de dos ayudas en 12 meses →
    inadmisión) y protección (violencia de género o fecha de lanzamiento → revisión
    manual prioritaria, sea cual sea la puntuación). Solo las solicitudes que superan las
    reglas llegan al modelo: un LightGBM que lee a la vez las casillas numéricas, las
    categóricas y tres casillas de texto libre (exposición de motivos, destino de la
    ayuda e informe social) convertidas con TF-IDF en castellano, conservando las
    negaciones ("no tenemos", "sin ingresos"). Da la probabilidad de concesión; con 0,70
    o más se propone conceder, con 0,30 o menos se propone denegar, y entre medias va a
    revisión manual. Un challenger con embeddings de frases (voyage-4-nano, multilingüe)
    se entrena al lado para comparar: entiende mejor las paráfrasis pero confunde las
    negaciones, y no explica palabra a palabra, por eso no es el modelo desplegado. Todo
    son PROPUESTAS: resuelve siempre una trabajadora o un trabajador social, porque el
    acceso a prestaciones públicas esenciales es un uso de alto riesgo según el
    Reglamento Europeo de IA (anexo III) y todo acto administrativo debe motivarse (art.
    35 de la Ley 39/2015). Sexo y nacionalidad nunca son entradas del modelo; solo se
    guardan para auditar la equidad. Cuando expliques una propuesta, di qué casillas
    pesan más y en qué sentido, cita las palabras del texto que más influyen, y separa
    con claridad lo que dicen las reglas de lo que estima el modelo. Nunca prometas ni
    deniegues una ayuda real.
  sample_questions:
    - "¿Cómo ayuda esto a evitar el fraude y el favoritismo?"
    - "¿Por qué este expediente va a revisión manual?"
    - "¿Qué casillas pesan más en las concesiones?"
    - "¿Qué reglas paran más solicitudes antes del modelo?"
    - "¿Qué palabras del informe social empujan hacia la denegación?"
    - "Si subo el umbral de concesión a 0,8, ¿qué pasa con la carga de revisión?"
    - "¿El modelo trata igual a hombres y mujeres, y a españoles y extranjeros?"
    - "¿Por qué no se despliega el modelo con transformer?"
    - "¿Qué falta en esta solicitud para poder valorarla?"

dataset:
  bucket: "scenario-prestaciones-sociales"
  raw_object: "raw/prestaciones_sociales.csv"
  seed_file: "sample_data/prestaciones_sociales.csv"
  index_col: "Expediente"
  target: "Concedida"
  text_language: es
  protected_features_excluded: ["Sexo", "Nacionalidad"]
  # Kept only to audit outcome rates per group — never a model input.
  audit_columns: ["Sexo", "Nacionalidad"]
  display_columns: ["Solicitante"]
  feature_columns:
    - EdadSolicitante
    - Distrito
    - Canal
    - MesesEmpadronamiento
    - MiembrosUnidad
    - MenoresACargo
    - Discapacidad
    - SituacionLaboral
    - IngresosMensualesUnidad
    - RentaPerCapitaIPREM
    - RegimenVivienda
    - GastoViviendaMensual
    - DeudaSuministros
    - ConceptoAyuda
    - ImporteSolicitado
    - AyudasPrevias12m
    - DestinoAyuda
    - ExposicionMotivos
    - InformeSocial

  feature_schema:
    EdadSolicitante:
      {type: numeric, label: "Edad de la persona solicitante", min: 16, max: 100, default: 42, step: 1,
       info: "Años cumplidos. Hay que ser mayor de edad (regla de validez)."}
    Distrito:
      {type: categorical, label: "Distrito", options: ["Centro", "Ensanche", "Ribera", "San Antón", "La Vega", "Las Eras"],
       default: "Centro", info: "Distrito municipal de residencia (Villaclara es un municipio ficticio)."}
    Canal:
      {type: categorical, label: "Canal de presentación", options: ["Presencial", "Sede electrónica"], default: "Presencial",
       info: "Registro presencial en el centro de servicios sociales o sede electrónica."}
    MesesEmpadronamiento:
      {type: numeric, label: "Meses de empadronamiento", min: 0, max: 600, default: 48, step: 1,
       info: "Antigüedad en el padrón de Villaclara. Las bases exigen al menos 6 meses."}
    MiembrosUnidad:
      {type: numeric, label: "Miembros de la unidad de convivencia", min: 1, max: 10, default: 3, step: 1,
       info: "Personas que conviven en el domicilio, incluida la solicitante."}
    MenoresACargo:
      {type: numeric, label: "Menores a cargo", min: 0, max: 8, default: 1, step: 1,
       info: "Menores de 18 años de la unidad de convivencia."}
    Discapacidad:
      {type: categorical, label: "Discapacidad reconocida en la unidad", options: ["No", "Sí", "En trámite"], default: "No",
       info: "Algún miembro con grado de discapacidad igual o superior al 33%, o en trámite de reconocimiento."}
    SituacionLaboral:
      {type: categorical, label: "Situación laboral de la persona solicitante",
       options: ["Desempleo sin prestación", "Desempleo con prestación", "Empleo precario o parcial", "Empleo estable", "Pensionista", "Incapacidad o dependencia"],
       default: "Empleo precario o parcial", info: "Situación declarada en la solicitud y acreditada con la vida laboral."}
    IngresosMensualesUnidad:
      {type: numeric, label: "Ingresos mensuales de la unidad (€)", min: 0, max: 5000, default: 650, step: 10,
       info: "Suma de ingresos netos mensuales de todos los miembros: nóminas, prestaciones y pensiones."}
    RentaPerCapitaIPREM:
      {type: numeric, label: "Renta per cápita (× IPREM)", min: 0, max: 5, default: 0.36, step: 0.01,
       info: "Casilla calculada: ingresos mensuales ÷ miembros ÷ 600 € (IPREM mensual 2026). Por encima de 1,5 no se cumple el requisito económico."}
    RegimenVivienda:
      {type: categorical, label: "Régimen de la vivienda",
       options: ["Alquiler", "Hipoteca", "Habitación realquilada", "Cedida o familiar", "Sin hogar"],
       default: "Alquiler", info: "Cómo se ocupa la vivienda habitual."}
    GastoViviendaMensual:
      {type: numeric, label: "Gasto mensual de vivienda (€)", min: 0, max: 2000, default: 550, step: 10,
       info: "Alquiler o cuota hipotecaria mensual. Cero si la vivienda es cedida o no hay vivienda."}
    DeudaSuministros:
      {type: numeric, label: "Deuda de suministros (€)", min: 0, max: 5000, default: 0, step: 10,
       info: "Facturas de luz, agua o gas pendientes de pago."}
    ConceptoAyuda:
      {type: categorical, label: "Concepto de la ayuda",
       options: ["Alquiler o hipoteca", "Suministros básicos", "Alimentación e higiene", "Material escolar", "Gastos sanitarios", "Otros gastos"],
       default: "Suministros básicos", info: "Para qué gasto se pide la ayuda (bases reguladoras, art. 3)."}
    ImporteSolicitado:
      {type: numeric, label: "Importe solicitado (€)", min: 0, max: 5000, default: 450, step: 10,
       info: "Máximo de 1.500 € por solicitud (regla de validez)."}
    AyudasPrevias12m:
      {type: numeric, label: "Ayudas municipales en los últimos 12 meses", min: 0, max: 10, default: 0, step: 1,
       info: "Ayudas de emergencia social recibidas el último año. Más de dos: no se cumple el requisito."}
    DestinoAyuda:
      {type: text, label: "Destino de la ayuda", max_length: 300,
       placeholder: "¿En qué se va a gastar el dinero?",
       info: "La persona solicitante explica, en una frase, en qué gastará la ayuda. Se lee con TF-IDF."}
    ExposicionMotivos:
      {type: text, label: "Exposición de motivos", max_length: 1000,
       placeholder: "Explique su situación con sus propias palabras.",
       info: "La persona solicitante cuenta su situación. Se lee con TF-IDF (palabras y parejas de palabras, conservando 'no', 'sin', 'ni')."}
    InformeSocial:
      {type: text, label: "Informe social", max_length: 1000,
       placeholder: "Observaciones de la trabajadora o trabajador social tras la entrevista.",
       info: "Lo escriben los servicios sociales tras la entrevista o la visita: describe hechos, no propone la resolución."}

  rule_columns:
    AportaDNI: {type: categorical, label: "Aporta DNI/NIE", options: ["Sí", "No"], default: "Sí"}
    AportaPadron: {type: categorical, label: "Aporta certificado de empadronamiento", options: ["Sí", "No"], default: "Sí"}
    AportaJustificanteIngresos: {type: categorical, label: "Aporta justificante de ingresos", options: ["Sí", "No"], default: "Sí"}
    AportaJustificanteGasto: {type: categorical, label: "Aporta contrato, factura o presupuesto del gasto", options: ["Sí", "No"], default: "Sí"}
    DeclaracionResponsable: {type: categorical, label: "Firma la declaración responsable", options: ["Sí", "No"], default: "Sí"}

  business_rules:
    outcome_labels:
      reject: "Inadmisión"
      request_info: "Requerimiento de subsanación"
      review: "Revisión manual prioritaria"
    families:
      - {key: completitud, label: "Completitud", description: "Falta un documento o una casilla obligatoria."}
      - {key: validez, label: "Validez y coherencia", description: "Un dato está fuera de rango o contradice a otro."}
      - {key: requisitos, label: "Requisitos de las bases", description: "No se cumple un requisito de la convocatoria."}
      - {key: proteccion, label: "Protección", description: "Una señal de especial protección: siempre la valora una persona."}
    rules:
      - {key: C1, family: completitud, label: "Documento de identidad", field: AportaDNI, op: equals, value: "No", outcome: request_info,
         message: "Falta el DNI/NIE de la persona solicitante.", legal_basis: "Art. 68.1 Ley 39/2015"}
      - {key: C2, family: completitud, label: "Certificado de empadronamiento", field: AportaPadron, op: equals, value: "No", outcome: request_info,
         message: "Falta el certificado de empadronamiento.", legal_basis: "Art. 68.1 Ley 39/2015"}
      - {key: C3, family: completitud, label: "Justificante de ingresos", field: AportaJustificanteIngresos, op: equals, value: "No", outcome: request_info,
         message: "Falta el justificante de ingresos de la unidad de convivencia.", legal_basis: "Art. 68.1 Ley 39/2015"}
      - {key: C4, family: completitud, label: "Justificante del gasto", field: AportaJustificanteGasto, op: equals, value: "No", outcome: request_info,
         message: "Falta el contrato, la factura o el presupuesto del gasto.", legal_basis: "Art. 68.1 Ley 39/2015"}
      - {key: C5, family: completitud, label: "Declaración responsable", field: DeclaracionResponsable, op: equals, value: "No", outcome: request_info,
         message: "La declaración responsable no está firmada.", legal_basis: "Art. 69 Ley 39/2015"}
      - {key: C6, family: completitud, label: "Exposición de motivos", field: ExposicionMotivos, op: missing, outcome: request_info,
         message: "La casilla de exposición de motivos está vacía.", legal_basis: "Art. 66.1.c Ley 39/2015"}
      - {key: V1, family: validez, label: "Importe máximo", field: ImporteSolicitado, op: gt, value: 1500, outcome: request_info,
         message: "El importe supera el máximo de 1.500 € por solicitud.", legal_basis: "Bases AES, art. 5"}
      - {key: V2, family: validez, label: "Importe positivo", field: ImporteSolicitado, op: lte, value: 0, outcome: request_info,
         message: "El importe solicitado debe ser mayor que cero.", legal_basis: "Bases AES, art. 5"}
      - {key: V3, family: validez, label: "Mayoría de edad", field: EdadSolicitante, op: lt, value: 18, outcome: request_info,
         message: "La persona solicitante debe ser mayor de edad o estar emancipada.", legal_basis: "Bases AES, art. 4.1"}
      - {key: V4, family: validez, label: "Coherencia de la unidad", field: MenoresACargo, op: gte, value_field: MiembrosUnidad, outcome: request_info,
         message: "Hay tantos menores como miembros: falta al menos una persona adulta en la unidad."}
      - {key: V5, family: validez, label: "Coherencia de la vivienda", field: GastoViviendaMensual, op: gt, value: 0,
         when: {field: RegimenVivienda, op: in, value: ["Cedida o familiar", "Sin hogar"]}, outcome: request_info,
         message: "Se declara gasto de vivienda en una vivienda cedida o sin hogar."}
      - {key: R1, family: requisitos, label: "Empadronamiento", field: MesesEmpadronamiento, op: lt, value: 6, outcome: reject,
         message: "No se acreditan 6 meses de empadronamiento en Villaclara.", legal_basis: "Bases AES, art. 4.2.a"}
      - {key: R2, family: requisitos, label: "Requisito económico", field: RentaPerCapitaIPREM, op: gt, value: 1.5, outcome: reject,
         message: "La renta per cápita supera 1,5 veces el IPREM.", legal_basis: "Bases AES, art. 4.2.b"}
      - {key: R3, family: requisitos, label: "Límite de ayudas", field: AyudasPrevias12m, op: gt, value: 2, outcome: reject,
         message: "Ya se han recibido más de dos ayudas en los últimos 12 meses.", legal_basis: "Bases AES, art. 6"}
      - {key: P1, family: proteccion, label: "Especial protección (informe)", field: InformeSocial, op: contains_any,
         value: ["violencia de género", "orden de protección", "lanzamiento"], outcome: review,
         message: "El informe social recoge una situación de especial protección: valoración prioritaria por una persona."}
      - {key: P2, family: proteccion, label: "Especial protección (solicitante)", field: ExposicionMotivos, op: contains_any,
         value: ["violencia de género", "maltrato", "orden de alejamiento", "lanzamiento"], outcome: review,
         message: "La persona solicitante describe una situación de especial protección: valoración prioritaria."}

  default_charts:
    - {type: bar, x: ConceptoAyuda, y: Concedida, agg: mean, color_by: ConceptoAyuda}
    - {type: bar, x: SituacionLaboral, y: Concedida, agg: mean, color_by: SituacionLaboral}
    - {type: histogram, x: RentaPerCapitaIPREM, color_by: Concedida}
    - {type: bar, x: MenoresACargo, y: Concedida, agg: mean}
    - {type: bar, x: RegimenVivienda, y: Concedida, agg: mean, color_by: RegimenVivienda}
    - {type: bar, x: Distrito, y: Concedida, agg: mean, color_by: Distrito}
    - {type: heatmap}

model:
  task_type: classification
  # Gradient boosting only (Green Code: the default LightGBM must beat the small-data
  # settings by > 0.01 ROC AUC to be adopted).
  candidates: ["lightgbm_small_data", "lightgbm"]
  accuracy_gain_threshold_for_complexity: 0.01
  selection_metric: roc_auc
  cv_folds: 5
  explainability: shap
  out_of_fold_scores: true
  target_label: "Ayuda concedida"
  target_description: "Si la solicitud se resolvió concediendo la ayuda (1) o denegándola (0), entre las que superaron las reglas de negocio."
  target_value_labels: {"0": "Denegada", "1": "Concedida"}
  decision_policy:
    approve_at: 0.70
    deny_at: 0.30
    labels:
      approve: "Propuesta de concesión"
      deny: "Propuesta de denegación"
      review: "Revisión manual"
      request_info: "Requerimiento de subsanación"
      reject: "Inadmisión"
  text_challenger:
    embedding_model: local-embed
    hf_model_id: "voyageai/voyage-4-nano"
    label: "voyage-4-nano (embeddings multilingües)"
    estimator: lightgbm_small_data

ui_extras:
  kind: case_desk
  tab_label: "Mesa de valoración"
  title: "Mesa de valoración · 600 solicitudes de emergencia social"
  subtitle: >
    Cada punto es una solicitud. Primero pasan las reglas de negocio, que paran lo
    incompleto o lo que no cumple los requisitos; después el modelo lee las casillas y el
    texto y las reparte en tres bandejas. Mueve los umbrales y verás cuánto trabajo
    automatizas y cuánto te equivocas. Abre cualquier expediente para ver qué casillas
    pesan, o registra una solicitud escaneada y mira cómo se lee casilla a casilla.
  locale: es
  case_noun: "solicitud"
  case_noun_plural: "solicitudes"
  reviewer_noun: "trabajadora o trabajador social"
  authority: "Ayuntamiento de Villaclara"
  authority_unit: "Área de Bienestar Social · Entidad ficticia, sin validez oficial"
  form_title: "Solicitud de Ayuda Económica de Emergencia Social"
  form_code: "Modelo AES-01"
  name_column: Solicitante
  equity_columns: ["Sexo", "Nacionalidad"]
  computed_fields:
    - {field: RentaPerCapitaIPREM, numerator: IngresosMensualesUnidad, denominator: MiembrosUnidad, divisor: 600, decimals: 2}
  note: "Datos sintéticos de una entidad ficticia. El modelo solo propone: resuelve siempre una persona."
  sections:
    - {title: "1 · Persona solicitante", fields: [EdadSolicitante, Distrito, Canal, MesesEmpadronamiento]}
    - {title: "2 · Unidad de convivencia e ingresos", fields: [MiembrosUnidad, MenoresACargo, Discapacidad, SituacionLaboral, IngresosMensualesUnidad, RentaPerCapitaIPREM]}
    - {title: "3 · Vivienda y deudas", fields: [RegimenVivienda, GastoViviendaMensual, DeudaSuministros]}
    - {title: "4 · Ayuda solicitada", fields: [ConceptoAyuda, ImporteSolicitado, AyudasPrevias12m, DestinoAyuda]}
    - {title: "5 · Exposición de motivos", fields: [ExposicionMotivos]}
    - {title: "6 · Documentación aportada", fields: [AportaDNI, AportaPadron, AportaJustificanteIngresos, AportaJustificanteGasto, DeclaracionResponsable]}
    - {title: "7 · Informe social (a cumplimentar por los servicios sociales)", fields: [InformeSocial]}
  sample_uploads:
    - {file: "solicitud_suministros_monoparental.pdf", label: "Madre sola, aviso de corte", description: "Escaneo de una solicitud completa por suministros."}
    - {file: "solicitud_alquiler_lanzamiento.pdf", label: "Desahucio con lanzamiento", description: "Escaneo con fecha de lanzamiento en el informe."}
    - {file: "solicitud_otros_gastos_coche.pdf", label: "Entrada de un coche", description: "Escaneo de una solicitud para un gasto no básico."}
    - {file: "solicitud_sin_dni.pdf", label: "Sin DNI aportado", description: "Escaneo de una solicitud a la que le falta el DNI."}
  personas:
    - label: "Madre sola, aviso de corte"
      description: "Empleo por horas, dos hijos y la luz a punto de cortarse."
      record: {EdadSolicitante: 34, Distrito: "Ribera", Canal: "Presencial", MesesEmpadronamiento: 60, MiembrosUnidad: 3, MenoresACargo: 2,
               Discapacidad: "No", SituacionLaboral: "Empleo precario o parcial", IngresosMensualesUnidad: 620, RentaPerCapitaIPREM: 0.34,
               RegimenVivienda: "Alquiler", GastoViviendaMensual: 520, DeudaSuministros: 410, ConceptoAyuda: "Suministros básicos",
               ImporteSolicitado: 380, AyudasPrevias12m: 0,
               DestinoAyuda: "Pagar las facturas de luz y gas atrasadas para que no nos corten.",
               ExposicionMotivos: "Estoy sola con mis dos hijos desde hace un año y su padre no pasa la pensión. Trabajo por horas limpiando casas y entre el alquiler y la comida no llego. Me ha llegado el aviso de que nos cortan la luz si no pago lo atrasado.",
               InformeSocial: "Familia monoparental con dos menores a cargo. Empleo parcial sin estabilidad. Acude a todas las citas y cumple el plan de intervención. Aporta los avisos de suspensión del suministro eléctrico.",
               AportaDNI: "Sí", AportaPadron: "Sí", AportaJustificanteIngresos: "Sí", AportaJustificanteGasto: "Sí", DeclaracionResponsable: "Sí"}
    - label: "Desahucio con lanzamiento"
      description: "Paro sin prestación, cinco meses de alquiler debidos y fecha de lanzamiento."
      record: {EdadSolicitante: 47, Distrito: "San Antón", Canal: "Sede electrónica", MesesEmpadronamiento: 120, MiembrosUnidad: 4, MenoresACargo: 2,
               Discapacidad: "No", SituacionLaboral: "Desempleo sin prestación", IngresosMensualesUnidad: 0, RentaPerCapitaIPREM: 0.0,
               RegimenVivienda: "Alquiler", GastoViviendaMensual: 690, DeudaSuministros: 0, ConceptoAyuda: "Alquiler o hipoteca",
               ImporteSolicitado: 1380, AyudasPrevias12m: 1,
               DestinoAyuda: "Pagar parte de la deuda del alquiler para parar el desahucio.",
               ExposicionMotivos: "Me quedé en paro hace ocho meses y ya se me acabó la prestación. Debemos cinco meses de alquiler y el casero ha ido al juzgado. No tenemos a dónde ir con los niños.",
               InformeSocial: "Procedimiento de desahucio por impago con fecha de lanzamiento fijada para el mes próximo. Dos menores escolarizados. Sin ingresos en la unidad familiar y sin red de apoyo.",
               AportaDNI: "Sí", AportaPadron: "Sí", AportaJustificanteIngresos: "Sí", AportaJustificanteGasto: "Sí", DeclaracionResponsable: "Sí"}
