# Seed definition for the "supply_chain" scenario — loaded into the `platform`
# Postgres schema by services/platform-registry at bootstrap. Editing this file and
# re-seeding is how a developer adds/changes a scenario; it is never read directly by
# any other service (see AGENTS.md / plan: "Scenario registry").
#
# The scenario-specific services (etl-tabular, training, prediction) also read this
# file directly for their own operational config (dataset schema, model candidates) —
# that's build-time parameterization analogous to each service's own settings.yaml,
# not tenant/entitlement data, so it doesn't need to go through platform-registry's API.
#
# The framework's first `regression` scenario — ported from smart-data-science's
# scenario_supply_chain.py.

slug: supply_chain
kind: tabular_ml
title: "Supply Chain Shipping ETA"
description: >
  Predicts a shipment's actual delivery time (in days) from carrier, distance,
  order type, origin, and priority — logistics ETA estimation.
role_required: "scenario:supply_chain"
icon: "🚚"

credits:
  source: "Amazon SageMaker Supply Chain workshop (synthetic dataset)"
  url: "https://catalog.us-east-1.prod.workshops.aws/workshops/80ba0ea5-7cf9-4b8c-9d3f-1cd988b6c071/en-US/1-use-cases/7-supply-chain"
  note: "ported via smart-data-science's scenario_supply_chain.py"

chat:
  context: >
    A logistics ETA model — predicts how many days a shipment will actually take to
    arrive, from the carrier, shipping distance, order type, origin city, and
    shipping priority.
  sample_questions:
    - "Which factors matter most for predicting shipping time?"
    - "How accurate is the trained model?"
    - "Does shipping priority actually reduce delivery time?"
    - "Which carrier tends to deliver fastest?"
    - "Does a bulk order take longer to ship than a single-item order?"

dataset:
  bucket: "scenario-supply-chain"
  # SeaweedFS key once uploaded; etl-tabular reads it from there.
  raw_object: "raw/supply_chain.csv"
  # Tracked local file (relative to this scenario's directory) etl-tabular uploads to
  # SeaweedFS on first run if raw_object doesn't exist yet for the tenant — demo bootstrap only.
  seed_file: "sample_data/supply_chain.csv"
  index_col: "OrderID"
  target: "ActualShippingDays"
  # Not used as features: ExpectedShippingDays/OnTimeDelivery would leak the target
  # (OnTimeDelivery is derived directly from Actual vs. Expected shipping days),
  # OrderDate isn't used chronologically here, ProductId is a non-predictive identifier.
  protected_features_excluded: ["ExpectedShippingDays", "OnTimeDelivery", "OrderDate", "ProductId"]
  feature_columns:
    - Carrier
    - YShippingDistance
    - XShippingDistance
    - InBulkOrder
    - ShippingOrigin
    - ShippingPriority

  # Drives both UIs' generic form renderer (see libs/shared/scenario_schema.py) —
  # ranges/options taken from the real dataset's min/max/value set (10000 rows).
  feature_schema:
    Carrier:
      {type: categorical, label: "Carrier", options: ["GlobalFreight", "MicroCarrier", "Shipper", "BigBird"], default: "GlobalFreight",
       info: "The shipping company handling this order."}
    YShippingDistance:
      {type: numeric, label: "North-south distance", min: -476, max: 537, default: 0, step: 1,
       info: "North-south component of the distance between origin and destination (synthetic grid units; sign indicates direction)."}
    XShippingDistance:
      {type: numeric, label: "East-west distance", min: -436, max: 458, default: 0, step: 1,
       info: "East-west component of the distance between origin and destination (synthetic grid units; sign indicates direction)."}
    InBulkOrder:
      {type: categorical, label: "Order size", options: ["Bulk Order", "Single Order"], default: "Single Order",
       info: "Whether this was a large bulk order or a single-item order."}
    ShippingOrigin:
      {type: categorical, label: "Origin city", options: ["Atlanta", "Chicago", "Houston", "Las Vegas", "New York City", "Salt Lake City", "San Francisco", "Seattle"], default: "Atlanta",
       info: "The city the shipment departed from."}
    ShippingPriority:
      {type: categorical, label: "Shipping priority", options: ["Express", "Standard", "Ground", "Air"], default: "Standard",
       info: "The shipping speed/service level the customer paid for."}

  # Seeds ui-react's Data tab dashboard (see libs/shared/scenario_schema.py's
  # ChartSpec) — still user-editable/addable there, just a sensible starting point.
  default_charts:
    - {type: histogram, x: ActualShippingDays}
    - {type: bar, x: Carrier, y: ActualShippingDays, agg: mean, color_by: Carrier}
    - {type: scatter, x: YShippingDistance, y: XShippingDistance, color_by: ShippingPriority}

model:
  task_type: regression
  # Green Code: LightGBM alone — more accurate and efficient than a classic
  # random forest, so no simpler baseline candidate is evaluated against it.
  candidates: ["lightgbm"]
  accuracy_gain_threshold_for_complexity: 0.02
  explainability: shap
  target_units: "days"
  target_label: "Actual shipping time"
  target_description: "How many days the shipment actually took to arrive."

services:
  etl: etl-tabular
  training: training
  prediction: prediction
  assistant: assistant
