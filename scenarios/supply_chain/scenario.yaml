# Seed definition for the "supply_chain" scenario — loaded into the `platform`
# Postgres schema by services/platform-registry at bootstrap. Editing this file and
# re-seeding is how a developer adds/changes a scenario; it is never read directly by
# any other service (see AGENTS.md / plan: "Scenario registry").
#
# The scenario-specific services (etl-tabular, training, prediction) also read this
# file directly for their own operational config (dataset schema, model candidates) —
# that's build-time parameterization analogous to each service's own settings.yaml,
# not tenant/entitlement data, so it doesn't need to go through platform-registry's API.
#
# The framework's first `regression` scenario — ported from smart-data-science's
# scenario_supply_chain.py.

slug: supply_chain
kind: tabular_ml
title: "Supply Chain Shipping ETA"
description: >
  Predicts a shipment's actual delivery time (in days) from carrier, distance,
  order type, origin, and priority — logistics ETA estimation. The Dispatch Tower
  maps the eight hubs, draws each hub's ETA landscape and races every carrier and
  service level to a destination you pin.
role_required: "scenario:supply_chain"
industry: logistics
icon: "🚚"

credits:
  source: "Amazon SageMaker Supply Chain workshop (synthetic dataset)"
  url: "https://catalog.us-east-1.prod.workshops.aws/workshops/80ba0ea5-7cf9-4b8c-9d3f-1cd988b6c071/en-US/1-use-cases/7-supply-chain"
  note: "ported via smart-data-science's scenario_supply_chain.py"

# The scenario told for someone with no context: the Overview tab and its guided demo (scenario_schema.StoryConfig).
# Figures come from docs/scenarios/logistics.md.
story:
  headline: "How long will this shipment take, and which carrier should we book?"
  problem: >
    A logistics desk promises delivery dates every day. Promise too early and the customer is let down; too late and
    the sale is lost. The choice of carrier and service level changes the answer, and nobody can compare sixteen
    options by hand for every order.
  audience: ["Logistics planners", "Customer service", "Operations"]
  today: >
    A standard transit time per carrier from a table, and a safety margin added by experience.
  with_ai: >
    A predicted duration with a 90 % interval for any origin, destination, carrier and priority, every option raced
    side by side, and the safest date to promise.
  value:
    - {value: "16", label: "Options compared at once", note: "Every carrier and priority to the chosen destination."}
    - {value: "90 %", label: "Prediction interval", note: "Two quantile models give the range about 9 in 10 shipments fall in."}
    - {value: "0.66", label: "R², hold-out", note: "On 10,000 synthetic shipments from eight hubs."}
  flow:
    - {title: "Past shipments", kind: source, tab: data, text: "Origin hub, distance to the destination, carrier, priority, order size and how many days each took."}
    - {title: "Duration model", kind: model, tab: model, text: "A LightGBM regressor for the expected days, and two quantile models for the 90 % interval."}
    - {title: "Dispatch Tower", kind: decision, tab: extra, text: "An ETA landscape around each hub and a race of every carrier and priority to a destination."}
    - {title: "Planner promises", kind: person, text: "The planner books the option and promises the date the customer hears."}
  data_sources:
    - {name: "Supply-chain shipments", kind: table, origin: public, provider: "Amazon SageMaker supply-chain workshop (synthetic)", url: "https://catalog.us-east-1.prod.workshops.aws/workshops/80ba0ea5-7cf9-4b8c-9d3f-1cd988b6c071/en-US/1-use-cases/7-supply-chain", feeds: "Every input and the target: days in transit.", size: "10,000 shipments · 8 hubs"}
  models:
    - {model: main, question: "How many days will this shipment take, and within what range?", used_by: "planners"}
  demo:
    minutes: 6
    steps:
      - {title: "The question", tab: overview, show: "The headline and the flow.", say: "Every order needs a promised date, and the carrier you choose changes it."}
      - {title: "The network", tab: extra, show: "The eight hubs with real shipments streaking out, coloured by how long they took.", say: "This is the history the model learned from."}
      - {title: "The ETA landscape", tab: extra, show: "Focus a hub: isochrones of predicted days around it for the chosen carrier and priority.", say: "Every point on this map is a live prediction."}
      - {title: "The race", tab: extra, show: "Pin a destination: every carrier and priority race to their predicted day, with the interval behind them.", say: "Fastest option, safest promise, and what choosing well is worth in days."}
      - {title: "Ask in plain words", tab: assistant, show: "The answer with a chart.", say: "The assistant answers from the model.", ask: "Does shipping priority actually reduce delivery time?"}

chat:
  context: >
    A logistics ETA model — predicts how many days a shipment will actually take to
    arrive, from the carrier, shipping distance, order type, origin city, and
    shipping priority.
  sample_questions:
    - "Which factors matter most for predicting shipping time?"
    - "How accurate is the trained model?"
    - "Does shipping priority actually reduce delivery time?"
    - "Which carrier tends to deliver fastest?"
    - "Does a bulk order take longer to ship than a single-item order?"
    - "Which origin hub delivers fastest, and why?"
    - "What delivery date should we promise for an Express shipment from Seattle?"

dataset:
  bucket: "scenario-supply-chain"
  # SeaweedFS key once uploaded; etl-tabular reads it from there.
  raw_object: "raw/supply_chain.csv"
  # Tracked local file (relative to this scenario's directory) etl-tabular uploads to
  # SeaweedFS on first run if raw_object doesn't exist yet for the tenant — demo bootstrap only.
  seed_file: "sample_data/supply_chain.csv"
  index_col: "OrderID"
  target: "ActualShippingDays"
  # Not used as features: ExpectedShippingDays/OnTimeDelivery would leak the target
  # (OnTimeDelivery is derived directly from Actual vs. Expected shipping days),
  # OrderDate isn't used chronologically here, ProductId is a non-predictive identifier.
  protected_features_excluded: ["ExpectedShippingDays", "OnTimeDelivery", "OrderDate", "ProductId"]
  feature_columns:
    - Carrier
    - YShippingDistance
    - XShippingDistance
    - InBulkOrder
    - ShippingOrigin
    - ShippingPriority

  # Drives both UIs' generic form renderer (see libs/shared/scenario_schema.py) —
  # ranges/options taken from the real dataset's min/max/value set (10000 rows).
  feature_schema:
    Carrier:
      {type: categorical, label: "Carrier", options: ["GlobalFreight", "MicroCarrier", "Shipper", "BigBird"], default: "GlobalFreight",
       info: "The shipping company handling this order."}
    YShippingDistance:
      {type: numeric, label: "North-south distance", min: -476, max: 537, default: 0, step: 1,
       info: "North-south component of the distance between origin and destination (synthetic grid units; sign indicates direction)."}
    XShippingDistance:
      {type: numeric, label: "East-west distance", min: -436, max: 458, default: 0, step: 1,
       info: "East-west component of the distance between origin and destination (synthetic grid units; sign indicates direction)."}
    InBulkOrder:
      {type: categorical, label: "Order size", options: ["Bulk Order", "Single Order"], default: "Single Order",
       info: "Whether this was a large bulk order or a single-item order."}
    ShippingOrigin:
      {type: categorical, label: "Origin city", options: ["Atlanta", "Chicago", "Houston", "Las Vegas", "New York City", "Salt Lake City", "San Francisco", "Seattle"], default: "Atlanta",
       info: "The city the shipment departed from."}
    ShippingPriority:
      {type: categorical, label: "Shipping priority", options: ["Express", "Standard", "Ground", "Air"], default: "Standard",
       info: "The shipping speed/service level the customer paid for."}

  # Seeds ui-react's Data tab dashboard (see libs/shared/scenario_schema.py's
  # ChartSpec) — still user-editable/addable there, just a sensible starting point.
  default_charts:
    - {type: histogram, x: ActualShippingDays, color_by: Carrier}
    - {type: bar, x: Carrier, y: ActualShippingDays, agg: mean, color_by: Carrier}
    - {type: scatter3d, x: XShippingDistance, y: YShippingDistance, z: ActualShippingDays, color_by: ShippingPriority}

model:
  task_type: regression
  # Green Code: LightGBM alone — more accurate and efficient than a classic
  # random forest, so no simpler baseline candidate is evaluated against it.
  candidates: ["lightgbm"]
  accuracy_gain_threshold_for_complexity: 0.02
  explainability: shap
  target_units: "days"
  target_label: "Actual shipping time"
  target_description: "How many days the shipment actually took to arrive."

# The Dispatch Tower tab (ui-react's DispatchTowerView.tsx): the 8 origin hubs on a
# US map, each hub's "ETA landscape" (a grid of destinations around it scored in one
# /predict call and drawn as isochrones) and a race of every carrier x priority to a
# pinned destination, with its 90% prediction interval. The dataset's distances are
# an east-west / north-south offset from the origin in synthetic grid units — the
# landscape is drawn in those units around the hub, never as real geography.
ui_extras:
  kind: dispatch_tower
  tab_label: "Dispatch Tower"
  title: "Dispatch Tower · every carrier, every hub, one promise date"
  subtitle: >
    Pick a hub to see how long the model expects a shipment to take to any
    destination around it, pin a destination, and race every carrier and service
    level there — the fastest option and the delivery date you can safely promise.
  shipment_noun: shipment
  hub_feature: ShippingOrigin
  map_scope: usa
  hubs:
    - {key: "Seattle", lat: 47.61, lon: -122.33}
    - {key: "San Francisco", lat: 37.77, lon: -122.42}
    - {key: "Las Vegas", lat: 36.17, lon: -115.14}
    - {key: "Salt Lake City", lat: 40.76, lon: -111.89}
    - {key: "Houston", lat: 29.76, lon: -95.37}
    - {key: "Chicago", lat: 41.88, lon: -87.63}
    - {key: "Atlanta", lat: 33.75, lon: -84.39}
    - {key: "New York City", label: "New York", lat: 40.71, lon: -74.01}
  offset_x_feature: XShippingDistance
  offset_y_feature: YShippingDistance
  offset_units: "grid units"
  choice_features: [Carrier, ShippingPriority]
  choice_icons: {Air: plane, Express: bolt, Ground: truck, Standard: van}
  grid_size: 33

services:
  etl: etl-tabular
  training: training
  prediction: prediction
  assistant: assistant
