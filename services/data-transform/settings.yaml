# settings.yaml
# Configuration file for environment variables required by the application
# Author: Angel Martinez-Tenor
# Defines variable names, descriptions, types, constraints, and validation rules.
# Run 'make generate-data-model' after any change to sync data_model.py and .env.example.
#
# data-transform runs every `kind: data_product` scenario's dbt project (docs/adr/0006):
# bronze → silver → gold with tests, records each run (and its bronze watermark) in
# `<slug>.ops_transform_runs`, publishes the dbt artifacts for the catalogue, and tells the
# live view through pipeline events. Core tier: a one-shot `run` (k8s Job/CronJob);
# analytics tier: the same image serves Dagster.

env_variables:
  - name: LOG_LEVEL
    description: "Application log level (TRACE, DEBUG, INFO, WARNING, ERROR, CRITICAL)"
    type: string
    mandatory: true
    secret: false

  - name: SCENARIOS
    description: "Comma-separated data_product slugs to transform (empty = every data_product)"
    type: string
    mandatory: false
    secret: false

  - name: SCENARIOS_DIR
    description: "Path to the scenarios/ directory (one subdirectory per scenario.yaml)"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_HOST
    description: "Postgres hostname (docker service name in-container, localhost for local dev)"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_PORT
    description: "Postgres port"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_DB
    description: "Warehouse database (bronze in, silver/gold out)"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_USER
    description: "Postgres user"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_PASSWORD
    description: "Postgres password"
    type: string
    mandatory: true
    secret: true

  - name: DATA_PSEUDONYM_KEY
    description: "HMAC key pseudonymising personal identifiers in silver (kept in a private table, never in SQL)"
    type: string
    mandatory: true
    secret: true

  - name: KAFKA_BOOTSTRAP_SERVERS
    description: "Kafka bootstrap server(s), host:port (pipeline events for the live view)"
    type: string
    mandatory: true
    secret: false

  - name: TRANSFORM_TARGETS
    description: "dbt targets in order: postgres (core, default when unset), optionally clickhouse (analytics)"
    type: string
    mandatory: false
    secret: false
    validation:
      regex: ^postgres(,clickhouse)?$
      error_message: "TRANSFORM_TARGETS must be postgres or postgres,clickhouse."

  - name: CLICKHOUSE_HOST
    description: "ClickHouse host (analytics tier only)"
    type: string
    mandatory: false
    secret: false

  - name: CLICKHOUSE_USER
    description: "ClickHouse user owning the data products' databases (analytics tier only)"
    type: string
    mandatory: false
    secret: false

  - name: CLICKHOUSE_PASSWORD
    description: "ClickHouse password (analytics tier only)"
    type: string
    mandatory: false
    secret: true

  - name: OBJECT_STORE_ENDPOINT
    description: "SeaweedFS/S3 endpoint URL (dbt manifest/catalog/run results for the catalogue)"
    type: string
    mandatory: true
    secret: false

  - name: OBJECT_STORE_ACCESS_KEY
    description: "SeaweedFS access key (must match OBJECT_STORE_ACCESS_KEY in the repo root .env)"
    type: string
    mandatory: true
    secret: false

  - name: OBJECT_STORE_SECRET_KEY
    description: "SeaweedFS secret key (must match OBJECT_STORE_SECRET_KEY in the repo root .env)"
    type: string
    mandatory: true
    secret: true

  - name: SUPERSET_URL
    description: "Superset base URL (bi tier: the bi-sync Job)"
    type: string
    mandatory: false
    secret: false

  - name: SUPERSET_ADMIN_PASSWORD
    description: "Superset admin password (bi tier: the bi-sync Job)"
    type: string
    mandatory: false
    secret: true

  - name: DATA_FALLBACK_ORG_ID
    description: "The shared demo tenant BI dashboards show (Superset row-level security base filter)"
    type: string
    mandatory: true
    secret: false

  - name: DBT_THREADS
    description: "dbt worker threads"
    type: string
    mandatory: true
    secret: false

  - name: ARTIFACTS_DIR
    description: "Where dbt writes target/ and logs/ per data product (scenarios/ is mounted read-only)"
    type: string
    mandatory: true
    secret: false

# Optional global settings
global_settings:
  env_file: ".env"          # Default location for environment variable file
  fail_on_missing: true     # Stop execution if mandatory variables are missing
  case_sensitive: true      # Enforce case sensitivity for variable names

# Per-environment non-secret overrides.
# Secrets MUST never appear here — use .env (local) or CI/CD secret injection (cloud).
# APP_ENVIRONMENT selects the active profile (default: local).
environments:
  base:
    LOG_LEVEL: "INFO"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "data_platform"
    POSTGRES_USER: "ai_circus"
    SCENARIOS: ""
    # TRANSFORM_TARGETS deliberately has no profile default: a profile value beats the
    # process env (see prediction's settings.yaml), and the analytics tier sets it per pod.
    DBT_THREADS: "2"
    DATA_FALLBACK_ORG_ID: "demo"
    OBJECT_STORE_ACCESS_KEY: "ai_circus"

  # Running with `uv run` on the host, against infra started via `make up-infra`.
  local:
    POSTGRES_HOST: "localhost"
    KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
    SCENARIOS_DIR: "../../scenarios"
    ARTIFACTS_DIR: ".dbt-artifacts"
    OBJECT_STORE_ENDPOINT: "http://objectstore.localhost"

  # Running as a container inside docker-compose's `ai-circus` network.
  docker:
    POSTGRES_HOST: "postgres"
    KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    SCENARIOS_DIR: "/app/scenarios"
    ARTIFACTS_DIR: "/tmp/dbt"
    OBJECT_STORE_ENDPOINT: "http://seaweedfs:8333"

  staging: {}
    # Staging environment profile — overrides go here

  production: {}
    # Production environment profile — overrides go here
