# settings.yaml
# Configuration file for environment variables required by the application
# Author: ai-circus-framework contributors
# Defines variable names, descriptions, types, constraints, and validation rules.
# Run 'make generate-data-model' after any change to sync data_model.py and .env.example.
#
# form-agent is a long-running FastAPI service serving POST /agui/{scenario_slug} and
# POST /submissions/{scenario_slug} for every assisted_form scenario in SCENARIOS
# (empty/unset = all): a LangChain tool-calling agent (see core/agent.py) fills the
# form via a frontend tool and, only for scenarios that configure one, classifies the
# request via RAG over the tenant's vectorized document catalog — same embedder/Qdrant
# pattern as rag-agent. Submissions are validated (ai_circus_shared.form_validation)
# and persisted to SeaweedFS.

env_variables:
  - name: LOG_LEVEL
    description: "Application log level (TRACE, DEBUG, INFO, WARNING, ERROR, CRITICAL)"
    type: string
    mandatory: true
    secret: false

  - name: HTTP_PORT
    description: "Port the FastAPI app listens on"
    type: string
    mandatory: true
    secret: false

  - name: SCENARIOS
    description: "Comma-separated assisted_form scenario slugs this instance serves; empty = every scenario"
    type: string
    mandatory: true
    secret: false

  - name: SCENARIOS_DIR
    description: "Path to the scenarios/ directory (one subdirectory per scenario.yaml)"
    type: string
    mandatory: true
    secret: false

  # Backs this instance's own conversations/messages tables (persisted chat
  # history for the UI's conversation sidebar — see ai_circus_shared.conversations).
  # A dedicated database, not the platform-registry's `platform` schema.
  - name: POSTGRES_HOST
    description: "Postgres hostname (docker service name in-container, localhost for local dev)"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_PORT
    description: "Postgres port"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_DB
    description: "Postgres database name for this service's conversation history"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_USER
    description: "Postgres user"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_PASSWORD
    description: "Postgres password"
    type: string
    mandatory: true
    secret: true

  - name: QDRANT_URL
    description: "Qdrant endpoint URL (docker service name in-container, *.localhost via Traefik for local dev)"
    type: string
    mandatory: true
    secret: false

  - name: OBJECT_STORE_ENDPOINT
    description: "SeaweedFS/S3 endpoint URL (docker service name in-container, *.localhost via Traefik locally)"
    type: string
    mandatory: true
    secret: false

  - name: OBJECT_STORE_ACCESS_KEY
    description: "SeaweedFS access key (must match OBJECT_STORE_ACCESS_KEY in the repo root .env)"
    type: string
    mandatory: true
    secret: false

  - name: OBJECT_STORE_SECRET_KEY
    description: "SeaweedFS secret key (must match OBJECT_STORE_SECRET_KEY in the repo root .env)"
    type: string
    mandatory: true
    secret: true

  - name: LLM_GATEWAY_URL
    description: "Base URL of the llm-gateway service's OpenAI-compatible API"
    type: string
    mandatory: true
    secret: false

  - name: LLM_GATEWAY_API_KEY
    description: "API key presented to llm-gateway (its LITELLM_MASTER_KEY)"
    type: string
    mandatory: true
    secret: true

  - name: LLM_MODEL
    description: "Model name to request from llm-gateway (must be in its litellm_config.yaml model_list)"
    type: string
    mandatory: true
    secret: false

  - name: PLATFORM_REGISTRY_URL
    description: "Base URL of the platform-registry service's entitlement-check API"
    type: string
    mandatory: true
    secret: false

  - name: AUTH_DISABLED
    description: "DEV ONLY: skip token/entitlement checks. Must be false beyond local iteration."
    type: string
    mandatory: true
    secret: false

  - name: CORS_ALLOWED_ORIGINS
    description: "Comma-separated origins ui-react is allowed to call this API from (never '*' beyond local dev)"
    type: string
    mandatory: true
    secret: false

  - name: ADMIN_API_KEY
    description: "Shared admin bearer token — resolves to the 'admin' org, entitled to every scenario"
    type: string
    mandatory: true
    secret: true

  - name: ENGINEERING_DEMO_API_KEY
    description: "Optional demo bearer token for 'engineering-demo' org (mpm/electric_motor/energy_building)"
    type: string
    mandatory: false
    secret: true

  - name: DEV_ORG_ID
    description: "Org id used for every request when AUTH_DISABLED=true"
    type: string
    mandatory: true
    secret: false

  - name: KEYCLOAK_ISSUER
    description: "Keycloak realm issuer (required unless AUTH_DISABLED=true)"
    type: string
    mandatory: false
    secret: false

  - name: KEYCLOAK_JWKS_URL
    description: "Keycloak realm JWKS endpoint (required unless AUTH_DISABLED=true)"
    type: string
    mandatory: false
    secret: false

  - name: KEYCLOAK_AUDIENCE
    description: "Expected token audience, registered via an Audience client-scope mapper in Keycloak"
    type: string
    mandatory: false
    secret: false

  - name: EMBEDDING_PROVIDER
    description: "Embedding backend: 'local', 'gemini', or 'voyage' — MUST match etl-vectorize's setting"
    type: string
    mandatory: false
    default: "local"
    secret: false
    validation:
      regex: "^(local|gemini|voyage)$"
      error_message: "EMBEDDING_PROVIDER must be one of: local, gemini, voyage"

  - name: EMBEDDING_MODEL
    description: "Model override for EMBEDDING_PROVIDER; unset = its default — MUST match etl-vectorize's setting"
    type: string
    mandatory: false
    secret: false

  - name: GOOGLE_API_KEY
    description: "Google API key (only needed if EMBEDDING_PROVIDER=gemini)"
    type: string
    mandatory: false
    secret: true

  - name: VOYAGE_API_KEY
    description: "Voyage AI API key (only needed if EMBEDDING_PROVIDER=voyage)"
    type: string
    mandatory: false
    secret: true

# Optional global settings
global_settings:
  env_file: ".env"          # Default location for environment variable file
  fail_on_missing: true     # Stop execution if mandatory variables are missing
  case_sensitive: true      # Enforce case sensitivity for variable names

# Per-environment non-secret overrides.
# Secrets MUST never appear here — use .env (local) or CI/CD secret injection (cloud).
# APP_ENVIRONMENT selects the active profile (default: local).
environments:
  base:
    LOG_LEVEL: "INFO"
    HTTP_PORT: "8000"
    DEV_ORG_ID: "demo"
    OBJECT_STORE_ACCESS_KEY: "ai_circus"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "form_agent"
    # Must match POSTGRES_USER in the repo root .env; override here (or via env
    # var) if you change it there.
    POSTGRES_USER: "ai_circus"
    # Empty = every assisted_form scenario under SCENARIOS_DIR — see rag-agent/
    # settings.yaml for the same default and its residual-limitation caveat.
    SCENARIOS: ""
    # AUTH_DISABLED/ADMIN_API_KEY/LLM_MODEL/CORS_ALLOWED_ORIGINS deliberately have NO
    # default here — see prediction/settings.yaml for why (a profile default would
    # always beat a real environment variable).

  # Running with `uv run` on the host, against infra started via `make up-infra`.
  local:
    SCENARIOS_DIR: "../../scenarios"
    POSTGRES_HOST: "localhost"
    QDRANT_URL: "http://localhost:6333"
    OBJECT_STORE_ENDPOINT: "http://objectstore.localhost"
    LLM_GATEWAY_URL: "http://localhost:4000"
    PLATFORM_REGISTRY_URL: "http://localhost:8010"

  # Running as a container inside docker-compose's `ai-circus` network.
  docker:
    SCENARIOS_DIR: "/app/scenarios"
    POSTGRES_HOST: "postgres"
    QDRANT_URL: "http://qdrant:6333"
    OBJECT_STORE_ENDPOINT: "http://seaweedfs:8333"
    LLM_GATEWAY_URL: "http://llm-gateway:4000"
    PLATFORM_REGISTRY_URL: "http://platform-registry:8000"

  staging: {}
    # Staging environment profile — overrides go here

  production: {}
    # Production environment profile — overrides go here
