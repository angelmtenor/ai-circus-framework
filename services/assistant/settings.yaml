# settings.yaml
# Configuration file for environment variables required by the application
# Author: ai-circus-framework contributors
# Defines variable names, descriptions, types, constraints, and validation rules.
# Run 'make generate-data-model' after any change to sync data_model.py and .env.example.
#
# assistant is a long-running FastAPI service serving POST /chat/{scenario_slug} for
# every tabular_ml scenario in SCENARIOS (empty/unset = all): chat-over-data grounded
# in the scenario's chat.context and the trained model's metadata (from SeaweedFS),
# answered via llm-gateway — never a raw provider SDK and never exec()'d code (see
# AGENTS.md).

env_variables:
  - name: LOG_LEVEL
    description: "Application log level (TRACE, DEBUG, INFO, WARNING, ERROR, CRITICAL)"
    type: string
    mandatory: true
    secret: false

  - name: HTTP_PORT
    description: "Port the FastAPI app listens on"
    type: string
    mandatory: true
    secret: false

  - name: SCENARIOS
    description: "Comma-separated tabular_ml scenario slugs this instance serves; empty/unset = every scenario"
    type: string
    mandatory: true
    secret: false

  - name: SCENARIOS_DIR
    description: "Path to the scenarios/ directory (one subdirectory per scenario.yaml)"
    type: string
    mandatory: true
    secret: false

  # Backs this instance's own conversations/messages tables (persisted chat
  # history for the UI's conversation sidebar — see ai_circus_shared.conversations).
  # A dedicated database, not the platform-registry's `platform` schema.
  - name: POSTGRES_HOST
    description: "Postgres hostname (docker service name in-container, localhost for local dev)"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_PORT
    description: "Postgres port"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_DB
    description: "Postgres database name for this service's conversation history"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_USER
    description: "Postgres user"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_PASSWORD
    description: "Postgres password"
    type: string
    mandatory: true
    secret: true

  - name: OBJECT_STORE_ENDPOINT
    description: "SeaweedFS/S3 endpoint URL (docker service name in-container, *.localhost via Traefik locally)"
    type: string
    mandatory: true
    secret: false

  - name: OBJECT_STORE_ACCESS_KEY
    description: "SeaweedFS access key (must match OBJECT_STORE_ACCESS_KEY in the repo root .env)"
    type: string
    mandatory: true
    secret: false

  - name: OBJECT_STORE_SECRET_KEY
    description: "SeaweedFS secret key (must match OBJECT_STORE_SECRET_KEY in the repo root .env)"
    type: string
    mandatory: true
    secret: true

  - name: LLM_GATEWAY_URL
    description: "Base URL of the llm-gateway service's OpenAI-compatible API"
    type: string
    mandatory: true
    secret: false

  - name: LLM_GATEWAY_API_KEY
    description: "API key presented to llm-gateway (its LITELLM_MASTER_KEY)"
    type: string
    mandatory: true
    secret: true

  - name: LLM_MODEL
    description: "Model name to request from llm-gateway (must be in its litellm_config.yaml model_list)"
    type: string
    mandatory: true
    secret: false

  - name: PLATFORM_REGISTRY_URL
    description: "Base URL of the platform-registry service's entitlement-check API"
    type: string
    mandatory: true
    secret: false

  - name: PREDICTION_SERVICE_URL
    description: "Base URL of the prediction service's dataset/predict API (backs the chat agent's data tools)"
    type: string
    mandatory: true
    secret: false

  - name: AUTH_DISABLED
    description: "DEV ONLY: skip token/entitlement checks. Must be false beyond local iteration."
    type: string
    mandatory: true
    secret: false

  - name: CORS_ALLOWED_ORIGINS
    description: "Comma-separated origins ui-react is allowed to call this API from (never '*' beyond local dev)"
    type: string
    mandatory: true
    secret: false

  - name: ADMIN_API_KEY
    description: "Shared admin bearer token — resolves to the 'admin' org, entitled to every scenario"
    type: string
    mandatory: true
    secret: true

  - name: ENGINEERING_DEMO_API_KEY
    description: "Optional demo bearer token for 'engineering-demo' org (mpm/electric_motor/energy_building only)"
    type: string
    mandatory: false
    secret: true

  - name: DEV_ORG_ID
    description: "Org id used for every request when AUTH_DISABLED=true"
    type: string
    mandatory: true
    secret: false

  - name: SHARED_MODEL_ORG_ID
    description: "Org id every tenant's model falls back to until it has its own (matches training's ORG_ID)"
    type: string
    mandatory: true
    secret: false

  - name: LOGTO_ISSUER
    description: "Logto OIDC issuer, e.g. http://logto.localhost/oidc (required unless AUTH_DISABLED=true)"
    type: string
    mandatory: false
    secret: false

  - name: LOGTO_JWKS_URL
    description: "Logto JWKS endpoint, e.g. http://logto.localhost/oidc/jwks (required unless AUTH_DISABLED=true)"
    type: string
    mandatory: false
    secret: false

  - name: LOGTO_API_RESOURCE_INDICATOR
    description: "Expected token audience — the API resource registered in Logto for this platform's backend"
    type: string
    mandatory: false
    secret: false

# Optional global settings
global_settings:
  env_file: ".env"          # Default location for environment variable file
  fail_on_missing: true     # Stop execution if mandatory variables are missing
  case_sensitive: true      # Enforce case sensitivity for variable names

# Per-environment non-secret overrides.
# Secrets MUST never appear here — use .env (local) or CI/CD secret injection (cloud).
# APP_ENVIRONMENT selects the active profile (default: local).
environments:
  base:
    LOG_LEVEL: "INFO"
    HTTP_PORT: "8000"
    OBJECT_STORE_ACCESS_KEY: "ai_circus"
    DEV_ORG_ID: "demo"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "assistant"
    # Must match POSTGRES_USER in the repo root .env; override here (or via env
    # var) if you change it there.
    POSTGRES_USER: "ai_circus"
    # Must match training's ORG_ID default — see SHARED_MODEL_ORG_ID's description
    # above. Same "safe to default here" reasoning as SCENARIOS below.
    SHARED_MODEL_ORG_ID: "demo"
    # Empty = every tabular_ml scenario under SCENARIOS_DIR — see prediction/settings.yaml
    # for why a yaml default is safe here but not for AUTH_DISABLED/ADMIN_API_KEY below.
    SCENARIOS: ""
    # AUTH_DISABLED/ADMIN_API_KEY/LLM_MODEL/CORS_ALLOWED_ORIGINS deliberately have NO default here — see
    # prediction/settings.yaml for why (a profile default would always beat a real
    # environment variable — docker-compose.yml's LLM_MODEL default is what actually
    # applies, and is meant to be swapped per-deployment without a rebuild).

  # Running with `uv run` on the host, against infra started via `make up-infra`.
  local:
    SCENARIOS_DIR: "../../scenarios"
    POSTGRES_HOST: "localhost"
    OBJECT_STORE_ENDPOINT: "http://objectstore.localhost"
    # Loopback-bound host port (not Traefik — see root docker-compose.yml's
    # llm-gateway comment for why it must never be on the public entrypoint).
    LLM_GATEWAY_URL: "http://localhost:4000"
    PLATFORM_REGISTRY_URL: "http://localhost:8010"
    PREDICTION_SERVICE_URL: "http://prediction.localhost"

  # Running as a container inside docker-compose's `ai-circus` network.
  docker:
    SCENARIOS_DIR: "/app/scenarios"
    POSTGRES_HOST: "postgres"
    OBJECT_STORE_ENDPOINT: "http://seaweedfs:8333"
    LLM_GATEWAY_URL: "http://llm-gateway:4000"
    PLATFORM_REGISTRY_URL: "http://platform-registry:8000"
    PREDICTION_SERVICE_URL: "http://prediction:8000"

  staging: {}
    # Staging environment profile — overrides go here

  production: {}
    # Production environment profile — overrides go here
