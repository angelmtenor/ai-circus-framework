# Dependabot version updates: weekly, with minor/patch bumps grouped into a single PR
# per ecosystem to avoid a PR storm — major bumps still open individually since those
# are more likely to need manual review. Security updates (Dependabot alerts) are
# separate and open as soon as an advisory lands.
#
# Commit prefix `setup` (scope `deps`) keeps these PRs valid under commitlint
# (styleguide.md uses `setup` for dependency changes; there is no `chore` type).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "setup"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Workflow actions are pinned to commit SHAs; this keeps those pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "setup"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
