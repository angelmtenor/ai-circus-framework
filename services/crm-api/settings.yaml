# settings.yaml
# Configuration file for environment variables required by the application
# Author: Angel Martinez-Tenor
# Defines variable names, descriptions, types, constraints, and validation rules.
# Run 'make generate-data-model' after any change to sync data_model.py and .env.example.

# crm-api: an example customer API behind an MCP server (docs/adr/0022). It knows nothing about MCP
# or models: it validates a token issued for it (audience crm-api), takes the user and tenant from that
# token only, and returns what the caller's role may see, with personal fields masked. Never exposed
# through Traefik: only crm-mcp calls it.

env_variables:
  - name: LOG_LEVEL
    description: "Application log level (TRACE, DEBUG, INFO, WARNING, ERROR, CRITICAL)"
    type: string
    mandatory: true
    secret: false

  - name: HTTP_PORT
    description: "Port the API listens on"
    type: string
    mandatory: true
    secret: false

  - name: KEYCLOAK_ISSUER
    description: "Keycloak realm issuer every accepted token must carry"
    type: string
    mandatory: true
    secret: false

  - name: KEYCLOAK_JWKS_URL
    description: "Keycloak realm JWKS endpoint (in-cluster URL)"
    type: string
    mandatory: true
    secret: false

  - name: API_AUDIENCE
    description: "The audience a token must name to be accepted here: this API's Keycloak client id"
    type: string
    mandatory: true
    secret: false

  # Level 3 (docs/adr/0025). No profile values below on purpose: a profile value beats the environment,
  # so these come only from the deployment (k8s/mcp-examples/crm.yaml, docker-compose.yml) or their defaults.
  - name: SECURITY_LEVEL
    description: "2: bearer token for this API; 3: DPoP-bound token, checked live, over mutual TLS (ADR 0025)"
    type: string
    mandatory: false
    default: "2"
    secret: false

  - name: KEYCLOAK_INTROSPECTION_URL
    description: "Keycloak introspection endpoint (in-cluster URL), asked about every token at level 3"
    type: string
    mandatory: false
    secret: false

  - name: API_CLIENT_SECRET
    description: "This API's Keycloak client secret (CRM_API_CLIENT_SECRET), to introspect its tokens at level 3"
    type: string
    mandatory: false
    secret: true

  - name: TLS_PORT
    description: "Mutual-TLS port of the API at level 3 (HTTP_PORT then serves only /healthz and /metrics)"
    type: string
    mandatory: false
    default: "8443"
    secret: false

  - name: TLS_CERT_FILE
    description: "This API's server certificate (PEM) for the mutual-TLS listener"
    type: string
    mandatory: false
    secret: false

  - name: TLS_KEY_FILE
    description: "Private key of the server certificate (PEM)"
    type: string
    mandatory: false
    secret: false

  - name: TLS_CLIENT_CA_FILE
    description: "The only CA whose client certificates may connect: the one shared with its MCP server"
    type: string
    mandatory: false
    secret: false

# Optional global settings
global_settings:
  env_file: ".env"          # Default location for environment variable file
  fail_on_missing: true     # Stop execution if mandatory variables are missing
  case_sensitive: true      # Enforce case sensitivity for variable names

# Per-environment non-secret overrides.
# Secrets MUST never appear here — use .env (local) or CI/CD secret injection (cloud).
# APP_ENVIRONMENT selects the active profile (default: local).
environments:
  base:
    LOG_LEVEL: "INFO"
    HTTP_PORT: "8000"
    API_AUDIENCE: "crm-api"

  local: {}
    # Local development overrides

  staging: {}
    # Staging environment profile — overrides go here

  production: {}
    # Production environment profile — overrides go here
