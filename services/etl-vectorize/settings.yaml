# settings.yaml
# Configuration file for environment variables required by the application
# Author: ai-circus-framework contributors
# Defines variable names, descriptions, types, constraints, and validation rules.
# Run 'make generate-data-model' after any change to sync data_model.py and .env.example.
#
# etl-vectorize is a one-shot job (not a long-running server): for every
# conversational_rag scenario in SCENARIOS (empty/unset = all), it loads the tenant's
# documents from SeaweedFS (bootstrapping them from a tracked sample_docs/ folder on
# first run), chunks + embeds them, and upserts the result into a per-tenant Qdrant
# collection for rag-agent to query.

env_variables:
  - name: LOG_LEVEL
    description: "Application log level (TRACE, DEBUG, INFO, WARNING, ERROR, CRITICAL)"
    type: string
    mandatory: true
    secret: false

  - name: SCENARIOS
    description: "Comma-separated conversational_rag scenario slugs this run processes; empty/unset = every scenario"
    type: string
    mandatory: true
    secret: false

  # Must match ai_circus_shared.auth.ADMIN_ORG_ID (base default: "admin") for the demo
  # bootstrap content to actually be visible to the admin-key login path every fresh
  # `make all` lands on — a mismatch here silently leaves rag-agent/form-agent querying
  # an empty collection for that tenant (see the DocumentsConfig fallback this seeds).
  - name: ORG_ID
    description: "Tenant (Logto Organization id) whose documents this run processes — base default: ADMIN_ORG_ID"
    type: string
    mandatory: true
    secret: false

  - name: SCENARIOS_DIR
    description: "Path to the scenarios/ directory (one subdirectory per scenario.yaml)"
    type: string
    mandatory: true
    secret: false

  - name: OBJECT_STORE_ENDPOINT
    description: "SeaweedFS/S3 endpoint URL (docker service name in-container, *.localhost via Traefik locally)"
    type: string
    mandatory: true
    secret: false

  - name: OBJECT_STORE_ACCESS_KEY
    description: "SeaweedFS access key (must match OBJECT_STORE_ACCESS_KEY in the repo root .env)"
    type: string
    mandatory: true
    secret: false

  - name: OBJECT_STORE_SECRET_KEY
    description: "SeaweedFS secret key (must match OBJECT_STORE_SECRET_KEY in the repo root .env)"
    type: string
    mandatory: true
    secret: true

  - name: QDRANT_URL
    description: "Qdrant endpoint URL (docker service name in-container, *.localhost via Traefik for local dev)"
    type: string
    mandatory: true
    secret: false

  - name: EMBEDDING_PROVIDER
    description: "Embedding backend: 'local' (sentence-transformers, no API key), 'gemini', or 'voyage'"
    type: string
    mandatory: false
    default: "local"
    secret: false
    validation:
      regex: "^(local|gemini|voyage)$"
      error_message: "EMBEDDING_PROVIDER must be one of: local, gemini, voyage"

  - name: EMBEDDING_MODEL
    description: "Model name override for the active EMBEDDING_PROVIDER; unset = that provider's own default"
    type: string
    mandatory: false
    secret: false

  - name: LLM_GATEWAY_URL
    description: "Base URL of llm-gateway's OpenAI-compatible API (only needed if EMBEDDING_PROVIDER=local)"
    type: string
    mandatory: true
    secret: false

  - name: LLM_GATEWAY_API_KEY
    description: "API key presented to llm-gateway (its LITELLM_MASTER_KEY); needed if EMBEDDING_PROVIDER=local"
    type: string
    mandatory: true
    secret: true

  - name: GOOGLE_API_KEY
    description: "Google API key (only needed if EMBEDDING_PROVIDER=gemini)"
    type: string
    mandatory: false
    secret: true

  - name: VOYAGE_API_KEY
    description: "Voyage AI API key (only needed if EMBEDDING_PROVIDER=voyage)"
    type: string
    mandatory: false
    secret: true

# Optional global settings
global_settings:
  env_file: ".env"          # Default location for environment variable file
  fail_on_missing: true     # Stop execution if mandatory variables are missing
  case_sensitive: true      # Enforce case sensitivity for variable names

# Per-environment non-secret overrides.
# Secrets MUST never appear here — use .env (local) or CI/CD secret injection (cloud).
# APP_ENVIRONMENT selects the active profile (default: local).
environments:
  base:
    LOG_LEVEL: "INFO"
    ORG_ID: "admin"
    OBJECT_STORE_ACCESS_KEY: "ai_circus"
    # Empty = every conversational_rag scenario under SCENARIOS_DIR — see
    # etl-tabular/settings.yaml for the same default and its residual-limitation caveat.
    SCENARIOS: ""

  # Running with `uv run` on the host, against infra started via `make up-infra`.
  local:
    SCENARIOS_DIR: "../../scenarios"
    OBJECT_STORE_ENDPOINT: "http://objectstore.localhost"
    # Loopback-bound host ports (not Traefik — see root docker-compose.yml's qdrant/
    # llm-gateway comments for why neither belongs on the public entrypoint).
    QDRANT_URL: "http://localhost:6333"
    LLM_GATEWAY_URL: "http://localhost:4000"

  # Running as a container inside docker-compose's `ai-circus` network.
  docker:
    SCENARIOS_DIR: "/app/scenarios"
    OBJECT_STORE_ENDPOINT: "http://seaweedfs:8333"
    QDRANT_URL: "http://qdrant:6333"
    LLM_GATEWAY_URL: "http://llm-gateway:4000"

  staging: {}
    # Staging environment profile — overrides go here

  production: {}
    # Production environment profile — overrides go here
