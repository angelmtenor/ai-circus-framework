# settings.yaml
# Configuration file for environment variables required by the application
# Author: ai-circus-framework contributors
# Defines variable names, descriptions, types, constraints, and validation rules.
# Run 'make generate-data-model' after any change to sync data_model.py and .env.example.
#
# prediction is a long-running FastAPI service serving POST /predict/{scenario_slug}
# for every tabular_ml scenario listed in SCENARIOS (empty/unset = all), across every
# tenant (the model/explainer are loaded per (org, scenario), cached in memory, from
# MinIO). Validates the caller's Logto token (or ADMIN_API_KEY) and checks the
# entitlement via platform-registry before serving — unless AUTH_DISABLED (dev only).

env_variables:
  - name: LOG_LEVEL
    description: "Application log level (TRACE, DEBUG, INFO, WARNING, ERROR, CRITICAL)"
    type: string
    mandatory: true
    secret: false

  - name: HTTP_PORT
    description: "Port the FastAPI app listens on"
    type: string
    mandatory: true
    secret: false

  - name: SCENARIOS
    description: "Comma-separated tabular_ml scenario slugs this instance serves; empty/unset = every scenario"
    type: string
    mandatory: true
    secret: false

  - name: SCENARIOS_DIR
    description: "Path to the scenarios/ directory (one subdirectory per scenario.yaml)"
    type: string
    mandatory: true
    secret: false

  - name: MINIO_ENDPOINT
    description: "MinIO/S3 endpoint URL (docker service name in-container, *.localhost via Traefik for local dev)"
    type: string
    mandatory: true
    secret: false

  - name: MINIO_ACCESS_KEY
    description: "MinIO access key (must match MINIO_ROOT_USER in the repo root .env)"
    type: string
    mandatory: true
    secret: false

  - name: MINIO_SECRET_KEY
    description: "MinIO secret key (must match MINIO_ROOT_PASSWORD in the repo root .env)"
    type: string
    mandatory: true
    secret: true

  - name: PLATFORM_REGISTRY_URL
    description: "Base URL of the platform-registry service's entitlement-check API"
    type: string
    mandatory: true
    secret: false

  - name: AUTH_DISABLED
    description: "DEV ONLY: skip token/entitlement checks. Must be false beyond local iteration."
    type: string
    mandatory: true
    secret: false

  - name: CORS_ALLOWED_ORIGINS
    description: "Comma-separated origins ui-react is allowed to call this API from (never '*' beyond local dev)"
    type: string
    mandatory: true
    secret: false

  - name: ADMIN_API_KEY
    description: "Shared admin bearer token — resolves to the 'admin' org, entitled to every scenario"
    type: string
    mandatory: true
    secret: true

  - name: ENGINEERING_DEMO_API_KEY
    description: "Optional demo bearer token for 'engineering-demo' org (mpm/electric_motor/energy_building only)"
    type: string
    mandatory: false
    secret: true

  - name: DEV_ORG_ID
    description: "Org id used for every request when AUTH_DISABLED=true"
    type: string
    mandatory: true
    secret: false

  - name: SHARED_MODEL_ORG_ID
    description: "Org id every tenant's model falls back to until it has its own (matches training's ORG_ID)"
    type: string
    mandatory: true
    secret: false

  - name: LOGTO_ISSUER
    description: "Logto OIDC issuer, e.g. http://logto.localhost/oidc (required unless AUTH_DISABLED=true)"
    type: string
    mandatory: false
    secret: false

  - name: LOGTO_JWKS_URL
    description: "Logto JWKS endpoint, e.g. http://logto.localhost/oidc/jwks (required unless AUTH_DISABLED=true)"
    type: string
    mandatory: false
    secret: false

  - name: LOGTO_API_RESOURCE_INDICATOR
    description: "Expected token audience — the API resource registered in Logto for this platform's backend"
    type: string
    mandatory: false
    secret: false

# Optional global settings
global_settings:
  env_file: ".env"          # Default location for environment variable file
  fail_on_missing: true     # Stop execution if mandatory variables are missing
  case_sensitive: true      # Enforce case sensitivity for variable names

# Per-environment non-secret overrides.
# Secrets MUST never appear here — use .env (local) or CI/CD secret injection (cloud).
# APP_ENVIRONMENT selects the active profile (default: local).
environments:
  base:
    LOG_LEVEL: "INFO"
    HTTP_PORT: "8000"
    MINIO_ACCESS_KEY: "ai_circus"
    DEV_ORG_ID: "demo"
    # Must match training's ORG_ID default — see SHARED_MODEL_ORG_ID's description
    # above. Same "safe to default here" reasoning as SCENARIOS below.
    SHARED_MODEL_ORG_ID: "demo"
    # Empty = every tabular_ml scenario under SCENARIOS_DIR. Safe to default here
    # (unlike AUTH_DISABLED/ADMIN_API_KEY below): there's only one instance of this
    # service, so there's no risk of two instances silently sharing a default they
    # shouldn't — see the root plan's "Consolidation mechanism" decision. A profile
    # default here WOULD still beat a real env var override of the same name, though
    # (pydantic-settings gives these profile overrides, once merged, priority over the
    # actual process env) — so restricting one specific deployment to fewer scenarios
    # means editing this profile, not just setting an env var.
    SCENARIOS: ""
    # AUTH_DISABLED/ADMIN_API_KEY/CORS_ALLOWED_ORIGINS deliberately have NO default
    # here: putting one in this profile block would always win over a real
    # environment variable at runtime (pydantic-settings gives explicit constructor
    # kwargs, which is what these profile overrides become, priority over the actual
    # process env) — a hardcoded local-dev origin list must never silently beat a
    # real deployment's env var. Set them in your own .env for local (non-docker) dev;
    # docker-compose.yml supplies a `${VAR:-default}` fallback for the docker profile.

  # Running with `uv run` on the host, against infra started via `make up-infra`.
  local:
    SCENARIOS_DIR: "../../scenarios"
    MINIO_ENDPOINT: "http://minio.localhost"
    PLATFORM_REGISTRY_URL: "http://localhost:8010"

  # Running as a container inside docker-compose's `ai-circus` network.
  docker:
    SCENARIOS_DIR: "/app/scenarios"
    MINIO_ENDPOINT: "http://minio:9000"
    PLATFORM_REGISTRY_URL: "http://platform-registry:8000"

  staging: {}
    # Staging environment profile — overrides go here

  production: {}
    # Production environment profile — overrides go here
