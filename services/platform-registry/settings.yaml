# settings.yaml
# Configuration file for environment variables required by the application
# Author: Angel Martinez-Tenor
# Defines variable names, descriptions, types, constraints, and validation rules.
# Run 'make generate-data-model' after any change to sync data_model.py and .env.example.
#
# platform-registry owns the `platform` Postgres schema (tenants/scenarios/entitlements)
# and seeds it from ../../scenarios/*.yaml at startup. It is NOT exposed through Traefik.
# Its entitlement-mutation/llm-settings routes are admin-only, called by other backend
# services or an operator. GET /entitlements/{org_id} and POST /documents/extract ARE
# called directly from ui-react's browser code (over platform-registry's loopback-
# published port) — see api.py's require_org_match/require_authenticated for those
# routes' own auth gates.

env_variables:
  - name: LOG_LEVEL
    description: "Application log level (TRACE, DEBUG, INFO, WARNING, ERROR, CRITICAL)"
    type: string
    mandatory: true
    secret: false

  - name: HTTP_PORT
    description: "Port the FastAPI app listens on"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_HOST
    description: "Postgres hostname (docker service name in-container, localhost for local dev)"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_PORT
    description: "Postgres port"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_DB
    description: "Postgres database name for the platform schema"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_USER
    description: "Postgres user"
    type: string
    mandatory: true
    secret: false

  - name: POSTGRES_PASSWORD
    description: "Postgres password"
    type: string
    mandatory: true
    secret: true

  - name: SCENARIOS_DIR
    description: "Path to the scenarios/ directory (one subdirectory per scenario.yaml) to seed from"
    type: string
    mandatory: true
    secret: false

  # Only needed for the `platform-registry-sync-entitlements` tool (pull-sync of
  # Keycloak realm-role assignments into the local entitlements table) — the
  # main API can run without these being set.
  - name: KEYCLOAK_SERVER_URL
    description: "Keycloak server root (distinct from the realm issuer; sync tool only)"
    type: string
    mandatory: false
    secret: false

  - name: KEYCLOAK_REALM
    description: "Keycloak realm name, e.g. ai-circus"
    type: string
    mandatory: true
    secret: false

  - name: KEYCLOAK_M2M_CLIENT_ID
    description: "Service-account client ID for calling Keycloak's Admin REST API (sync/provision tooling only)"
    type: string
    mandatory: false
    secret: false

  - name: KEYCLOAK_M2M_CLIENT_SECRET
    description: "Service-account client secret for calling Keycloak's Admin REST API (sync/provision tooling only)"
    type: string
    mandatory: false
    secret: true

  # Only needed for the `platform-registry-provision-owner` tool (one-off creation of
  # a real Keycloak Organization + user entitled to every scenario) — the main API and
  # every other tool can run without these being set.
  - name: KEYCLOAK_OWNER_EMAIL
    description: "Email for the real Keycloak user the provision-owner tool creates/finds (provision tool only)"
    type: string
    mandatory: false
    secret: false

  - name: KEYCLOAK_OWNER_PASSWORD
    description: "Password for the real Keycloak user the provision-owner tool creates (provision tool only)"
    type: string
    mandatory: false
    secret: true

  - name: CORS_ALLOWED_ORIGINS
    description: "Comma-separated origins ui-react is allowed to call this API from (never '*' beyond local dev)"
    type: string
    mandatory: true
    secret: false

  # Backs the admin-only /llm-settings/* endpoints (view/test/configure llm-gateway's
  # provider models) — reuses the same admin bearer token ui-react's admin-key login
  # already sends, rather than re-implementing Keycloak JWT validation here.
  - name: ADMIN_API_KEY
    description: "Bearer token required on /llm-settings/* (shared with other services' admin-key bypass)"
    type: string
    mandatory: true
    secret: true

  - name: ENGINEERING_DEMO_API_KEY
    description: "Optional shared demo bearer token, checked by GET /auth/verify-engineering-demo-key"
    type: string
    mandatory: false
    secret: true

  - name: LLM_GATEWAY_URL
    description: "Base URL of the llm-gateway service's OpenAI-compatible + admin API"
    type: string
    mandatory: true
    secret: false

  - name: LLM_GATEWAY_API_KEY
    description: "API key presented to llm-gateway (its LITELLM_MASTER_KEY) for admin calls"
    type: string
    mandatory: true
    secret: true

  # Back require_org_match (see api.py) — GET /entitlements/{org_id}[/...] is called
  # directly from ui-react's browser code (see this file's header comment), so it
  # needs the same identity resolution every other service uses to confirm the
  # caller actually IS the org they're asking about, not just any caller.
  - name: AUTH_DISABLED
    description: "DEV ONLY: skip token checks on entitlement reads. Must be false beyond local iteration."
    type: string
    mandatory: true
    secret: false

  - name: DEV_ORG_ID
    description: "Org id used for every request when AUTH_DISABLED=true"
    type: string
    mandatory: true
    secret: false

  - name: KEYCLOAK_ISSUER
    description: "Keycloak realm issuer (required unless AUTH_DISABLED=true)"
    type: string
    mandatory: false
    secret: false

  - name: KEYCLOAK_JWKS_URL
    description: "Keycloak realm JWKS endpoint (required unless AUTH_DISABLED=true)"
    type: string
    mandatory: false
    secret: false

  - name: KEYCLOAK_AUDIENCE
    description: "Expected token audience, registered via an Audience client-scope mapper in Keycloak"
    type: string
    mandatory: false
    secret: false

# Optional global settings
  # NOTE: no profile defaults for GOVERNANCE_* — config is built as EnvConfig(**profile), and init
  # values beat environment variables, so a default here could never be switched on. Unset = off.
  # --- Governance (docs/governance/, ADR 0011): all off by default; with them off the
  # service behaves exactly as before. Flags are strings ("true"/"false") like every var here.
  - name: GOVERNANCE_EVENTS_ENABLED
    description: "true = emit content-free CloudEvents governance events for admin changes"
    type: string
    mandatory: false
    secret: false

  - name: GOVERNANCE_EVENT_SINK
    description: "Where governance events go: 'log' (default) or 'http' (HMAC-signed webhook via a Valkey outbox)"
    type: string
    mandatory: false
    secret: false

  - name: GOVERNANCE_EVENT_NAMESPACE
    description: "Reverse-DNS namespace of governance event types, '<namespace>.governance.<name>.v1'"
    type: string
    mandatory: false
    secret: false

  - name: GOVERNANCE_WEBHOOK_URL
    description: "Webhook receiving governance events when GOVERNANCE_EVENT_SINK=http"
    type: string
    mandatory: false
    secret: false

  - name: GOVERNANCE_WEBHOOK_SECRET
    description: "HMAC secret signing webhook deliveries (X-Governance-Signature); from the environment only"
    type: string
    mandatory: false
    secret: true

  - name: GOVERNANCE_AUDIT_ENABLED
    description: "true = append every admin mutation to the hash-chained audit_log and serve GET /governance/audit"
    type: string
    mandatory: false
    secret: false

  - name: GOVERNANCE_INVENTORY_ENABLED
    description: "true = serve the CycloneDX AI-BOM at GET /governance/inventory (admin only)"
    type: string
    mandatory: false
    secret: false

  - name: OBJECT_STORE_ENDPOINT
    description: "SeaweedFS/S3 endpoint — read-only, only for the AI-BOM's trained-model metadata"
    type: string
    mandatory: false
    secret: false

  - name: OBJECT_STORE_ACCESS_KEY
    description: "SeaweedFS access key (AI-BOM only; from the environment)"
    type: string
    mandatory: false
    secret: false

  - name: OBJECT_STORE_SECRET_KEY
    description: "SeaweedFS secret key (AI-BOM only; from the environment)"
    type: string
    mandatory: false
    secret: true

  - name: GOVERNANCE_CATALOG_ENABLED
    description: "true = publish each AI system's declared risk to Valkey for the gateway's by_risk fail mode"
    type: string
    mandatory: false
    secret: false

  - name: CACHE_URL
    description: "Redis-protocol URL (Valkey) — governance event outbox and AI-system catalogue only"
    type: string
    mandatory: false
    secret: false

global_settings:
  env_file: ".env"          # Default location for environment variable file
  fail_on_missing: true     # Stop execution if mandatory variables are missing
  case_sensitive: true      # Enforce case sensitivity for variable names

# Per-environment non-secret overrides.
# Secrets MUST never appear here — use .env (local) or CI/CD secret injection (cloud).
# APP_ENVIRONMENT selects the active profile (default: local).
environments:
  base:
    LOG_LEVEL: "INFO"
    HTTP_PORT: "8000"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "platform"
    # Must match POSTGRES_USER in the repo root .env; override here (or via env var)
    # if you change it there.
    POSTGRES_USER: "ai_circus"
    DEV_ORG_ID: "demo"
    KEYCLOAK_REALM: "ai-circus"
    # ADMIN_API_KEY/CORS_ALLOWED_ORIGINS/AUTH_DISABLED deliberately have NO default
    # here: a profile default would always win over a real environment variable at
    # runtime (pydantic-settings gives explicit constructor kwargs, which is what
    # these profile overrides become, priority over the actual process env) — a
    # hardcoded local-dev origin list must never silently beat a real deployment's
    # env var. docker-compose.yml supplies a `${VAR:-default}` fallback for the
    # docker profile.

  # Running with `uv run` on the host, against infra started via `make up-infra`.
  local:
    POSTGRES_HOST: "localhost"
    OBJECT_STORE_ENDPOINT: "http://objectstore.localhost"
    CACHE_URL: "redis://localhost:6379"
    SCENARIOS_DIR: "../../scenarios"
    # Loopback-bound host port (not Traefik — see root docker-compose.yml's
    # llm-gateway comment for why it must never be on the public entrypoint).
    LLM_GATEWAY_URL: "http://localhost:4000"

  # Running as a container inside docker-compose's `ai-circus` network.
  docker:
    POSTGRES_HOST: "postgres"
    OBJECT_STORE_ENDPOINT: "http://seaweedfs:8333"
    CACHE_URL: "redis://valkey:6379"
    SCENARIOS_DIR: "/app/scenarios"
    LLM_GATEWAY_URL: "http://llm-gateway:4000"

  staging: {}
    # Staging environment profile — overrides go here

  production: {}
    # Production environment profile — overrides go here
