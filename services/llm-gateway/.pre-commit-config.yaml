# Pre-commit settings / QA
# Author: ai-circus-framework contributors. Scaffolded from ai-circus-template.
# Update hooks: `uv run pre-commit autoupdate`

files: ^services/llm-gateway/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-toml
      - id: check-yaml
      - id: check-json
        exclude: (^|/)\.vscode/
      - id: pretty-format-json
        exclude: ^(.vscode/(settings|extensions)\.json)
        args: [--autofix, --no-sort-keys]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Check
        entry: uv run --project services/llm-gateway ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff Format
        entry: uv run --project services/llm-gateway ruff format
        language: system
        types: [python]

      - id: pyrefly-check
        name: Pyrefly (type checking)
        entry: uv run --project services/llm-gateway pyrefly check services/llm-gateway/src
        language: system
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/checkmake/checkmake.git
    rev: v0.3.0
    hooks:
      - id: checkmake
