# settings.yaml
# Configuration file for environment variables required by the application
# Author: Angel Martinez-Tenor
# Defines variable names, descriptions, types, constraints, and validation rules.
# Run 'make generate-data-model' after any change to sync data_model.py and .env.example.
#
# llm-gateway wraps the real LiteLLM proxy (litellm[proxy]) — an OpenAI-compatible,
# provider-agnostic gateway. app.py validates config, then execs the `litellm` CLI
# against litellm_config.yaml; it isn't a custom FastAPI app like the other services
# (see litellm_config.yaml for model routing and why persistent spend-tracking isn't
# enabled yet).

env_variables:
  - name: LOG_LEVEL
    description: "Application log level (TRACE, DEBUG, INFO, WARNING, ERROR, CRITICAL)"
    type: string
    mandatory: true
    secret: false

  - name: HTTP_PORT
    description: "Port the LiteLLM proxy listens on"
    type: string
    mandatory: true
    secret: false

  - name: LITELLM_CONFIG_PATH
    description: "Path to litellm_config.yaml (model routing / general settings)"
    type: string
    mandatory: true
    secret: false

  - name: LITELLM_MASTER_KEY
    description: "Master API key callers must present to the gateway (Bearer token)"
    type: string
    mandatory: true
    secret: true

  - name: CACHE_URL
    description: "Redis-protocol connection URL (docker-compose/k8s run Valkey) - backs the budget tracker"
    type: string
    mandatory: true
    secret: false

  - name: EMBEDDING_PROVIDER
    description: "Platform embedding backend (as rag-agent/etl-vectorize): 'local' = this gateway's local-embed"
    type: string
    mandatory: false
    default: "local"
    secret: false
    validation:
      regex: "^(local|gemini|voyage)$"
      error_message: "EMBEDDING_PROVIDER must be one of: local, gemini, voyage"

  - name: LOCAL_EMBED_PRELOAD
    description: "'true' = warm local-embed at proxy start, not on the first call (EMBEDDING_PROVIDER=local only)"
    type: string
    mandatory: false
    default: "false"
    secret: false
    validation:
      regex: "^(true|false)$"
      error_message: "LOCAL_EMBED_PRELOAD must be true or false"

  # Referenced by litellm_config.yaml via `os.environ/<NAME>` — read directly by the
  # litellm process, not by this service's own code. Declared here for discoverability
  # (`make setup`/.env.example) even though EnvConfig never reads them itself.
  - name: OPENAI_API_KEY
    description: "OpenAI API key (only needed if litellm_config.yaml routes to an openai/* model)"
    type: string
    mandatory: false
    secret: true

  - name: GOOGLE_API_KEY
    description: "Google API key (only needed if litellm_config.yaml routes to a gemini/* model)"
    type: string
    mandatory: false
    secret: true

  - name: VOYAGE_API_KEY
    description: "Voyage AI API key (only needed if EMBEDDING_PROVIDER=voyage routes embeddings here)"
    type: string
    mandatory: false
    secret: true

  - name: AZURE_OPENAI_API_KEY
    description: "Azure OpenAI API key (only needed if litellm_config.yaml routes to an azure/* model)"
    type: string
    mandatory: false
    secret: true

  - name: AZURE_OPENAI_API_BASE
    description: "Azure OpenAI resource endpoint, e.g. https://<resource>.openai.azure.com (azure-gpt4o model only)"
    type: string
    mandatory: false
    secret: false

  - name: DEEPSEEK_API_KEY
    description: "DeepSeek API key (only needed if litellm_config.yaml routes to a deepseek/* model)"
    type: string
    mandatory: false
    secret: true

  - name: GROQ_API_KEY
    description: "GroqCloud API key (only needed if litellm_config.yaml routes to a groq/* model)"
    type: string
    mandatory: false
    secret: true

  - name: OPENROUTER_API_KEY
    description: "OpenRouter API key (only needed if litellm_config.yaml routes to the openrouter model)"
    type: string
    mandatory: false
    secret: true

  - name: ANTHROPIC_API_KEY
    description: "Anthropic API key (only needed if litellm_config.yaml routes to an anthropic/* model)"
    type: string
    mandatory: false
    secret: true

  - name: OLLAMA_API_BASE
    description: "Base URL of the optional Ollama instance (llama3 model only); unset/not started = unreachable"
    type: string
    mandatory: false
    secret: false

  # GenAI observability — read by app.py (which switches LiteLLM's `langfuse_otel`
  # callback on only when both keys are present) and then by litellm itself. Every
  # completion through this gateway becomes a Langfuse trace; see k8s/base/langfuse.yaml.
  - name: LANGFUSE_HOST
    description: "Langfuse base URL (in-cluster, e.g. http://langfuse-web:3000); unset = no tracing"
    type: string
    mandatory: false
    secret: false

  - name: LANGFUSE_PUBLIC_KEY
    description: "Langfuse project public key (pk-lf-...); unset = no tracing"
    type: string
    mandatory: false
    secret: true

  - name: LANGFUSE_SECRET_KEY
    description: "Langfuse project secret key (sk-lf-...); unset = no tracing"
    type: string
    mandatory: false
    secret: true

# Optional global settings
  # --- Governance (docs/governance/, ADR 0011): the policy decision point hook. All off by
  # default — POLICY_DECIDER unset/'noop' makes the hook a no-op, so the gateway behaves exactly
  # as before. NOTE: no profile defaults for these: config is built as EnvConfig(**profile) and
  # init values beat environment variables, so a default could never be overridden.
  - name: POLICY_DECIDER
    description: "Policy decision point: 'noop' (default, allow all), 'static' (YAML), 'opa' or 'http'"
    type: string
    mandatory: false
    secret: false

  - name: POLICY_STATIC_PATH
    description: "YAML rules file for POLICY_DECIDER=static (see docs/governance/policy.md)"
    type: string
    mandatory: false
    secret: false

  - name: POLICY_OPA_URL
    description: "OPA base URL for POLICY_DECIDER=opa, e.g. http://opa:8181"
    type: string
    mandatory: false
    secret: false

  - name: POLICY_OPA_PACKAGE
    description: "OPA package path of the decision rule (default 'aicircus/governance')"
    type: string
    mandatory: false
    secret: false

  - name: POLICY_HTTP_URL
    description: "Decision endpoint for POLICY_DECIDER=http (the policy-decision.json contract)"
    type: string
    mandatory: false
    secret: false

  - name: POLICY_HTTP_TOKEN
    description: "Optional bearer token sent to the http decision endpoint"
    type: string
    mandatory: false
    secret: true

  - name: POLICY_TIMEOUT_MS
    description: "Per-decision timeout in milliseconds (default 500)"
    type: string
    mandatory: false
    secret: false

  - name: POLICY_CACHE_TTL_SECONDS
    description: "How long a decision is cached in Valkey (default 30); an invalidation webhook clears it sooner"
    type: string
    mandatory: false
    secret: false

  - name: POLICY_FAIL_MODE
    description: "If the decision point is unreachable: 'open' (default), 'closed' or 'by_risk'"
    type: string
    mandatory: false
    secret: false

  - name: TRACE_CAPTURE_CONTENT
    description: "false = redact prompts and completions from traces and logs (default: captured, as before)"
    type: string
    mandatory: false
    secret: false

  - name: GOVERNANCE_EVENTS_ENABLED
    description: "true = emit content-free governance events (policy deny/degrade/fail-open, budget exhausted)"
    type: string
    mandatory: false
    secret: false

  - name: GOVERNANCE_EVENT_SINK
    description: "'log' (default) or 'http' (append to the Valkey outbox platform-registry drains to the webhook)"
    type: string
    mandatory: false
    secret: false

  - name: GOVERNANCE_EVENT_NAMESPACE
    description: "Reverse-DNS namespace of governance event types (default dev.aicircus)"
    type: string
    mandatory: false
    secret: false

global_settings:
  env_file: ".env"          # Default location for environment variable file
  fail_on_missing: true     # Stop execution if mandatory variables are missing
  case_sensitive: true      # Enforce case sensitivity for variable names

# Per-environment non-secret overrides.
# Secrets MUST never appear here — use .env (local) or CI/CD secret injection (cloud).
# APP_ENVIRONMENT selects the active profile (default: local).
environments:
  base:
    LOG_LEVEL: "INFO"
    HTTP_PORT: "4000"
    LITELLM_CONFIG_PATH: "litellm_config.yaml"

  local:
    CACHE_URL: "redis://localhost:6379"

  docker:
    # Running as a container inside docker-compose's `ai-circus` network.
    CACHE_URL: "redis://valkey:6379"
    # Deployed (compose and k8s both run this profile): never make the first chat/RAG
    # request of a demo pay for loading the embedding model — see custom_handler.py.
    LOCAL_EMBED_PRELOAD: "true"

  staging: {}
    # Staging environment profile — overrides go here

  production: {}
    # Production environment profile — overrides go here
