# litellm_config.yaml — model routing for the LiteLLM proxy (llm-gateway).
# Author: Angel Martinez-Tenor
#
# Add/remove model_list entries to change what's available through the gateway's
# OpenAI-compatible API — every consumer (assistant, rag-agent, ui-react/CopilotKit)
# calls a `model_name` from this list, never a provider SDK directly. Provider API
# keys are read from the real environment via the `os.environ/<NAME>` syntax — see
# settings.yaml for which vars to set in .env.
#
# Rate governance: every entry below carries a static `rpm`/`tpm` ceiling, enforced
# by the router itself (no database needed — see general_settings' comment for why
# this repo can't turn on litellm's DB-backed spend tracking/virtual keys). This is
# a *shared*, per-model limit, not a per-tenant budget — it protects one shared
# provider key from being exhausted by any single runaway caller, which is what's
# achievable without adding Postgres+Prisma to this image. Per-tenant budgets are a
# tracked follow-up (see root README/architecture notes), not implemented here.
# Tune the numbers to your own provider tier — these defaults are conservative
# free/low-tier estimates, not measured limits.

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      rpm: 60
      tpm: 150000

  # GPT-5.6 family — same OPENAI_API_KEY; Sol is OpenAI's flagship, Terra the mid tier,
  # Luna the cheap/fast tier. All three are reasoning models that reject `temperature`
  # other than 1 — see litellm_settings.drop_params below for why that's harmless here.
  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY
      rpm: 30
      tpm: 200000

  - model_name: gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY
      rpm: 60
      tpm: 200000

  - model_name: gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY
      rpm: 60
      tpm: 200000

  # Default free-tier pick. Google has been retiring 2.x-generation models early for
  # *newly created* API keys/projects (404 "no longer available to new users" well
  # before the documented shutdown date — see
  # https://discuss.ai.google.dev/t/gemini-2-5-flash-and-gemini-2-5-flash-lite-returning-404-no-longer-available-today-july-9-contradicts-oct-16-2026-shutdown-date/174267),
  # pushing new users to the 3.x line instead — hence 3.1, not 2.5, Flash Lite here.
  # If this 404s again on your key, check https://ai.google.dev/gemini-api/docs/models
  # for the current free-tier "flash-lite"-class model and swap it in.
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GOOGLE_API_KEY
      rpm: 15
      tpm: 1000000

  # Same GOOGLE_API_KEY, more capable tiers. 3.8 Flash is Google's recommended default
  # for new projects (stable, Sept 2026); 3.1 Pro is the newest Pro, still a preview
  # model id — swap in the stable id once https://ai.google.dev/gemini-api/docs/models
  # lists one.
  - model_name: gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GOOGLE_API_KEY
      rpm: 30
      tpm: 1000000

  - model_name: gemini-3.1-pro
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GOOGLE_API_KEY
      rpm: 15
      tpm: 1000000

  # DeepSeek's own API (not a proxy of another provider) — cheap, OpenAI-compatible.
  # DeepSeek retired the legacy `deepseek-chat`/`deepseek-reasoner` names on 2026-07-24
  # (any request naming them errors) — they were aliases of V4 Flash, hence these two.
  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      rpm: 60
      tpm: 150000

  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      rpm: 30
      tpm: 150000

  # GroqCloud — free tier, LPU-hosted, very low latency. Groq retired every Llama 3.x
  # model from its catalog (this used to be llama-3.3-70b-versatile) — gpt-oss-120b is
  # the current closest-capability general-chat replacement on their free tier. Same
  # GROQ_API_KEY as the smaller model below — see platform_registry/core/llm_settings.py's
  # PROVIDERS["groq"], which groups both under one "GroqCloud" card in ui-react's Settings
  # page, letting an operator pick per-request accuracy vs. free-tier headroom.
  - model_name: groq-llama
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
      tpm: 8000

  # Smaller sibling of gpt-oss-120b above, same free key — Groq scales its free-tier
  # tokens-per-minute quota down with model size, so this one has far more headroom
  # than gpt-oss-120b's (which 429s on a single request once tool results/history push
  # the prompt past ~8k tokens), at some quality cost. (Not llama-3.1-8b-instant — Groq
  # has since delisted that one too; check `GET /openai/v1/models` on your own key via
  # https://console.groq.com/docs/models if this one also 404s later.)
  - model_name: groq-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
      tpm: 60000

  # Third model on the same free GROQ_API_KEY — Alibaba's Qwen 3.8 (27B dense).
  - model_name: groq-qwen
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
      tpm: 30000

  # OpenRouter — one key routes to many vendors' models. Individual ":free"-suffixed
  # model slugs (e.g. meta-llama/llama-3.3-70b-instruct:free) get delisted/relisted
  # within weeks, so this points at OpenRouter's own "Free Models Router"
  # (https://openrouter.ai/openrouter/free) instead — it auto-picks a currently-free
  # model for you and won't 404 when any one underlying model rotates out. Pin to a
  # specific model string (see https://openrouter.ai/models) once you have paid
  # credits and want a stable, known model.
  - model_name: openrouter
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      tpm: 100000

  # Anthropic's own API (not a proxy of another provider). Haiku is the
  # fast/cheap tier — matches the cost-conscious default picked for the other
  # providers above (gemini-flash, groq-llama); Sonnet, Opus and Fable below share
  # the same ANTHROPIC_API_KEY, in rising order of capability and price.
  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 50
      tpm: 100000

  # litellm 1.104.0's bundled cost map has no `claude-sonnet-5-5` entry yet, so the
  # price is pinned here (Anthropic's list price, per token) — without it every call
  # would cost $0 to budget_hook and a tenant's spend cap would never trip. Drop the
  # two cost lines once a litellm bump knows the model.
  - model_name: claude-sonnet-5.5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      rpm: 50
      tpm: 100000

  - model_name: claude-opus-5.5
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 30
      tpm: 100000

  # Most capable — and at $10/$50 per million tokens the priciest route here, hence
  # the lowest ceiling.
  - model_name: claude-fable-5.1
    litellm_params:
      model: anthropic/claude-fable-5-1
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 10
      tpm: 100000

  # Optional — unreachable (no default model selected) until an operator sets
  # AZURE_OPENAI_API_KEY/_BASE (see docker-compose.yml's llm-gateway env) and edits
  # `azure/<deployment>` below to match their actual Azure deployment name
  # (litellm's `os.environ/VAR` substitution only replaces a value that's *entirely*
  # that token, so the deployment name — which varies per Azure resource — can't be
  # env-substituted inside this prefixed string). ui-react's Settings page can only
  # report/test this one (see platform_registry/core/llm_settings.py's docstring
  # for why it can't apply a change here directly — no litellm DB mode).
  - model_name: azure-gpt4o
    litellm_params:
      model: azure/gpt-4o-mini # <- replace with your deployment name
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_base: os.environ/AZURE_OPENAI_API_BASE
      rpm: 60
      tpm: 150000

  # Fully local/no-API-key option — routes to the `ollama` service in
  # docker-compose.yml. That service is OPTIONAL (profile "ollama", not started by
  # `docker compose up` by default — see docker-compose.yml) since it costs real
  # RAM/disk just sitting idle; start it explicitly with `make ollama-up` when you
  # want a no-API-key fallback. Its `ollama-pull` one-shot job pulls llama3.2:3b
  # (~2GB) on first start — 3B is the floor for usable answers in this stack's
  # assistant/rag-agent chat scenarios; the 1B tier answers too unreliably to be
  # worth bundling. Override OLLAMA_API_BASE in .env to point at an Ollama instance
  # you run yourself instead (any 3B+ model works).
  - model_name: llama3
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: os.environ/OLLAMA_API_BASE
      # No external quota to protect (self-hosted) — this ceiling exists purely to
      # stop a burst of concurrent requests from starving the single shared Ollama
      # container's CPU, on a laptop-class deployment.
      rpm: 20
      tpm: 200000

  # Local, no-API-key embedding backend for EMBEDDING_PROVIDER=local (etl-vectorize/
  # rag-agent/form-agent — see ai_circus_shared.embeddings' GatewayEmbeddingProvider).
  # Routed to the `local-embed` custom provider registered below, which runs a
  # sentence-transformers model in-process (custom_handler.py) instead of each of
  # those three services carrying their own torch + sentence-transformers install.
  - model_name: local-embed
    litellm_params:
      model: local-embed/voyageai/voyage-4-nano

litellm_settings:
  # Reasoning models (GPT-5.x) reject parameters such as `temperature: 0`, which
  # assistant sends for its repeatable rubric/extraction calls — drop a parameter the
  # target provider doesn't support instead of failing the whole request with a 400.
  drop_params: true

  custom_provider_map:
    - provider: "local-embed"
      custom_handler: llm_gateway.custom_handler.local_embedding_llm

  # Per-tenant monthly spend budgets — a from-scratch, Valkey-backed alternative to
  # litellm's own DB-backed (Prisma) budget/virtual-key feature, which this repo's
  # Python 3.14 baseline can't use (see budget_hook.py's module docstring and
  # data_platform_manager.core.roadmap). An org with no cap configured (nothing
  # set via data-platform-manager's admin API) is unlimited — opt-in, not a
  # default ceiling on every tenant.
  #
  # GenAI observability is deliberately NOT listed here: app.py appends litellm's
  # built-in `langfuse_otel` callback to this list at start-up when (and only when)
  # LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY are set — see resolve_config_path() for why
  # an unconditional entry would be worse than none. Every completion then lands in the
  # platform's Langfuse (k8s/base/langfuse.yaml) as a trace carrying the calling
  # tenant (`user`) plus whatever `metadata` the agent services attach (scenario,
  # session/thread — see ai_circus_shared.observability.langfuse_request_metadata).
  callbacks:
    - llm_gateway.budget_hook.instance

  # Explicit fallback chains only — litellm has no implicit/automatic fallback
  # behavior, so a model_name absent here simply has none. Each entry maps one
  # primary model_name to an ordered list of model_names to retry, in order, on a
  # provider error/rate-limit/timeout. The caller-facing services (assistant/
  # rag-agent/form-agent) detect when the response's actual serving model differs
  # from the one requested and surface that to the end user — see
  # ai_circus_shared.entitlements' sibling note in each agent service's api.py
  # (ModelUsageCallback) rather than silently swapping models on the user.
  #
  # This default chain covers gemini-flash (the free-tier default active model —
  # see rag_agent/assistant/form_agent settings.yaml's LLM_MODEL) with two other
  # free-tier providers so a single provider outage doesn't stall every chat
  # scenario. Add further `<primary>: [<fallback>, ...]` entries here as needed —
  # nothing falls back unless it's listed.
  fallbacks:
    - gemini-flash: [groq-llama, claude-haiku]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Persistent spend-tracking (general_settings.database_url) is deliberately NOT
  # enabled: it requires litellm's `prisma` Python client, which needs a Node.js-based
  # `prisma generate` codegen step at build time that this image doesn't run. The
  # proxy still routes models and enforces the master key without it — a documented
  # follow-up (see root README "Reserved for later") to add the full prisma toolchain
  # if persistent spend history becomes a requirement.
