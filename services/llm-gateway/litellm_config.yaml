# litellm_config.yaml — model routing for the LiteLLM proxy (llm-gateway).
# Author: ai-circus-framework contributors
#
# Add/remove model_list entries to change what's available through the gateway's
# OpenAI-compatible API — every consumer (assistant, rag-agent, ui-react/CopilotKit)
# calls a `model_name` from this list, never a provider SDK directly. Provider API
# keys are read from the real environment via the `os.environ/<NAME>` syntax — see
# settings.yaml for which vars to set in .env.

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # Default free-tier pick: 2.5 Flash Lite is Gemini's cheapest/highest-quota model
  # (see https://ai.google.dev/gemini-api/docs/rate-limits — generous free-tier RPD),
  # so it's the model most likely to just work with no billing set up.
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GOOGLE_API_KEY

  # DeepSeek's own API (not a proxy of another provider) — cheap, OpenAI-compatible.
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

  # GroqCloud — free tier, LPU-hosted, very low latency.
  - model_name: groq-llama
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  # OpenRouter — one key routes to many vendors' models; pinned here to a model
  # OpenRouter currently serves free (":free" suffix) — swap for any OpenRouter
  # model string (see https://openrouter.ai/models) once you have paid credits.
  - model_name: openrouter
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  # Optional — unreachable (no default model selected) until an operator sets
  # AZURE_OPENAI_API_KEY/_BASE (see docker-compose.yml's llm-gateway env) and edits
  # `azure/<deployment>` below to match their actual Azure deployment name
  # (litellm's `os.environ/VAR` substitution only replaces a value that's *entirely*
  # that token, so the deployment name — which varies per Azure resource — can't be
  # env-substituted inside this prefixed string). ui-react's Settings page can only
  # report/test this one (see platform_registry/core/llm_settings.py's docstring
  # for why it can't apply a change here directly — no litellm DB mode).
  - model_name: azure-gpt4o
    litellm_params:
      model: azure/gpt-4o-mini # <- replace with your deployment name
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_base: os.environ/AZURE_OPENAI_API_BASE

  # Fully local/no-API-key option — routes to the `ollama` service in
  # docker-compose.yml. That service is OPTIONAL (profile "ollama", not started by
  # `docker compose up` by default — see docker-compose.yml) since it costs real
  # RAM/disk just sitting idle; start it explicitly with `make ollama-up` when you
  # want a no-API-key fallback. Its `ollama-pull` one-shot job pulls llama3.2:3b
  # (~2GB) on first start — 3B is the floor for usable answers in this stack's
  # assistant/rag-agent chat scenarios; the 1B tier answers too unreliably to be
  # worth bundling. Override OLLAMA_API_BASE in .env to point at an Ollama instance
  # you run yourself instead (any 3B+ model works).
  - model_name: llama3
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: os.environ/OLLAMA_API_BASE

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Persistent spend-tracking (general_settings.database_url) is deliberately NOT
  # enabled: it requires litellm's `prisma` Python client, which needs a Node.js-based
  # `prisma generate` codegen step at build time that this image doesn't run. The
  # proxy still routes models and enforces the master key without it — a documented
  # follow-up (see root README "Reserved for later") to add the full prisma toolchain
  # if persistent spend history becomes a requirement.
