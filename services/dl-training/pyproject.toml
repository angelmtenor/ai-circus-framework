# Project metadata and configuration for dl-training
# Author: ai-circus-framework contributors. Scaffolded from ai-circus-template.

[project]
name = "dl-training"
version = "0.1.0"
description = "ai-circus-framework dl-training service"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Angel Martinez-Tenor", email = "angelmtenor@gmail.com" }]
keywords = [
    "python",
    "packaging",
    "template",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "ai-circus-shared",
    "httpx>=0.28.1",
    "huggingface-hub>=1.0.0",
    "loguru>=0.7.3",
    "mlflow-skinny>=3.16.0",
    "numpy>=2.3.5",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
    "pillow>=12.3.0",
    "psutil>=7.0.0",
    "py-cpuinfo>=9.0.0",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.9.1",
    "PyYAML>=6.0.2",
    "safetensors>=0.6.0",
    "scikit-learn>=1.9.0",
    "tokenizers>=0.23.2",
    "transformers>=5.17.0",
]

[project.urls]
Homepage = "https://github.com/angelmtenor/ai-circus-framework/tree/main/services/dl-training"
Repository = "https://github.com/angelmtenor/ai-circus-framework"
BugTracker = "https://github.com/angelmtenor/ai-circus-framework/issues"

[dependency-groups]
dev = [
    "debugpy>=1.8.14",
    "deptry>=0.23.0",
    "packaging>=24.0",      # used directly by check_full_env.py
    "pre-commit>=4.2.0",
    "pyinstrument>=5.0.1",
    "pyrefly>=0.53.0",       # replaces pyright
    "python-dotenv>=1.0.1",  # used directly by check_full_env.py
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "rich>=13.7.0",          # optional pretty output for check_full_env.py
    "ruff>=0.11.8",
    "twine>=6.1.0",
]
# torch comes from exactly one of these two groups (never plain PyPI, whose default
# Linux wheel bundles ~3 GB of CUDA libraries): `cpu` is the default (Docker image,
# CI, `make check`), `gpu` is what `make dl-train-*` syncs on a host with an NVIDIA GPU
# (`uv sync --no-default-groups --group gpu`). See [tool.uv.sources] below.
cpu = ["torch>=2.14.0"]
gpu = ["torch>=2.14.0"]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ──────────────────────────────────────────────────────────────────────────────
#  Ruff
# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
preview = true
target-version = "py314"
line-length = 120
fix = true
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PGH", # pygrep-hooks
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "T10", # flake8-debugger
    "T20", # flake8-print
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "YTT", # flake8-2020
]
ignore = [
    "ANN401",  # Dynamically typed expressions
    "B007",    # Unused loop variable
    "B008",    # Function call in argument defaults
    "D105",    # Missing docstring in magic method
    "D203",    # Blank line before class docstring
    "D205",    # Blank line between summary and description
    "D212",    # Multi-line docstring summary
    "D415",    # First line punctuation
    "FBT001",  # Boolean flag in function
    "FBT002",  # Default Boolean flag
    "G004",    # f-string in log
    "PLR0913", # Too many arguments
    "S101",    # Use of assert detected
    "S404",    # Subprocess Usage
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D104", "F401"]
"tests/**" = ["S101", "D103", "D100", "D104", "SLF001", "B018"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

# ──────────────────────────────────────────────────────────────────────────────
#  Pyrefly (replaces pyright)
# ──────────────────────────────────────────────────────────────────────────────
[tool.pyrefly]
use-ignore-files = false
project-includes = ["src"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**/*",
    "**/tests",
]
search-path = ["src", ".venv/lib/python3.14/site-packages"]
python-platform = "linux"
python-version = "3.14"
python-interpreter-path = ".venv/bin/python3"

# ──────────────────────────────────────────────────────────────────────────────
#  Pytest
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
addopts = [
    "--cov=src",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-report=json",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "-ra",
    "-q",
]
testpaths = ["tests"]
python_files = "test_*.py tests_*.py *_test.py"
python_classes = "*Test Test* Describe*"
python_functions = "test_* it_* should_* scenario_*"

# ──────────────────────────────────────────────────────────────────────────────
#  Coverage
# ──────────────────────────────────────────────────────────────────────────────
[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]

# ──────────────────────────────────────────────────────────────────────────────
#  Deptry
# ──────────────────────────────────────────────────────────────────────────────
[tool.deptry]

[tool.uv.sources]
ai-circus-shared = { path = "../../libs/shared" }
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# ──────────────────────────────────────────────────────────────────────────────
#  Scripts
# ──────────────────────────────────────────────────────────────────────────────
[project.scripts]
dl-training-hello-world = "dl_training.tools.hello_world:main"
dl-training-generate-data-model = "dl_training.core.config_generator:main"
dl-training-config-drift-check = "dl_training.core.config_generator:check_env_drift"
dl-training-app = "dl_training.app:main"
dl-training = "dl_training.app:main"
dl-training-download = "dl_training.app:download_main"
