# settings.yaml
# Configuration file for environment variables required by the application
# Author: ai-circus-framework contributors
# Defines variable names, descriptions, types, constraints, and validation rules.
# Run 'make generate-data-model' after any change to sync data_model.py and .env.example.
#
# rag-agent is a long-running FastAPI service serving POST /chat/{scenario_slug} for
# every conversational_rag scenario in SCENARIOS (empty/unset = all): a LangChain
# tool-calling agent (see core/agent.py) decides whether the question needs
# retrieval — embedding it with the same model etl-vectorize used and pulling top-k
# chunks from the tenant's Qdrant collection — or can be answered directly (chitchat,
# off-topic), always via llm-gateway.

env_variables:
  - name: LOG_LEVEL
    description: "Application log level (TRACE, DEBUG, INFO, WARNING, ERROR, CRITICAL)"
    type: string
    mandatory: true
    secret: false

  - name: HTTP_PORT
    description: "Port the FastAPI app listens on"
    type: string
    mandatory: true
    secret: false

  - name: SCENARIOS
    description: "Comma-separated conversational_rag scenario slugs this instance serves; empty = every scenario"
    type: string
    mandatory: true
    secret: false

  - name: SCENARIOS_DIR
    description: "Path to the scenarios/ directory (one subdirectory per scenario.yaml)"
    type: string
    mandatory: true
    secret: false

  - name: QDRANT_URL
    description: "Qdrant endpoint URL (docker service name in-container, *.localhost via Traefik for local dev)"
    type: string
    mandatory: true
    secret: false

  - name: LLM_GATEWAY_URL
    description: "Base URL of the llm-gateway service's OpenAI-compatible API"
    type: string
    mandatory: true
    secret: false

  - name: LLM_GATEWAY_API_KEY
    description: "API key presented to llm-gateway (its LITELLM_MASTER_KEY)"
    type: string
    mandatory: true
    secret: true

  - name: LLM_MODEL
    description: "Model name to request from llm-gateway (must be in its litellm_config.yaml model_list)"
    type: string
    mandatory: true
    secret: false

  - name: PLATFORM_REGISTRY_URL
    description: "Base URL of the platform-registry service's entitlement-check API"
    type: string
    mandatory: true
    secret: false

  - name: AUTH_DISABLED
    description: "DEV ONLY: skip token/entitlement checks. Must be false beyond local iteration."
    type: string
    mandatory: true
    secret: false

  - name: CORS_ALLOWED_ORIGINS
    description: "Comma-separated origins ui-react is allowed to call this API from (never '*' beyond local dev)"
    type: string
    mandatory: true
    secret: false

  - name: ADMIN_API_KEY
    description: "Shared admin bearer token — resolves to the 'admin' org, entitled to every scenario"
    type: string
    mandatory: true
    secret: true

  - name: ENGINEERING_DEMO_API_KEY
    description: "Optional shared demo bearer token — resolves to the 'engineering-demo' org, entitled to only mpm/electric_motor/energy_building"
    type: string
    mandatory: false
    secret: true

  - name: DEV_ORG_ID
    description: "Org id used for every request when AUTH_DISABLED=true"
    type: string
    mandatory: true
    secret: false

  - name: LOGTO_ISSUER
    description: "Logto OIDC issuer, e.g. http://logto.localhost/oidc (required unless AUTH_DISABLED=true)"
    type: string
    mandatory: false
    secret: false

  - name: LOGTO_JWKS_URL
    description: "Logto JWKS endpoint, e.g. http://logto.localhost/oidc/jwks (required unless AUTH_DISABLED=true)"
    type: string
    mandatory: false
    secret: false

  - name: LOGTO_API_RESOURCE_INDICATOR
    description: "Expected token audience — the API resource registered in Logto for this platform's backend"
    type: string
    mandatory: false
    secret: false

# Optional global settings
global_settings:
  env_file: ".env"          # Default location for environment variable file
  fail_on_missing: true     # Stop execution if mandatory variables are missing
  case_sensitive: true      # Enforce case sensitivity for variable names

# Per-environment non-secret overrides.
# Secrets MUST never appear here — use .env (local) or CI/CD secret injection (cloud).
# APP_ENVIRONMENT selects the active profile (default: local).
environments:
  base:
    LOG_LEVEL: "INFO"
    HTTP_PORT: "8000"
    DEV_ORG_ID: "demo"
    # Empty = every conversational_rag scenario under SCENARIOS_DIR — see
    # prediction/settings.yaml's "Consolidation mechanism" comment for why a yaml
    # default is safe here but not for AUTH_DISABLED/ADMIN_API_KEY below.
    SCENARIOS: ""
    # AUTH_DISABLED/ADMIN_API_KEY/LLM_MODEL/CORS_ALLOWED_ORIGINS deliberately have NO default here — see
    # prediction/settings.yaml for why (a profile default would always beat a real
    # environment variable — docker-compose.yml's LLM_MODEL default is what actually
    # applies, and is meant to be swapped per-deployment without a rebuild).

  # Running with `uv run` on the host, against infra started via `make up-infra`.
  local:
    SCENARIOS_DIR: "../../scenarios"
    # Loopback-bound host ports (not Traefik — see root docker-compose.yml's qdrant/
    # llm-gateway comments for why neither belongs on the public entrypoint).
    QDRANT_URL: "http://localhost:6333"
    LLM_GATEWAY_URL: "http://localhost:4000"
    PLATFORM_REGISTRY_URL: "http://localhost:8010"

  # Running as a container inside docker-compose's `ai-circus` network.
  docker:
    SCENARIOS_DIR: "/app/scenarios"
    QDRANT_URL: "http://qdrant:6333"
    LLM_GATEWAY_URL: "http://llm-gateway:4000"
    PLATFORM_REGISTRY_URL: "http://platform-registry:8000"

  staging: {}
    # Staging environment profile — overrides go here

  production: {}
    # Production environment profile — overrides go here
