server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        http: {endpoint: "0.0.0.0:4318"}
ingester:
  max_block_duration: 5m
storage:
  trace:
    backend: local
    local: {path: /var/tempo/traces}
    wal: {path: /var/tempo/wal}
compactor:
  compaction:
    block_retention: 24h
usage_report:
  reporting_enabled: false
