# Grafana at http://grafana.localhost: the three datasources wired together (metrics, Tempo traces <-> Loki
# logs by trace_id) and the framework's dashboards in folder "AI Circus". Anonymous visitors are Viewers;
# the admin password comes from Secret `grafana-admin` (`make k3s-obs-up` generates it — never committed).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          env:
            - {name: GF_SERVER_ROOT_URL, value: "http://grafana.localhost"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: "/var/lib/grafana/dashboards/llm-gateway.json"}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana-admin, key: password}}
          ports:
            - {containerPort: 3000}
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          startupProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 256Mi}
        - name: datasources
          configMap: {name: grafana-provisioning-datasources}
        - name: dashboard-provider
          configMap: {name: grafana-provisioning-dashboards}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  selector: {app: grafana}
  ports:
    - {port: 3000, targetPort: 3000}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: observability
spec:
  entryPoints: [web]
  routes:
    - match: Host(`grafana.localhost`)
      kind: Rule
      services:
        - {name: grafana, port: 3000}
