# One-shot: `kubectl apply -f k8s/jobs/training-job.yaml` (see `make k3s-pipeline`),
# run after etl-tabular-job completes. Mirrors docker-compose.yml's training service.
apiVersion: batch/v1
kind: Job
metadata:
  name: training
  namespace: ai-circus
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # matches the 'app' user every services/*/Dockerfile creates via useradd
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: training
          image: ai-circus/training:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          # Mirrors docker-compose.yml's mem_limit (and core/k8s_jobs.py in
          # data-platform-manager, which builds this same Job — tests keep them equal).
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 2Gi}
          envFrom:
            - configMapRef: {name: shared-config}
            - secretRef: {name: training-secrets}
          env:
            # Renamed from .env's LITELLM_MASTER_KEY — only used to verify/fill the text
            # challenger's embedding cache (llm-gateway's `local-embed`).
            - {name: LLM_GATEWAY_API_KEY, valueFrom: {secretKeyRef: {name: training-secrets, key: LITELLM_MASTER_KEY}}}
          volumeMounts:
            - {name: scenarios, mountPath: /app/scenarios, readOnly: true}
      volumes:
        - name: scenarios
          hostPath: {path: /scenarios, type: Directory}
