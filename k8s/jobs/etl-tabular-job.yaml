# One-shot: `kubectl apply -f k8s/jobs/etl-tabular-job.yaml` (see `make k3s-pipeline`).
# Mirrors docker-compose.yml's etl-tabular service (its `pipeline` profile). Delete and
# reapply to re-run — Jobs don't restart on their own once Complete.
apiVersion: batch/v1
kind: Job
metadata:
  name: etl-tabular
  namespace: ai-circus
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # matches the 'app' user every services/*/Dockerfile creates via useradd
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: etl-tabular
          image: ai-circus/etl-tabular:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          # Mirrors docker-compose.yml's mem_limit (and core/k8s_jobs.py in
          # data-platform-manager, which builds this same Job — tests keep them equal).
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          envFrom:
            - configMapRef: {name: shared-config}
            - secretRef: {name: etl-tabular-secrets}
          volumeMounts:
            - {name: scenarios, mountPath: /app/scenarios, readOnly: true}
      volumes:
        - name: scenarios
          hostPath: {path: /scenarios, type: Directory}
