# MLflow tracking server — the platform's MLOps monitor. Mirrors docker-compose.yml's
# mlflow service; image built from infra/mlflow/Dockerfile by `make k3s-build`.
#
# Langfuse (langfuse.yaml) only understands LLM traces, so tabular-ML runs get their
# own, purpose-built tracker: every `training` Job (k8s/jobs/training-job.yaml) logs
# one MLflow run per tenant x scenario — the candidates it evaluated, their scores,
# the selected model and the metadata.json it published — whenever
# MLFLOW_TRACKING_URI (shared-config, configmap.yaml) is set. Training's real
# artifacts still live in SeaweedFS under the tenant prefix (ai_circus_shared.
# tabular_ml); MLflow is an audit/monitoring mirror, never what `prediction` serves.
#
# Stateless like everything else here: run metadata in the shared Postgres (`mlflow`
# database), artifacts in SeaweedFS (bucket `mlflow`, proxied by the server so no
# client ever holds S3 credentials). MLflow has no authentication of its own, so the
# route is behind the same admin-basicauth Middleware as the Keycloak/SeaweedFS consoles.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ai-circus
spec:
  replicas: 1
  strategy: {type: Recreate}  # runs its Alembic migrations on start — never two at once
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # the 'app' user infra/mlflow/Dockerfile creates
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Same create-if-missing as langfuse.yaml: a Postgres volume created before this
        # service existed never re-runs infra/postgres/init-multiple-databases.sh.
        - name: ensure-database
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 70  # the postgres:alpine image's own unprivileged user
          env:
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: mlflow-secrets, key: POSTGRES_USER}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: mlflow-secrets, key: POSTGRES_PASSWORD}}
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h postgres -q; do echo "waiting for postgres"; sleep 2; done
              if [ "$(psql -h postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='mlflow'")" != "1" ]; then
                psql -h postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mlflow' -c "GRANT ALL PRIVILEGES ON DATABASE mlflow TO \"$PGUSER\""
              fi
        # SeaweedFS (3.97) accepts a PutObject into a bucket that was never created and
        # even lists it afterwards, but its bucket registry never learns about it, so
        # every later GetObject 404s with NoSuchBucket — found the hard way: Langfuse's
        # worker could not read back the OTel events its web pod had just uploaded.
        # Only an explicit CreateBucket registers it (which is what every services/*
        # image does via ai_circus_shared.storage.ObjectStore.connect); neither Langfuse
        # nor MLflow does, hence this idempotent PUT-bucket (200 created / 409 exists)
        # with curl's built-in SigV4 — no S3 CLI image needed.
        - name: ensure-bucket
          image: curlimages/curl:8.12.1
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 100  # the curl image's own unprivileged user
          env:
            - name: OBJECT_STORE_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: mlflow-secrets, key: OBJECT_STORE_ACCESS_KEY}}
            - name: OBJECT_STORE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: mlflow-secrets, key: OBJECT_STORE_SECRET_KEY}}
          command: ["sh", "-c"]
          args:
            - |
              until curl -sf -o /dev/null http://seaweedfs:8888/; do echo "waiting for seaweedfs"; sleep 2; done
              code=$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 "aws:amz:us-east-1:s3" \
                --user "$OBJECT_STORE_ACCESS_KEY:$OBJECT_STORE_SECRET_KEY" -X PUT "http://seaweedfs:8333/mlflow")
              case "$code" in 200|409) echo "bucket mlflow ready ($code)";; *) echo "bucket mlflow: HTTP $code"; exit 1;; esac
      containers:
        - name: mlflow
          image: ai-circus/mlflow:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports:
            - {containerPort: 5000}
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: mlflow-secrets, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: mlflow-secrets, key: POSTGRES_PASSWORD}}
            - {name: MLFLOW_BACKEND_STORE_URI, value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/mlflow"}
            - {name: MLFLOW_ARTIFACTS_DESTINATION, value: "s3://mlflow"}
            # MLflow >= 3 rejects any Host header outside localhost/private IPs (DNS-rebinding
            # guard) — allow the Traefik hostname, the in-cluster Service name and the
            # pod-network ranges the probes use. Its CORS guard has the same "localhost
            # only" default, and the UI's own POSTs (runs/search, traces/search, ...) carry
            # `Origin: http://mlflow.localhost`, so without this the UI shows every list as
            # "internal error" (403s in the server log) while the plain GETs still work.
            - {name: MLFLOW_SERVER_ALLOWED_HOSTS, value: "mlflow.localhost,mlflow,mlflow:5000,localhost,127.0.0.1,10.*,172.*,192.168.*"}
            - {name: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS, value: "http://mlflow.localhost"}
            - {name: MLFLOW_S3_ENDPOINT_URL, value: "http://seaweedfs:8333"}
            - {name: AWS_DEFAULT_REGION, value: "us-east-1"}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: mlflow-secrets, key: OBJECT_STORE_ACCESS_KEY}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: mlflow-secrets, key: OBJECT_STORE_SECRET_KEY}}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {memory: "256Mi", cpu: "50m"}
            limits: {memory: "768Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ai-circus
spec:
  selector: {app: mlflow}
  ports:
    - {port: 5000, targetPort: 5000}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mlflow
  namespace: ai-circus
spec:
  entryPoints: [web]
  routes:
    - match: Host(`mlflow.localhost`)
      kind: Rule
      services:
        - {name: mlflow, port: 5000}
      middlewares:
        - name: admin-basicauth
