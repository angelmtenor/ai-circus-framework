# Mirrors docker-compose.yml's qdrant service. Internal-only (no IngressRoute) — same
# reasoning as compose's loopback-only port: Qdrant has no built-in auth, so it must
# never gain a public route (would let anyone bypass rag-agent/form-agent's
# entitlement checks and per-tenant collection naming).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: ai-circus
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: {app: qdrant}
  template:
    metadata:
      labels: {app: qdrant}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.0
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - {containerPort: 6333}
          volumeMounts:
            - {name: qdrant-storage, mountPath: /qdrant/storage}
          readinessProbe:
            tcpSocket: {port: 6333}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 6333}
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: {name: qdrant-storage}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: ai-circus
spec:
  selector: {app: qdrant}
  ports:
    - {port: 6333, targetPort: 6333}
---
# Qdrant has no built-in auth at all (see comment above) — a NetworkPolicy is the only
# thing standing between it and any other pod in the namespace. Only rag-agent and
# form-agent query it at request time, and etl-vectorize (see k8s/jobs/) writes to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant
  namespace: ai-circus
spec:
  podSelector:
    matchLabels: {app: qdrant}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: rag-agent}}
        - podSelector: {matchLabels: {app: form-agent}}
        - podSelector: {matchLabels: {job-name: etl-vectorize}}
      ports:
        - {protocol: TCP, port: 6333}
