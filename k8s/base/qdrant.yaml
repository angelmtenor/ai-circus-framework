# Mirrors docker-compose.yml's qdrant service. Internal-only (no IngressRoute) — same
# reasoning as compose's loopback-only port: Qdrant has no built-in auth, so it must
# never gain a public route (would let anyone bypass rag-agent/form-agent's
# entitlement checks and per-tenant collection naming).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: ai-circus
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: {app: qdrant}
  template:
    metadata:
      labels: {app: qdrant}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.0
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - {containerPort: 6333}
          env:
            # Qdrant otherwise sizes every collection to the node's CPU count (8 segments on a
            # 16-core laptop), and each segment holds ~15 MiB of its own buffers however few
            # points it has: 6 collections of a few hundred chunks cost ~750 MiB. One segment
            # per collection is plenty at this scale. etl-vectorize recreates collections on
            # every run, so this server default covers them.
            - {name: QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER, value: "1"}
            # Worker/search pools also default to the CPU count.
            - {name: QDRANT__SERVICE__MAX_WORKERS, value: "2"}
            - {name: QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS, value: "2"}
          volumeMounts:
            - {name: qdrant-storage, mountPath: /qdrant/storage}
          # Grows by a few MiB per collection (one segment each, see env above).
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 384Mi}  # ~150 MiB peak re-indexing every collection
          readinessProbe:
            tcpSocket: {port: 6333}
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            tcpSocket: {port: 6333}
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: {name: qdrant-storage}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: ai-circus
spec:
  selector: {app: qdrant}
  ports:
    - {port: 6333, targetPort: 6333}
---
# Qdrant has no built-in auth at all (see comment above) — a NetworkPolicy is the only
# thing standing between it and any other pod in the namespace. Only rag-agent,
# form-agent and assistant (a tabular scenario's `documents.tool`) query it at request
# time, and etl-vectorize (see k8s/jobs/) writes to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant
  namespace: ai-circus
spec:
  podSelector:
    matchLabels: {app: qdrant}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: rag-agent}}
        - podSelector: {matchLabels: {app: form-agent}}
        - podSelector: {matchLabels: {app: assistant}}
        - podSelector: {matchLabels: {job-name: etl-vectorize}}
        # Read-only /healthz probe for the admin platform-status dashboard
        # (data_platform_manager.core.platform_status) — nothing else.
        - podSelector: {matchLabels: {app: data-platform-manager}}
      ports:
        - {protocol: TCP, port: 6333}
