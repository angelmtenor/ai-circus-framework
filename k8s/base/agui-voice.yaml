# Mirrors docker-compose.yml's agui-voice service. Persistent voice-model-cache PVC
# (a plain Deployment+PVC, not a StatefulSet — this is a single-instance cache, not
# per-replica state) keeps faster-whisper/Piper model weights across pod restarts,
# same purpose as compose's voice-model-cache volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voice-model-cache
  namespace: ai-circus
spec:
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agui-voice
  namespace: ai-circus
spec:
  replicas: 1
  selector:
    matchLabels: {app: agui-voice}
  template:
    metadata:
      labels: {app: agui-voice}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # matches the 'app' user every services/*/Dockerfile creates via useradd
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # The local-path PVC isn't fsGroup-managed, and caches written while this image
        # still ran as root are root-owned — hand them to UID 1000 before the app starts.
        # A no-op (milliseconds) once ownership is already right.
        - name: cache-ownership
          image: ai-circus/agui-voice:local  # same image: coreutils' chown, nothing extra to pull
          imagePullPolicy: Never
          command: ["chown", "-R", "1000:1000", "/cache"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"], add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: voice-model-cache, mountPath: /cache}
      containers:
        - name: agui-voice
          image: ai-circus/agui-voice:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports:
            - {containerPort: 8000}
          envFrom:
            - configMapRef: {name: shared-config}
            - secretRef: {name: agui-voice-secrets}
          env:
            # Renamed from .env's VOICE_* vars — local, self-hosted defaults
            # (faster-whisper/Piper, no API key). DEEPGRAM_API_KEY/ELEVENLABS_*/
            # CARTESIA_* keep their .env names, so they flow through envFrom above
            # unchanged when overriding to a hosted provider.
            - {name: STT_PROVIDER, valueFrom: {secretKeyRef: {name: agui-voice-secrets, key: VOICE_STT_PROVIDER}}}
            - {name: TTS_PROVIDER, valueFrom: {secretKeyRef: {name: agui-voice-secrets, key: VOICE_TTS_PROVIDER}}}
            - {name: WHISPER_MODEL, valueFrom: {secretKeyRef: {name: agui-voice-secrets, key: VOICE_WHISPER_MODEL}}}
            - {name: PIPER_VOICE_ID, valueFrom: {secretKeyRef: {name: agui-voice-secrets, key: VOICE_PIPER_VOICE_ID}}}
            - {name: PIPER_VOICE_ID_ES, valueFrom: {secretKeyRef: {name: agui-voice-secrets, key: VOICE_PIPER_VOICE_ID_ES}}}
          volumeMounts:
            # faster-whisper caches under ~/.cache/huggingface, Piper under ~/.cache/pipecat.
            - {name: voice-model-cache, mountPath: /home/app/.cache}
          # ~830Mi with faster-whisper + Piper loaded.
          resources:
            requests: {cpu: 50m, memory: 512Mi}
            limits: {memory: 2Gi}
          # startupProbe gates the other two until the app first answers, polled every 2s
          # (Ready ~2s after start-up completes instead of after a fixed initialDelay),
          # with a 180s budget — above the 120s the app itself waits for Postgres/
          # SeaweedFS/llm-gateway (ai_circus_shared.startup), so a slow cold boot is never
          # liveness-killed mid-start.
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: voice-model-cache
          persistentVolumeClaim: {claimName: voice-model-cache}
---
apiVersion: v1
kind: Service
metadata:
  name: agui-voice
  namespace: ai-circus
spec:
  selector: {app: agui-voice}
  ports:
    - {port: 8000, targetPort: 8000}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: agui-voice
  namespace: ai-circus
spec:
  entryPoints: [web]
  routes:
    - match: Host(`agui-voice.localhost`)
      kind: Rule
      services:
        - {name: agui-voice, port: 8000}
