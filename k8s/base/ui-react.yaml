# Mirrors docker-compose.yml's ui-react service. No runtime env vars — backend base
# URLs are baked in at `docker build` time via VITE_* build args, defaulting to the
# same *.localhost hostnames this cluster's Traefik also serves, so the image built
# for docker-compose works here unchanged (see k8s/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-react
  namespace: ai-circus
spec:
  replicas: 1
  selector:
    matchLabels: {app: ui-react}
  template:
    metadata:
      labels: {app: ui-react}
    spec:
      containers:
        - name: ui-react
          image: ai-circus/ui-react:local
          imagePullPolicy: Never
          ports:
            - {containerPort: 80}
          readinessProbe:
            tcpSocket: {port: 80}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 80}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ui-react
  namespace: ai-circus
spec:
  selector: {app: ui-react}
  ports:
    - {port: 80, targetPort: 80}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ui-react
  namespace: ai-circus
spec:
  entryPoints: [web]
  routes:
    - match: Host(`aiopen.localhost`)
      kind: Rule
      services:
        - {name: ui-react, port: 80}
