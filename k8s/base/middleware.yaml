# Basic Auth gate shared by keycloak-admin (see keycloak.yaml) and the SeaweedFS console
# (see seaweedfs.yaml) — the k8s equivalent of docker-compose.yml's admin-basicauth
# Traefik label, reading the same infra/traefik/console.htpasswd content. The
# `traefik-basicauth` Secret is created by `make k3s-secrets` from that file
# (scripts/k3s_generate_secrets.sh), never committed here.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-basicauth
  namespace: ai-circus
spec:
  basicAuth:
    secret: traefik-basicauth
