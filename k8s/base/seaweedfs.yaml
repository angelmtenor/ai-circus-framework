# Mirrors docker-compose.yml's seaweedfs service — all-in-one `weed server`
# (master+volume+filer+S3 gateway). S3 credentials come from the mounted s3.json
# identities file (Secret `seaweedfs-s3-config`, created by `make k3s-secrets` from
# infra/seaweedfs/s3.json — see scripts/generate_seaweedfs_s3_config.sh), not env vars.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: ai-circus
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels: {app: seaweedfs}
  template:
    metadata:
      labels: {app: seaweedfs}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.97
          securityContext:
            allowPrivilegeEscalation: false
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
          ports:
            - {containerPort: 8333, name: s3}
            - {containerPort: 8888, name: filer-console}
          volumeMounts:
            - {name: seaweedfs-data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/seaweedfs/s3.json, subPath: s3.json, readOnly: true}
          readinessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: s3-config
          secret: {secretName: seaweedfs-s3-config}
  volumeClaimTemplates:
    - metadata: {name: seaweedfs-data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: ai-circus
spec:
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}
    - {name: filer-console, port: 8888, targetPort: 8888}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seaweedfs
  namespace: ai-circus
spec:
  entryPoints: [web]
  routes:
    # Deliberately NOT gated: no in-cluster pod reaches the S3 API via this route
    # (they all use OBJECT_STORE_ENDPOINT=http://seaweedfs:8333 over the cluster
    # network) — this route exists only for local, non-cluster tooling to reach it as
    # objectstore.localhost, and Basic Auth would break that (S3 clients don't send
    # it). Same reasoning as docker-compose.yml's seaweedfs-s3 router.
    - match: Host(`objectstore.localhost`)
      kind: Rule
      services:
        - {name: seaweedfs, port: 8333}
    - match: Host(`console.objectstore.localhost`)
      kind: Rule
      services:
        - {name: seaweedfs, port: 8888}
      middlewares:
        - name: admin-basicauth
