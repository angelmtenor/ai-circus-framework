# Non-secret config shared across every backend pod via envFrom — safe to share broadly
# since none of it is sensitive. Secrets (POSTGRES_*, ADMIN_API_KEY, OBJECT_STORE_*,
# KEYCLOAK_*, provider keys, LITELLM_MASTER_KEY, ...) come from per-workload Secrets
# instead (e.g. `prediction-secrets`, `rag-agent-secrets`), each scoped to only the
# keys that workload needs — generated from the single `.env` file by `make k3s-secrets`
# (see scripts/k3s_generate_secrets.sh) so no credential is handed to a pod that has no
# reason to hold it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-config
  namespace: ai-circus
data:
  APP_ENVIRONMENT: "docker"
  DEPLOYMENT_TARGET: "local"
  CORS_ALLOWED_ORIGINS: "http://aiopen.localhost"
  # Internal k8s Service DNS, not *.localhost — same reasoning as docker-compose.yml's
  # identical hardcoded value: *.localhost resolves to loopback inside a pod's own
  # network namespace, not to the keycloak Service.
  KEYCLOAK_JWKS_URL: "http://keycloak:8080/realms/ai-circus/protocol/openid-connect/certs"
  EMBEDDING_PROVIDER: "local"
  LLM_MODEL: "groq-llama"
  OLLAMA_API_BASE: "http://ollama:11434"
