# Mirrors docker-compose.yml's form-agent service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: form-agent
  namespace: ai-circus
spec:
  replicas: 1
  selector:
    matchLabels: {app: form-agent}
  template:
    metadata:
      labels: {app: form-agent}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # matches the 'app' user every services/*/Dockerfile creates via useradd
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: form-agent
          image: ai-circus/form-agent:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports:
            - {containerPort: 8000}
          envFrom:
            - configMapRef: {name: shared-config}
            - secretRef: {name: form-agent-secrets}
          env:
            # Renamed from .env's LITELLM_MASTER_KEY.
            - {name: LLM_GATEWAY_API_KEY, valueFrom: {secretKeyRef: {name: form-agent-secrets, key: LITELLM_MASTER_KEY}}}
          volumeMounts:
            - {name: scenarios, mountPath: /app/scenarios, readOnly: true}
          # initialDelaySeconds/timeoutSeconds/failureThreshold are looser than a plain FastAPI
          # healthz would need: startup makes a live httpx call to llm-gateway (embedding
          # dimension probe), which queues behind every other scenario-service doing the same
          # thing on a single-node k3d cluster — the default 1s timeoutSeconds flakes under that
          # concurrent cold-start load.
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: scenarios
          hostPath: {path: /scenarios, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: form-agent
  namespace: ai-circus
spec:
  selector: {app: form-agent}
  ports:
    - {port: 8000, targetPort: 8000}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: form-agent
  namespace: ai-circus
spec:
  entryPoints: [web]
  routes:
    - match: Host(`form-agent.localhost`)
      kind: Rule
      services:
        - {name: form-agent, port: 8000}
