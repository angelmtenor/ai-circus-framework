# Mirrors docker-compose.yml's prediction service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction
  namespace: ai-circus
spec:
  replicas: 1
  selector:
    matchLabels: {app: prediction}
  template:
    metadata:
      labels: {app: prediction}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # matches the 'app' user every services/*/Dockerfile creates via useradd
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prediction
          image: ai-circus/prediction:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports:
            - {containerPort: 8000}
          envFrom:
            - configMapRef: {name: shared-config}
            - secretRef: {name: prediction-secrets}
          volumeMounts:
            - {name: scenarios, mountPath: /app/scenarios, readOnly: true}
          # Idle ~200Mi; grows with each loaded model (shared across tenants) + SHAP batches.
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          # startupProbe gates the other two until the app first answers, polled every 2s
          # (Ready ~2s after start-up completes instead of after a fixed initialDelay),
          # with a 180s budget — above the 120s the app itself waits for Postgres/
          # SeaweedFS/llm-gateway (ai_circus_shared.startup), so a slow cold boot is never
          # liveness-killed mid-start.
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: scenarios
          hostPath: {path: /scenarios, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: prediction
  namespace: ai-circus
spec:
  selector: {app: prediction}
  ports:
    - {port: 8000, targetPort: 8000}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prediction
  namespace: ai-circus
spec:
  entryPoints: [web]
  routes:
    - match: Host(`prediction.localhost`)
      kind: Rule
      services:
        - {name: prediction, port: 8000}
