# Mirrors docker-compose.yml's prediction service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction
  namespace: ai-circus
spec:
  replicas: 1
  selector:
    matchLabels: {app: prediction}
  template:
    metadata:
      labels: {app: prediction}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # matches the 'app' user every services/*/Dockerfile creates via useradd
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prediction
          image: ai-circus/prediction:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports:
            - {containerPort: 8000}
          envFrom:
            - configMapRef: {name: shared-config}
            - secretRef: {name: prediction-secrets}
          volumeMounts:
            - {name: scenarios, mountPath: /app/scenarios, readOnly: true}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: scenarios
          hostPath: {path: /scenarios, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: prediction
  namespace: ai-circus
spec:
  selector: {app: prediction}
  ports:
    - {port: 8000, targetPort: 8000}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prediction
  namespace: ai-circus
spec:
  entryPoints: [web]
  routes:
    - match: Host(`prediction.localhost`)
      kind: Rule
      services:
        - {name: prediction, port: 8000}
