# Mirrors docker-compose.yml's platform-registry service. Internal-only (no
# IngressRoute) — same as its loopback-only compose port; only other pods call its
# entitlement-check API (see AGENTS.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-registry
  namespace: ai-circus
spec:
  replicas: 1
  selector:
    matchLabels: {app: platform-registry}
  template:
    metadata:
      labels: {app: platform-registry}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # matches the 'app' user every services/*/Dockerfile creates via useradd
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: platform-registry
          image: ai-circus/platform-registry:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports:
            - {containerPort: 8000}
          envFrom:
            - configMapRef: {name: shared-config}
            - secretRef: {name: platform-registry-secrets}
          env:
            - {name: LOG_LEVEL, value: "INFO"}
            # Renamed from .env's LITELLM_MASTER_KEY — backs the admin-only
            # /llm-settings/* endpoints (see platform_registry/core/llm_settings.py).
            - {name: LLM_GATEWAY_API_KEY, valueFrom: {secretKeyRef: {name: platform-registry-secrets, key: LITELLM_MASTER_KEY}}}
          volumeMounts:
            - {name: scenarios, mountPath: /app/scenarios, readOnly: true}
          # Idle ~120Mi; headroom for PDF OCR (one rendered page at a time, see document_extraction.py).
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 512Mi}
          # startupProbe gates the other two until the app first answers, polled every 2s
          # (Ready ~2s after start-up completes instead of after a fixed initialDelay),
          # with a 180s budget — above the 120s the app itself waits for Postgres/
          # SeaweedFS/llm-gateway (ai_circus_shared.startup), so a slow cold boot is never
          # liveness-killed mid-start.
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: scenarios
          hostPath: {path: /scenarios, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-registry
  namespace: ai-circus
spec:
  selector: {app: platform-registry}
  ports:
    - {port: 8000, targetPort: 8000}
