# Mirrors docker-compose.yml's llm-gateway service. Internal-only (no IngressRoute) —
# same reasoning as its loopback-only compose port: only assistant/rag-agent/
# platform-registry call it, over the cluster network, and its OpenAI-compatible
# endpoint is gated only by a single shared key with no rate limiting.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: ai-circus
spec:
  replicas: 1
  selector:
    matchLabels: {app: llm-gateway}
  template:
    metadata:
      labels: {app: llm-gateway}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # matches the 'app' user every services/*/Dockerfile creates via useradd
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: llm-gateway
          image: ai-circus/llm-gateway:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports:
            - {containerPort: 4000}
          envFrom:
            - configMapRef: {name: shared-config}
            - secretRef: {name: llm-gateway-secrets}
          # Idle ~870Mi: LiteLLM proxy + the local-embed torch model once first used.
          resources:
            requests: {cpu: 50m, memory: 768Mi}
            limits: {memory: 1536Mi}
          # startupProbe gates the other two until the app first answers, polled every 2s
          # (Ready ~2s after start-up completes instead of after a fixed initialDelay),
          # with a 180s budget — above the 120s the app itself waits for Postgres/
          # SeaweedFS/llm-gateway (ai_circus_shared.startup), so a slow cold boot is never
          # liveness-killed mid-start.
          startupProbe:
            httpGet: {path: /health/liveliness, port: 4000}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health/liveliness, port: 4000}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/liveliness, port: 4000}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: ai-circus
spec:
  selector: {app: llm-gateway}
  ports:
    - {port: 4000, targetPort: 4000}
