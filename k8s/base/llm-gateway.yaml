# Mirrors docker-compose.yml's llm-gateway service. Internal-only (no IngressRoute) —
# same reasoning as its loopback-only compose port: only assistant/rag-agent/
# platform-registry call it, over the cluster network, and its OpenAI-compatible
# endpoint is gated only by a single shared key with no rate limiting.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: ai-circus
spec:
  replicas: 1
  selector:
    matchLabels: {app: llm-gateway}
  template:
    metadata:
      labels: {app: llm-gateway}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # matches the 'app' user every services/*/Dockerfile creates via useradd
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: llm-gateway
          image: ai-circus/llm-gateway:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports:
            - {containerPort: 4000}
          envFrom:
            - configMapRef: {name: shared-config}
            - secretRef: {name: llm-gateway-secrets}
          # LiteLLM's proxy doesn't expose the same /healthz FastAPI wrapper the other
          # services do (root Makefile's wait-services/verify don't probe it either,
          # since it's internal-only) — a TCP check is the only thing safe to assume.
          # LiteLLM's own startup (registering every model in litellm_config.yaml) takes
          # ~30-40s and queues behind every other scenario service doing the same kind of
          # cold-start work on a single-node k3d cluster — loosened the same way
          # rag-agent/form-agent's probes are, see their manifests' comments.
          readinessProbe:
            tcpSocket: {port: 4000}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket: {port: 4000}
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: ai-circus
spec:
  selector: {app: llm-gateway}
  ports:
    - {port: 4000, targetPort: 4000}
