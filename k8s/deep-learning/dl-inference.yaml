# Mirrors docker-compose.yml's dl-inference service (profile: deep-learning).
# onnxruntime only (no torch): the int8 BioClinical ModernBERT (~150 MB) + ConvNeXt V2
# nano (~60 MB) sessions plus runtime settle around 550-700 MB RSS, loaded lazily on
# the first request per scenario — hence the 1Gi limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dl-inference
  namespace: ai-circus
spec:
  replicas: 1
  selector:
    matchLabels: {app: dl-inference}
  template:
    metadata:
      labels: {app: dl-inference}
      # Platform observability contract (ADR 0015): scrape /metrics.
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # matches the 'app' user every services/*/Dockerfile creates via useradd
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dl-inference
          image: ai-circus/dl-inference:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports:
            - {containerPort: 8000}
          envFrom:
            - configMapRef: {name: shared-config}
            - secretRef: {name: dl-inference-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            # The anomaly detector's kNN over its 16k-patch memory bank needs ~300 MB of
            # onnxruntime arena, and symptom_triage's fp32 model ~600 MB (twice while it
            # loads: the bytes and the session), which OOM-killed the pod at 1536Mi.
            limits: {cpu: "4", memory: 3Gi}
          volumeMounts:
            - {name: scenarios, mountPath: /app/scenarios, readOnly: true}
          # startupProbe gates the other two until the app first answers, polled every 2s
          # (Ready ~2s after start-up completes instead of after a fixed initialDelay),
          # with a 180s budget — above the 120s the app itself waits for Postgres/
          # SeaweedFS/llm-gateway (ai_circus_shared.startup), so a slow cold boot is never
          # liveness-killed mid-start.
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: scenarios
          hostPath: {path: /scenarios, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: dl-inference
  namespace: ai-circus
spec:
  selector: {app: dl-inference}
  ports:
    - {port: 8000, targetPort: 8000}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dl-inference
  namespace: ai-circus
spec:
  entryPoints: [web]
  routes:
    - match: Host(`dl-inference.localhost`)
      kind: Rule
      services:
        - {name: dl-inference, port: 8000}
