# The MCP server kit (docs/adr/0022): what every MCP server in front of an API needs — token validation,
# the access policy, the per-API token exchange, a tool context that never exposes a token, audit lines —
# so a server's own code is its tools only. A local uv path dependency of each MCP server
# (`mcp-kit = { path = "../../libs/mcp-kit" }`); kept apart from ai-circus-shared on purpose, so the
# standalone stack can ship it without the framework.
[project]
name = "mcp-kit"
version = "0.1.0"
description = "Identity, access policy and per-API token exchange for MCP servers in front of existing APIs."
authors = [{ name = "Angel Martinez-Tenor", email = "angelmtenor@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Same pin as the framework's MCP doors (ADR 0019): fast-moving, minor-pinned.
    "fastmcp>=4.1.8,<4.2",
    "httpx>=0.28.1",
    "PyJWT[crypto]>=2.9.0",
    "PyYAML>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_kit"]

[dependency-groups]
dev = ["pytest>=8.3.5", "ruff>=0.11.8"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
