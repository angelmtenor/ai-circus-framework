<text x="1212" y="188" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">dbt: silver (clean, pseudonymised)</text>
<text x="1212" y="202" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">then gold marts, with tests</text>
<text x="1212" y="234" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">dbt-core · CronJob</text>
<rect x="1200" y="262" width="240" height="92" rx="10" fill="#20220a" stroke="#cddc39" stroke-width="1.6" stroke-dasharray="5 4"/>
