<text x="1212" y="412" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">Columnar copy of silver,</text>
<text x="1212" y="426" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">gold rebuilt in place</text>
<text x="1212" y="458" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">ClickHouse</text>
