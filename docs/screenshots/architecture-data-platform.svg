<text x="1212" y="300" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">Sensors on new bronze,</text>
<text x="1212" y="314" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">asset checks, lineage</text>
<text x="1212" y="346" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">Dagster</text>
