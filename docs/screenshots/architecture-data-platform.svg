<text x="1472" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#ffca28">DATA-API</text>
<text x="1472" y="188" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">Metrics, records + trail, governed</text>
<text x="1472" y="202" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">SQL, lineage, SSE, simulator</text>
<text x="1472" y="234" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">FastAPI + sqlglot</text>
<rect x="1460" y="262" width="240" height="92" rx="10" fill="#2a2008" stroke="#ffca28" stroke-width="1.6"/>
<text x="1472" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#ffca28">ASSISTANT</text>
<text x="1472" y="300" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">Data tools, catalogue tools,</text>
<text x="1472" y="314" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">ml_predict on the exported marts</text>
<text x="1472" y="346" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">FastAPI + LangChain</text>
<rect x="1460" y="374" width="240" height="92" rx="10" fill="#08211d" stroke="#2dd4bf" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="1472" y="394" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#2dd4bf">SUPERSET</text>
<text x="1472" y="412" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">Dashboards as code with</text>
<text x="1472" y="426" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">row-level security</text>
<text x="1472" y="458" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">Apache Superset</text>
<text x="1690" y="394" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-style="italic" fill="#2dd4bf" fill-opacity="0.85">bi tier</text>
<rect x="1460" y="486" width="240" height="92" rx="10" fill="#2a0f1e" stroke="#f472b6" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="1472" y="506" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#f472b6">OPENMETADATA</text>
<text x="1472" y="524" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">Catalogue, contracts, lineage</text>
<text x="1472" y="538" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">topic → bronze → dbt → dashboard</text>
<text x="1472" y="570" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">OpenMetadata</text>
<text x="1690" y="506" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-style="italic" fill="#f472b6" fill-opacity="0.85">governance tier</text>
<rect x="40" y="610" width="1660" height="150" rx="14" fill="#b388ff" fill-opacity="0.04" stroke="#b388ff" stroke-opacity="0.5" stroke-dasharray="3 4"/>
<text x="56" y="632" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#b388ff">TENANCY &amp; GOVERNANCE-READY — transversal, every contract open, every switch off by default</text>
<text x="56" y="652" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">Tenant = Keycloak Organization on every door: topic, bucket prefix, schema, API call. A role then adds row filters and column masks (ai_circus_shared.data_policy).</text>
<rect x="56" y="668" width="316" height="74" rx="8" fill="#160f2b" stroke="#b388ff" stroke-opacity="0.7"/>
<text x="66" y="688" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#b388ff">Policy decision point</text>
<text x="66" y="705" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#c9d8e6">llm-gateway asks noop / static / OPA / HTTP;</text>
<text x="66" y="718" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#c9d8e6">allow, deny, degrade</text>
<rect x="380" y="668" width="316" height="74" rx="8" fill="#160f2b" stroke="#b388ff" stroke-opacity="0.7"/>
<text x="390" y="688" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#b388ff">CloudEvents</text>
<text x="390" y="705" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#c9d8e6">content-free events over a log line or an</text>
<text x="390" y="718" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#c9d8e6">HMAC webhook with an outbox</text>
<rect x="704" y="668" width="316" height="74" rx="8" fill="#160f2b" stroke="#b388ff" stroke-opacity="0.7"/>
<text x="714" y="688" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#b388ff">Hash-chained audit</text>
<text x="714" y="705" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#c9d8e6">every admin mutation, verifiable at</text>
<text x="714" y="718" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#c9d8e6">/governance/audit/verify</text>
<rect x="1028" y="668" width="316" height="74" rx="8" fill="#160f2b" stroke="#b388ff" stroke-opacity="0.7"/>
<text x="1038" y="688" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#b388ff">Decision records</text>
<text x="1038" y="705" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#c9d8e6">non-LLM predictions kept with enforced</text>
<text x="1038" y="718" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#c9d8e6">retention</text>
<rect x="1352" y="668" width="316" height="74" rx="8" fill="#160f2b" stroke="#b388ff" stroke-opacity="0.7"/>
<text x="1362" y="688" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#b388ff">AI-BOM</text>
<text x="1362" y="705" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#c9d8e6">CycloneDX 1.6 inventory at</text>
<text x="1362" y="718" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#c9d8e6">/governance/inventory</text>
<text x="870.0" y="786" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#5c7288">Dashed border = optional tier (analytics · bi · governance). Core = Kafka, data-ingest, data-transform, data-api. See architecture-detailed.svg for the rest of the platform.</text>
