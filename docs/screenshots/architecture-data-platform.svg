<text x="922" y="202" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">per data product</text>
<text x="922" y="234" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">Postgres  data_platform</text>
<rect x="910" y="262" width="240" height="92" rx="10" fill="#06232a" stroke="#22d3ee" stroke-width="1.6"/>
<text x="922" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#22d3ee">ICEBERG LAKE</text>
<text x="922" y="300" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">One day-partitioned table</text>
<text x="922" y="314" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">per source</text>
<text x="922" y="346" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">PyIceberg on SeaweedFS</text>
<rect x="1200" y="150" width="240" height="92" rx="10" fill="#20220a" stroke="#cddc39" stroke-width="1.6"/>
