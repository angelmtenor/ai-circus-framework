<rect x="40" y="150" width="240" height="92" rx="10" fill="#14161c" stroke="#8b93a1" stroke-width="1.6"/>
<text x="52" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#8b93a1">EVENT PRODUCERS</text>
<text x="52" y="188" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">Tills and web orders (simulator</text>
<text x="52" y="202" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">plugin shipped by the scenario)</text>
<text x="52" y="234" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">Python plugin</text>
<rect x="40" y="262" width="240" height="92" rx="10" fill="#14161c" stroke="#8b93a1" stroke-width="1.6"/>
<text x="52" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#8b93a1">DAILY FILES</text>
<text x="52" y="300" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">Legacy tills + migration files</text>
<text x="52" y="314" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">with control totals</text>
<text x="52" y="346" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">CSV / JSON</text>
<rect x="40" y="374" width="240" height="92" rx="10" fill="#14161c" stroke="#8b93a1" stroke-width="1.6"/>
<text x="52" y="394" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#8b93a1">ERP DATABASE</text>
<text x="52" y="412" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">Operational tables</text>
<text x="52" y="426" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">(data_sources)</text>
<text x="52" y="458" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">PostgreSQL</text>
<rect x="330" y="150" width="240" height="92" rx="10" fill="#06232a" stroke="#22d3ee" stroke-width="1.6"/>
<text x="342" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#22d3ee">KAFKA</text>
<text x="342" y="188" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">A topic per tenant:</text>
<text x="342" y="202" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">tenant-&lt;org&gt;.&lt;topic&gt;</text>
<text x="342" y="234" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">Kafka (KRaft)</text>
<rect x="330" y="262" width="240" height="92" rx="10" fill="#06232a" stroke="#22d3ee" stroke-width="1.6"/>
<text x="342" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#22d3ee">LANDING BUCKET</text>
<text x="342" y="300" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">Raw files, reconciled against</text>
<text x="342" y="314" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">their control totals</text>
<text x="342" y="346" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">SeaweedFS (S3)</text>
<rect x="330" y="374" width="240" height="92" rx="10" fill="#06232a" stroke="#22d3ee" stroke-width="1.6"/>
<text x="342" y="394" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#22d3ee">CDC</text>
<text x="342" y="412" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">Logical replication of the</text>
<text x="342" y="426" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">ERP tables into Kafka</text>
<text x="342" y="458" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">ai_circus_shared.cdc</text>
<rect x="620" y="150" width="240" height="92" rx="10" fill="#20220a" stroke="#cddc39" stroke-width="1.6"/>
<text x="632" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#cddc39">DATA-INGEST</text>
<text x="632" y="188" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">JSON Schema contract + business rules,</text>
<text x="632" y="202" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">quarantine, idempotent upsert by key,</text>
<text x="632" y="216" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c9d8e6">hot minute aggregates, lake archiver</text>
<text x="632" y="234" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#607890">FastAPI workers</text>
<rect x="910" y="150" width="240" height="92" rx="10" fill="#06232a" stroke="#22d3ee" stroke-width="1.6"/>
