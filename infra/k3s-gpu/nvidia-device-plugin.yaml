# Baked into ai-circus/k3s-gpu (infra/k3s-gpu/Dockerfile) and auto-applied by k3s.
# Pods that want a GPU set `runtimeClassName: nvidia` and request `nvidia.com/gpu` —
# exactly what data-platform-manager's dl-training Job builder does when a node
# advertises one (services/data-platform-manager/.../core/k8s_jobs.py).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      runtimeClassName: nvidia
      priorityClassName: system-node-critical
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        # v0.19.1+ supports WSL2 (reports the single WSL GPU as one device).
        - image: nvcr.io/nvidia/k8s-device-plugin:v0.20.1
          name: nvidia-device-plugin-ctr
          env:
            - {name: FAIL_ON_INIT_ERROR, value: "false"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - {name: device-plugin, mountPath: /var/lib/kubelet/device-plugins}
      volumes:
        - name: device-plugin
          hostPath: {path: /var/lib/kubelet/device-plugins}
