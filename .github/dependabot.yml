  - package-ecosystem: "uv"
    directory: "/services/llm-gateway"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/services/platform-registry"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
