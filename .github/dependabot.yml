# Dependabot version updates (plan item C.8). One "uv" entry per services/*/ project
# plus libs/shared (each is an independent uv-managed project — see root CLAUDE.md),
# and one "npm" entry for ui-react. Weekly schedule; minor/patch bumps are grouped
# into a single PR per ecosystem per week to avoid a PR storm — major bumps still
# open individually since those are more likely to need manual review.
#
# Behavioral note for the human operator: merging this turns on automatic PRs going
# forward. Don't auto-merge the first round — review grouping/schedule behavior
# manually before trusting it.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/services/assistant"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/services/etl-tabular"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/services/etl-vectorize"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/services/form-agent"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/services/llm-gateway"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/services/platform-registry"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/services/prediction"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/services/rag-agent"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/services/training"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/libs/shared"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/ui-react"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
